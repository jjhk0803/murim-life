const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function makeZip(files){const enc=new TextEncoder(),parts=[],cen=[];let off=0; // 압축 없이 담는 zip
  for(const [name,data] of files){const nm=enc.encode(name),crc=crc32(data),h=new DataView(new ArrayBuffer(30)),c=new DataView(new ArrayBuffer(46));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(12,0x21,true);h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,nm.length,true);
    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(14,0x21,true);c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);
    parts.push(h.buffer,nm,data);cen.push(c.buffer,nm);off+=30+nm.length+data.length;}
  const csz=cen.reduce((a,x)=>a+x.byteLength,0),e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,csz,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cen,e.buffer],{type:'application/zip'});}
async function exportPack(g){g.busy=1;g.msg='묶음을 만드는 중…';render();
  try{const db=await idb();const keys=await new Promise((res,rej)=>{const q=db.transaction('img').objectStore('img').getAllKeys();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});
    const ks=keys.filter(k=>typeof k==='string'&&!k.startsWith('pc:')&&!k.startsWith('raw:')&&!k.startsWith('wk:'));if(!ks.length)throw new Error('내보낼 내 그림이 없어요. 먼저 그림을 그리거나 넣어 주세요.');
    await MANP;const man=Object.assign({},MAN||{}),files=[];
    for(const k of ks){let b=await imgGet(k);if(!b)continue;if(g.webp!==false)b=await toWebp(b);const u8=new Uint8Array(await b.arrayBuffer()),ty=imgType(u8);const p=repoPath(k,ty==='image/webp'?'webp':ty==='image/jpeg'?'jpg':'png');man[k]=p;files.push(['img/'+p,u8]);}
    files.push(['img/index.json',new TextEncoder().encode(JSON.stringify({v:1,files:man},null,1))]);download(makeZip(files),'murim-img.zip');
    g.msg=`${files.length-1}장을 묶었어요. 압축을 풀어 나온 img 폴더를 저장소 맨 위(index.html 옆)에 올리면, 그 주소로 들어오는 모든 사람에게 보여요.`;}
  catch(e){g.msg='묶지 못했어요: '+e.message;}finally{g.busy=0;render();}}
// 깃허브에 바로 올리기: 저장소의 img 폴더와 index.json을 한 번의 커밋으로 갱신한다. 바뀐 그림만 올린다.
const ghDefault=()=>{try{const h=location.hostname;if(h.endsWith('.github.io')){const u=h.split('.')[0],p=location.pathname.split('/')[1];return u+'/'+(p||h);}}catch(e){}return '';};
function b64(u8){let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s);}
async function gitSha(u8){try{if(!(window.crypto&&crypto.subtle))return null;const h=new TextEncoder().encode('blob '+u8.length+'\0'),a=new Uint8Array(h.length+u8.length);a.set(h);a.set(u8,h.length);return [...new Uint8Array(await crypto.subtle.digest('SHA-1',a))].map(x=>x.toString(16).padStart(2,'0')).join('');}catch(e){return null;}}
async function ghPush(g){const c=ncfg(),repo=(c.ghRepo||ghDefault()).trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').replace(/\/$/,''),br=(c.ghBranch||'main').trim(),tok=(c.ghToken||'').trim();
  if(!tok){g.msg='깃허브 토큰을 먼저 넣어 주세요.';render();return;}
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)){g.msg='저장소는 아이디/이름 꼴로 적어 주세요. 예: jjhk0803/murim-life';render();return;}
  g.busy=1;const say=t=>{g.msg=t;soon();};
  const api=async(p,o)=>{o=o||{};const r=await fetch(`https://api.github.com/repos/${repo}${p}`,{method:o.method||'GET',cache:'no-store',headers:Object.assign({Authorization:'Bearer '+tok,Accept:'application/vnd.github+json'},o.body?{'Content-Type':'application/json'}:{}),body:o.body?JSON.stringify(o.body):undefined});
    if(!r.ok){if(o.ok404&&r.status===404)return null;let t='';try{t=(await r.json()).message||'';}catch(e){}
      throw new Error(r.status===401?'토큰이 맞지 않거나 만료되었어요.':r.status===403?'토큰에 이 저장소의 Contents 쓰기 권한이 없어요.'+(t?` (${t})`:''):r.status===404?'저장소나 브랜치를 찾지 못했어요. 토큰이 이 저장소에 접근할 수 있는지도 확인해 주세요.':(r.status===409||r.status===422)?'그사이 저장소가 바뀌었어요. 다시 눌러 주세요.'+(t?` (${t})`:''):`GitHub 오류 ${r.status}${t?' '+t:''}`);}
    return r.status===204?null:r.json();};
  try{say('저장소를 확인하는 중…');
    const ref=await api(`/git/ref/heads/${encodeURI(br)}`),base=ref.object.sha,bc=await api(`/git/commits/${base}`);
    const tr=await api(`/git/trees/${bc.tree.sha}?recursive=1`),have=new Map((tr.tree||[]).filter(t=>t.type==='blob').map(t=>[t.path,t.sha]));
    let man={};const mf=await api(`/contents/img/index.json?ref=${encodeURIComponent(br)}`,{ok404:1});
    if(mf&&mf.content){try{const j=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(mf.content.replace(/\s/g,'')),ch=>ch.charCodeAt(0))));man=Object.assign({},j.files||j);}catch(e){}}
    const old=JSON.stringify(man);
    const db=await idb();const keys=(await new Promise((res,rej)=>{const q=db.transaction('img').objectStore('img').getAllKeys();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);})).filter(k=>typeof k==='string'&&!/^(pc|raw|wk):/.test(k));
    if(!keys.length)throw new Error('올릴 내 그림이 없어요. 먼저 그림을 그리거나 넣어 주세요.');
    const entries=[];let done=0,skip=0;
    const one=async k=>{let b=await imgGet(k);if(!b)return;if(g.webp!==false)b=await toWebp(b);
      const u8=new Uint8Array(await b.arrayBuffer()),ty=imgType(u8),p=repoPath(k,ty==='image/webp'?'webp':ty==='image/jpeg'?'jpg':'png'),path='img/'+p;
      if(man[k]&&man[k]!==p&&have.has('img/'+man[k]))entries.push({path:'img/'+man[k],mode:'100644',type:'blob',sha:null}); // 확장자가 바뀌면 옛 파일은 지운다
      man[k]=p;const sha=await gitSha(u8);
      if(sha&&have.get(path)===sha)skip++;else{const bl=await api('/git/blobs',{method:'POST',body:{content:b64(u8),encoding:'base64'}});entries.push({path,mode:'100644',type:'blob',sha:bl.sha});}
      done++;say(`올리는 중… ${done}/${keys.length}`);};
    for(let i=0;i<keys.length;i+=3)await Promise.all(keys.slice(i,i+3).map(one));
    const n=entries.filter(e=>e.sha).length;
    if(!n&&JSON.stringify(man)===old){g.msg=`바뀐 그림이 없어요. 모두 ${skip}장이 이미 저장소에 있어요.`;return;}
    entries.push({path:'img/index.json',mode:'100644',type:'blob',content:JSON.stringify({v:1,files:man},null,1)});
    say('커밋을 만드는 중…');
    const t=await api('/git/trees',{method:'POST',body:{base_tree:bc.tree.sha,tree:entries}});
    const cm=await api('/git/commits',{method:'POST',body:{message:`그림 ${n}장 올리기 (게임 안 그림 관리에서)`,tree:t.sha,parents:[base]}});
    await api(`/git/refs/heads/${encodeURI(br)}`,{method:'PATCH',body:{sha:cm.sha}});
    MAN=Object.assign({},MAN||{},man);
    g.msg=`그림 ${n}장을 저장소에 올렸어요${skip?` (그대로인 ${skip}장은 건너뜀)`:''}. 깃허브 페이지에는 1~3분 뒤 반영돼요.`;}
  catch(e){g.msg='올리지 못했어요: '+e.message;}finally{g.busy=0;render();}}
async function importFiles(g,fl){let ok=0;const bad=[];for(const f of fl){const k=keyFromName(f.name);if(!k||(f.type&&!/^image\//.test(f.type))){bad.push(f.name);continue;}try{await storeSlot(k,f);ok++;}catch(e){bad.push(f.name);}}

  const m1=document.getElementById('main');if(m1)m1.scrollTop=resetScroll?0:st;resetScroll=false;
  const sh1=document.querySelector('.sheet');if(sh1){if(sameM)sh1.scrollTop=sst;else if(modal&&modal.sst!=null){sh1.scrollTop=modal.sst;modal.sst=null;}} // 하위 창에서 돌아오면 목록 스크롤을 되살린다
  const eh1=document.getElementById('edhost');if(eh1&&ED&&ED.cv){eh1.appendChild(ED.cv);eh1.scrollLeft=ED.sl||0;eh1.scrollTop=ED.st||0;}
  if(fid){const el=document.getElementById(fid);if(el){el.focus({preventScroll:true});if(sel)try{el.setSelectionRange(sel[0],sel[1]);}catch(e){}}}}
function closeModal(){modal=modal&&modal.back||null;render();} // 하위 창은 부모 창으로 돌아간다
function readNaiForm(){const c=modal.c;c.key=document.getElementById('n_key').value;c.model=document.getElementById('n_model').value;c.relay=document.getElementById('n_relay').value.trim();c.autoEv=document.getElementById('n_autoEv').checked;c.autoPc=document.getElementById('n_autoPc').checked;c.useRepo=document.getElementById('n_repo').checked;}
function slotTitle(k){const [t,id]=k.split(/:(.+)/);if(t==='st')return `스탠딩 · ${safe(()=>npcNick(id,S))} ${NPCS[id].n}`;return t==='map'?'중원 지도':t==='reg'?`지역 · ${REG_KO[id]||id}`:t==='pc'?`${S.name}의 초상`:t==='npc'?`${safe(()=>npcNick(id,S))} ${NPCS[id].n}`:`장면 · ${safe(()=>evTitle(S,EVM[id]))||id}`;}
app.addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a;
  if(a==='reroll'){S=newFate(document.getElementById('nm').value.trim(),S.sex,{...S.yc,remove:[]});render();}
  else if(a==='yt'){S.yc.t[b.dataset.k]+=+b.dataset.d;S=buildFate(S.base,S.yc);render();}
  else if(a==='yo'){S.yc.origin=S.yc.origin===b.dataset.v?null:b.dataset.v;S=buildFate(S.base,S.yc);render();}
  else if(a==='ytr'){S.yc.trait=S.yc.trait===b.dataset.v?null:b.dataset.v;S=buildFate(S.base,S.yc);render();}
  else if(a==='yrm'){const v=b.dataset.v;S.yc.remove=S.yc.remove.includes(v)?S.yc.remove.filter(x=>x!==v):[...S.yc.remove,v];S=buildFate(S.base,S.yc);render();}
  else if(a==='ygold'){S.yc.gold+=+b.dataset.d;S=buildFate(S.base,S.yc);render();}
  else if(a==='ymem'){S.yc.mem=!S.yc.mem;S=buildFate(S.base,S.yc);render();}
  else if(a==='view'){view=b.dataset.v;resetScroll=true;render();}
  else if(a==='msel'){mapSel=b.dataset.r;render();const pl=document.querySelector('.map + .plate');if(pl)pl.scrollIntoView({block:'nearest',behavior:'smooth'});}
  else if(a==='travel')travel(b.dataset.r);
  else if(a==='rname'){S.base.name=S.name=randName(S.sex);render();}
  else if(a==='sex'){S.base.sex=b.dataset.v;S=buildFate(S.base,S.yc);render();}
  else if(a==='start'){const c=ycCost(S.yc),v=ycPts();if(c>v.pts)return;v.pts-=c;ycSave(v);S.name=document.getElementById('nm').value.trim()||randName(S.sex);view='ev';resetScroll=true;addLog(S,`${ORIGINS.find(o=>o.id===S.origin).n}로 태어났다.`,1);openEvent(S,chooseEvent(S));save();render();if(ncfg().autoPc)autoDraw('pc:'+S.lifeId,pcPrompt(S),true);}
  else if(a==='ch')choose(+b.dataset.i);
  else if(a==='next'){if(S.pendingWpn){const el=document.getElementById('wname');commitWpn(S,el?el.value:'');}if(S.phase==='death'||S.dead)endLife();else if(S.chain){const c=S.chain;S.chain=null;openEvent(S,c);view='ev';resetScroll=true;save();render();}else nextYear();}
  else if(a==='again'){S=newFate(null,null,{...ycNew()});tab='ab';view='ev';resetScroll=true;save();render();}
  else if(a==='tab'){tab=b.dataset.t;render();}
  else if(a==='mainw'){S.mainW=b.dataset.w;save();render();}
  else if(a==='ck'){const c=S.tmp.craft,k=b.dataset.k;c.sel=c.sel.includes(k)?c.sel.filter(x=>x!==k):c.sel.length<3?[...c.sel,k]:c.sel;render();}
  else if(a==='cw'){S.tmp.craft.w=b.dataset.w;render();}
  else if(a==='cback'){S.phase='event';S.tmp.craft=null;render();}
  else if(a==='craft')doCraft();
  else if(a==='fm'){S.tmp.forge.m=b.dataset.m;S.tmp.forge.def=forgeDefault(S,S.tmp.forge);render();}
  else if(a==='fw'){S.tmp.forge.w=b.dataset.w;S.tmp.forge.def=forgeDefault(S,S.tmp.forge);render();}
  else if(a==='fback'){S.phase='event';S.tmp.forge=null;render();}
  else if(a==='forge')doForge();
  else if(a==='wname'){commitWpn(S,document.getElementById('wname').value);S.res.chips.push({t:'병기 얻음',up:true});save();render();}
  else if(a==='equip'){S.wpn={...S.wpns[+b.dataset.i]};save();render();}
  else if(a==='nai'){modal={t:'nai',c:ncfg()};render();}
  else if(a==='nsave'){readNaiForm();const c=ncfg();['key','model','relay','autoEv','autoPc','useRepo'].forEach(x=>c[x]=modal.c[x]);nsave(c);modal=modal.back||null;render();toast('설정을 저장했어요.');}
  else if(a==='draw'){const k=b.dataset.k;modal={t:'draw',k,title:slotTitle(k),prompt:slotPrompt(k),err:''};render();}
  else if(a==='ngen'){modal.prompt=document.getElementById('n_prompt').value;savePr(modal.k,modal.prompt);drawSlot(modal.k,modal.prompt,isPort(modal.k));}
  else if(a==='gal'){modal={t:'gal',tab:'style',back:modal};render();}
  else if(a==='gtab'){modal.tab=b.dataset.v;modal.msg='';modal.sure=0;render();}
  else if(a==='gbatch'){if(!ncfg().key.trim()){modal.msg='한꺼번에 그리려면 설정에 NovelAI 토큰이 필요해요. 토큰 없이 다른 곳에서 그렸다면 \'여러 장 넣기\'를 쓰세요.';render();}
    else if(!modal.sure){modal.sure=1;render();}else{modal.sure=0;runBatch(galKeys(modal.tab).filter(k=>!imgSrc(k)));}}
  else if(a==='gnosure'){modal.sure=0;render();}
  else if(a==='gdev'){modal.dev=!modal.dev;render();}
  else if(a==='gstop'){if(BATCH)BATCH.stop=true;render();}
  else if(a==='ncut'){openEditor(modal.k);}
  else if(a==='etool'&&ED){ED.tool=b.dataset.v;render();}
  else if(a==='ebg'&&ED){ED.bg=b.dataset.v;render();}
  else if(a==='ezoom'&&ED){ED.zoom=+b.dataset.v;ED.cv.style.width=ED.zoom*100+'%';render();}
  else if(a==='eundo'&&ED&&ED.undo.length){ED.work.data.set(ED.undo.pop());ED.cx.putImageData(ED.work,0,0);render();}
  else if(a==='eauto'&&ED){edPush(ED);ED.work.data.set(ED.orig.data);autoMask(ED.work.data,ED.W,ED.H,ED.tol,false);ED.cx.putImageData(ED.work,0,0);render();}
  else if(a==='eorig'&&ED){edPush(ED);ED.work.data.set(ED.orig.data);ED.cx.putImageData(ED.work,0,0);render();}
  else if(a==='esave'){edSave();}
  else if(a==='gslot'){const k=b.dataset.k,sh=document.querySelector('.sheet');modal.sst=sh?sh.scrollTop:0;modal={t:'draw',k,title:slotTitle(k),prompt:slotPrompt(k),err:'',back:modal};render();}
  else if(a==='gpreset'){const c=ncfg();c.style=STYLE_PRESETS[+b.dataset.i][1];nsave(c);render();}
  else if(a==='gcopy'){const w=b.dataset.w;copyText(w==='pv'?fullPrompt('st:seorin'):w==='neg'?((ncfg().neg||'').trim()||NAI_NEG):fullPrompt(modal.k,modal.prompt));}
  else if(a==='gexport'){exportPack(modal);}
  else if(a==='ghpush'){ghPush(modal);}
  else if(a==='nreset'){const c=ncfg();delete c.pr[modal.k];nsave(c);modal.prompt=basePrompt(modal.k);render();}
  else if(a==='nsavefile'){const k=modal.k;imgGet(k).then(bl=>{if(bl)bl.arrayBuffer().then(ab=>{const t=imgType(new Uint8Array(ab));download(bl,fileName(k).replace(/png$/,t==='image/webp'?'webp':t==='image/jpeg'?'jpg':'png'));});});}
  else if(a==='ndel'){const k=modal.k;Promise.all([imgDel(k),imgDel('raw:'+k),imgDel('wk:'+k)]).then(()=>{setImg(k,null);render();});}
  else if(a==='mclose')closeModal();
  else if(a==='mbg'){if(ev.target===b)closeModal();}
  else if(a==='quit'){if(modal&&modal.sure){S=newFate();modal=null;tab='ab';view='ev';resetScroll=true;save();render();}else if(modal){modal.sure=1;render();}}
});
app.addEventListener('input',ev=>{if(ev.target.id==='evinp'){S.tmp.inp=ev.target.value;return;}if(ED&&modal&&modal.t==='edit'){const id=ev.target.id;if(id==='e_tol'||id==='e_size'){ED[id==='e_tol'?'tol':'size']=+ev.target.value;const v=document.getElementById(id+'v');if(v)v.textContent=ev.target.value;return;}}if(ev.target.id==='nm'&&S.phase==='birth'){S.name=S.base.name=ev.target.value;}if(ev.target.id==='cname'&&S.tmp.craft)S.tmp.craft.name=ev.target.value;if(ev.target.id==='fname'&&S.tmp.forge)S.tmp.forge.name=ev.target.value;if(ev.target.id==='n_prompt'&&modal){modal.prompt=ev.target.value;savePr(modal.k,modal.prompt);const f=document.getElementById('n_full');if(f)f.textContent=fullPrompt(modal.k,modal.prompt);}
  if(modal&&modal.t==='gal'&&/^g_gh/.test(ev.target.id)){const c=ncfg(),v=id=>{const e=document.getElementById(id);return e?e.value.trim():'';};c.ghRepo=v('g_ghRepo');c.ghBranch=v('g_ghBranch')||'main';c.ghToken=v('g_ghToken');nsave(c);return;}
  if(modal&&modal.t==='gal'&&/^g_(style|tnpc|tev|tmap|neg|q)$/.test(ev.target.id)){const c=ncfg(),v=id=>document.getElementById(id).value;c.style=v('g_style');c.tnpc=v('g_tnpc');c.tev=v('g_tev');c.tmap=v('g_tmap');c.neg=v('g_neg');c.q=document.getElementById('g_q').checked;nsave(c);const pv=document.getElementById('g_pv');if(pv)pv.textContent=fullPrompt('st:seorin');}if(modal&&modal.t==='nai'&&ev.target.id.startsWith('n_'))readNaiForm();});
app.addEventListener('change',ev=>{if(modal&&modal.t==='gal'){const id=ev.target.id;if(id==='g_miss'){modal.miss=ev.target.checked;render();return;}if(id==='g_webp'){modal.webp=ev.target.checked;return;}if(id==='g_q'){const c=ncfg();c.q=ev.target.checked;nsave(c);render();return;}if(id==='g_files'&&ev.target.files.length){importFiles(modal,[...ev.target.files]);return;}if(id==='g_autocut'){const c=ncfg();c.autoCut=ev.target.checked;nsave(c);return;}}
  if(modal&&modal.t==='edit'&&ED&&ev.target.id==='e_contig'){ED.contig=ev.target.checked;return;}if(modal&&modal.t==='nai'&&ev.target.id.startsWith('n_'))readNaiForm();if(ev.target.id==='n_file'&&modal&&ev.target.files[0]){const k=modal.k,f=ev.target.files[0];const m=modal;storeSlot(k,f).then(()=>render()).catch(e=>{m.err='그림을 저장하지 못했어요: '+e.message;render();});}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&modal){ev.preventDefault();closeModal();return;}const g=ev.target.closest&&ev.target.closest('.mn');if(g&&(ev.key==='Enter'||ev.key===' ')){ev.preventDefault();mapSel=g.dataset.r;render();}});

function start(data){
  let s=data&&data.S;
  if(!s){try{s=migrate(JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('murim-life-v4')||localStorage.getItem(OLDKEY)||'null'));}catch(e){}}
  S=s||newFate();render();}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
