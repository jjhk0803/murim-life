 return AI_SYS=`너는 한국어 무협 인생 시뮬레이션 「무림인생」의 이야기꾼이다. 주인공이 이번 해에 겪을 사건 하나를 짓는다.

문체
- 무협 문학의 결로 쓴다. 짧고 감각적인 문장, 풍경 한 줄과 사람의 숨결. 설명보다 장면.
- 실제 소설·웹소설·게임의 대사나 문장을 베끼지 말고 새로 쓴다.
- 서술은 '당신'을 주어로 한 과거형(…했다). 인물의 말은 “ ”로 감싼다.
- text는 2~6문장, 400자 안쪽. 인물이 나오면 그 인물다운 대사를 한두 마디 넣는다.

처지를 지킨다
- 주인공의 진영·직업·나이·경지·인연에 맞춘다. 정파와 마교는 서로 원수다. 적대 진영 인물은 주인공을 칭찬하거나 같은 편처럼 대하지 않는다. 경계·조롱·적의를 보이고, 호감이 높으면 남의 눈을 피해 만나는 긴장이 있다.
- 정파(백도)는 협의와 체면, 아름다움. 그 안에 썩은 자도 있다. 사파(흑도)는 의리와 낭만, 술과 칼. 마교는 계략과 위계, 천마를 받든다.
- 무림인이 아닌 직업(점소이·객잔 주인·대장장이·의원)이면 그 일터에서 벌어지는 일로 짓는다.
- 등장 인물은 아래 명부의 id만 쓴다. 죽은 인물은 회상으로만 나온다. 명부에 없는 사람은 이름 없는 사람(늙은 길손, 소년 표사 등)으로만 쓴다.
- 최근 일과 겹치지 않게, 최근 AI 이야기 제목과 다른 이야기를 짓는다.
- 천마를 죽이거나 문파를 멸문시키는 것처럼 세상을 뒤집는 일은 짓지 않는다. 그런 일은 게임의 큰 사건이 맡는다.
- 연애는 은근하게 쓴다. 노골적인 성 묘사와 지나친 잔혹 묘사는 쓰지 않는다.
- 플레이어의 바람이 있으면 주인공의 처지에 어긋나지 않는 선에서 따른다.

선택지
- choices는 3개(2~4개). 서로 성격이 다른 길로 만든다. 예: 칼, 말, 마음.
- t: 15자 안쪽의 행동. hint: 무엇이 걸렸는지 짧게(예: '구력', '체력이 줄 수 있다'). 없으면 빈 문자열.
- result: 고른 뒤의 결과 1~3문장.
- effects: 바뀌는 수치. k는 정해진 이름만, v는 정수. 대부분 작게 준다(명성 2~15, 도덕 ±2~8, 은자 ±5~60, 심상 ±5~15). 바뀌는 게 없으면 빈 배열.
  fame 명성, moral 도덕(+협의 −악행), gold 은자, hp 체력(−는 다침), mood 심상, contrib 사문 공헌, ng 내공(년), tongue 구력, lore 학문, cult 수양, mind 심계, savvy 처세, med 의술, forge 단조, qing 경공, enemies 원한(+1이면 원수가 생김), salgi 살기, exp 깨달음(0~10, 10이면 한 해 수련만큼)
- rel: 호감이 바뀌는 인물 id와 값(−20~20). 없으면 빈 배열.
- battle: 싸움이 붙는 선택지에만 foe(상대 이름), lvl(주인공 경지 대비 −2~1), win(이겼을 때 한두 문장), lose(졌을 때 한두 문장)를 채운다. 싸움이 없으면 foe·win·lose는 빈 문자열, lvl은 0. 싸움은 많아야 한 선택지에만.
- deed: 평생 기록에 남길 만한 일이면 한 줄(예: '폭우 속에서 나룻배 한 척을 건졌다'). 아니면 빈 문자열.
- npc: 이 사건의 중심 인물 id. 없으면 빈 문자열.
- title: 사건 제목, 2~8자.

[경지] ${REALMS.map(r=>r.n).join(' < ')}

[인물 명부] id: 별호 이름 · 소속 · 성별 · 설명
${Object.entries(NPCS).map(([id,p])=>`${id}: ${npcNick(id,null)||''} ${p.n} · ${side(p.org)} · ${p.sex==='f'?'여':'남'} · ${p.d}`).join('\n')}`;}

 return [`[주인공] ${S.name} · ${S.sex==='m'?'남':'여'} · ${S.age}세 · 지금 ${S.loc}`,

const aiErr=(st,t,who)=>{let m='';try{const j=JSON.parse(t);m=(Array.isArray(j)?j[0]:j).error.message;}catch(e){m=String(t||'').slice(0,120);}
 return st===401||st===403||(st===400&&/api[ _-]?key/i.test(m))?`${who||'AI'} 키가 맞지 않거나 쓸 수 없어요. 설정에서 키를 확인해 주세요.${m?' ('+m+')':''}`:st===404?`모델 이름이나 API 주소를 확인해 주세요.${m?' ('+m+')':''}`:st===429?'요청이 너무 많거나 사용량을 다 썼어요. 잠시 뒤에 다시 해 보세요.':st>=500?`${who||'AI'} 서버가 바빠요. 잠시 뒤에 다시 해 보세요.`:`요청이 거절됐어요 (${st}). ${m}`;};
const AI_REFUSED='AI가 이 이야기는 짓지 않겠다고 했어요. 다른 바람으로 다시 해 보세요.',AI_LONG='이야기가 너무 길어 끊겼어요. 다시 해 보세요.';

const JSON_SHAPE=`\n\n[출력 형식] 아래 모양의 JSON 하나만 출력한다. 설명이나 코드 블록을 붙이지 않는다.
{"title":"제목","text":"본문","npc":"인물 id 또는 빈 문자열","choices":[{"t":"행동","hint":"","result":"결과","effects":[{"k":"fame","v":5}],"rel":[{"id":"인물 id","n":5}],"battle":{"foe":"","lvl":0,"win":"","lose":""},"deed":""}]}
effects의 k는 다음 중 하나만 쓴다: ${Object.keys(AI_FX).join(', ')}. 인물의 말은 “ ”로 감싸고, 문자열 안에 큰따옴표(")를 쓰지 않는다.`;
const JSON_STRICT='\n\n[중요] 앞 응답은 JSON으로 읽을 수 없었다. 응답 전체가 올바른 JSON 하나여야 한다. 문자열 안의 줄바꿈은 \\n으로 쓰고, 마지막 항목 뒤에 쉼표를 두지 않는다.';
function aiLoose(t){const s=String(t||'').replace(/^﻿/,'').replace(/```(?:json|JSON)?/g,'').trim(),a=s.indexOf('{'),b=s.lastIndexOf('}');if(a<0||b<=a)throw new Error('no json');
 const x=s.slice(a,b+1);try{return JSON.parse(x);}catch(e){return JSON.parse(x.replace(/,\s*([}\]])/g,'$1'));}}
async function aiCall(sys,user,spec){spec=spec||{schema:AI_SCHEMA,shape:JSON_SHAPE};const c=acfg();if(!aiReady(c))throw new Error('설정에서 쓸 AI의 키와 모델을 넣어 주세요.');
 if(c.prov==='anthropic')return claudeCall(c,sys,user,spec.schema);
 for(let i=0;i<2;i++){const tx=await (c.prov==='gemini'?gemCall:oaiCall)(c,sys,user+spec.shape+(i?JSON_STRICT:''));try{return aiLoose(tx);}catch(e){}}
 throw new Error('AI 응답을 읽지 못했어요. 다시 해 보거나 다른 모델을 써 보세요.');}
async function claudeCall(c,sys,user,schema){const p=aiCur(c);
 const fb=/opus-5-5|sonnet-5-5/.test(p.model); // 안전 분류기가 거절하면 서버가 다른 모델로 이어 쓴다
 const body={model:p.model,max_tokens:8000,system:[{type:'text',text:sys,cache_control:{type:'ephemeral'}}],messages:[{role:'user',content:user}],output_config:{effort:'low',format:{type:'json_schema',schema:schema||AI_SCHEMA}}};
 const h={'content-type':'application/json','x-api-key':p.key.trim(),'anthropic-version':'2026-10-21','anthropic-dangerous-direct-browser-access':'true'};
 if(fb){body.fallbacks='default';h['anthropic-beta']='server-side-fallback-2026-07-01';}
 const go=()=>aiFetch(c,'https://api.anthropic.com/v1/messages',{method:'POST',headers:h,body:JSON.stringify(body)},'Anthropic');
 let r=await go();
 if(r.status===400&&fb){const t=await r.text();if(!/fallback/i.test(t))throw new Error(aiErr(400,t,'Anthropic'));delete body.fallbacks;delete h['anthropic-beta'];r=await go();}
 if(!r.ok)throw new Error(aiErr(r.status,await r.text(),'Anthropic'));
 const j=await r.json();
 if(j.stop_reason==='refusal')throw new Error(AI_REFUSED);
 if(j.stop_reason==='max_tokens')throw new Error(AI_LONG);
 const tx=(j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
 try{return JSON.parse(tx);}catch(e){throw new Error('AI 응답을 읽지 못했어요. 다시 해 보세요.');}}
async function gemCall(c,sys,user){const p=aiCur(c);
 const body={systemInstruction:{parts:[{text:sys}]},contents:[{role:'user',parts:[{text:user}]}],generationConfig:{maxOutputTokens:16000,responseMimeType:'application/json'},
  safetySettings:['HARM_CATEGORY_HARASSMENT','HARM_CATEGORY_HATE_SPEECH','HARM_CATEGORY_SEXUALLY_EXPLICIT','HARM_CATEGORY_DANGEROUS_CONTENT'].map(k=>({category:k,threshold:'BLOCK_ONLY_HIGH'}))};
 const r=await aiFetch(c,`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(p.model.trim())}:generateContent`,{method:'POST',headers:{'content-type':'application/json','x-goog-api-key':p.key.trim()},body:JSON.stringify(body)},'Google');
 if(!r.ok)throw new Error(aiErr(r.status,await r.text(),'Gemini'));
 const j=await r.json();if(j.promptFeedback&&j.promptFeedback.blockReason)throw new Error(AI_REFUSED);
 const cand=(j.candidates||[])[0];if(!cand)throw new Error(AI_REFUSED);
 if(['SAFETY','PROHIBITED_CONTENT','BLOCKLIST','SPII','RECITATION'].includes(cand.finishReason))throw new Error(AI_REFUSED);
 if(cand.finishReason==='MAX_TOKENS')throw new Error(AI_LONG);
 return ((cand.content&&cand.content.parts)||[]).filter(x=>!x.thought).map(x=>x.text||'').join('');}
async function oaiCall(c,sys,user){const p=aiCur(c),who=(oaiPre(p)||['AI 서버'])[0],h={'content-type':'application/json',authorization:'Bearer '+p.key.trim()};
 const r=await aiFetch(c,normBase(p.base)+'/chat/completions',{method:'POST',headers:h,body:JSON.stringify({model:p.model.trim(),max_tokens:6000,messages:[{role:'system',content:sys},{role:'user',content:user}]})},who);
 if(!r.ok)throw new Error(aiErr(r.status,await r.text(),who));
 const j=await r.json(),ch=(j.choices||[])[0];if(!ch)throw new Error(`${who}가 빈 응답을 보냈어요. ${String(j.error&&j.error.message||'').slice(0,120)}`);
 if(ch.finish_reason==='content_filter')throw new Error(AI_REFUSED);if(ch.finish_reason==='length')throw new Error(AI_LONG);
 return (ch.message&&ch.message.content)||'';}
function aiClean(j){if(!j||typeof j!=='object')throw new Error('AI 응답을 읽지 못했어요.');const s=(v,n)=>String(v==null?'':v).trim().slice(0,n);
 const ch=(Array.isArray(j.choices)?j.choices:[]).slice(0,4).map(c=>({t:s(c.t,40),hint:s(c.hint,60),result:s(c.result,500),deed:s(c.deed,60),
   effects:(Array.isArray(c.effects)?c.effects:[]).filter(e=>e&&AI_FX[e.k]&&Number.isFinite(+e.v)).slice(0,6).map(e=>({k:e.k,v:clamp(Math.round(+e.v),...AI_FX[e.k])})),
   rel:(Array.isArray(c.rel)?c.rel:[]).filter(r=>r&&NPCS[r.id]).slice(0,3).map(r=>({id:r.id,n:clamp(Math.round(+r.n||0),-20,20)})),
   battle:c.battle&&s(c.battle.foe,30)?{foe:s(c.battle.foe,30),lvl:clamp(Math.round(+c.battle.lvl||0),-2,1),win:s(c.battle.win,300),lose:s(c.battle.lose,300)}:null})).filter(c=>c.t&&c.result);

 return {title:s(j.title,30)||'이야기',text:s(j.text,900),npc:NPCS[j.npc]?j.npc:'',choices:ch};}

function aiApply(S,c){const o={},wasDead=S.dead; // AI가 지은 사건으로는 죽지 않는다
 c.effects.forEach(e=>{if(e.k==='exp')A(S,{exp:tb(S)*Math.max(0,e.v)/10});else if(e.k==='hp')A(S,{hp:Math.max(e.v,5-S.hp)});else if(e.k==='gold')A(S,{gold:Math.max(e.v,-S.gold)});else o[e.k]=(o[e.k]||0)+e.v;});A(S,o);
 c.rel.forEach(r=>{S.met[r.id]=1;rel(S,r.id,r.n);});if(S.ai&&S.ai.npc)S.met[S.ai.npc]=1;

 if(c.deed)deed(S,c.deed);if(!wasDead&&S.dead){S.dead=null;S.hp=Math.max(1,S.hp);t+=' 겨우 목숨은 건졌다.';}return t;}

Object.assign(NPC_BIO,{
 gongmyeong:'열 살에 소림에 버려진 아이. 배고픈 기억 때문에 지금도 만두 냄새를 못 이긴다. 계율원에서 매를 맞은 횟수로는 소림 최고, 나한진에서 버틴 시간으로도 소림 최고.',

 baekryeon:'만화궁의 무희. 화 연과 같은 해에 궁에 들어왔다. 궁주의 딸과 무희, 신분은 달라도 둘은 서로의 유일한 벗이다. 춤으로 사람을 홀리는 법을 배웠지만, 춤으로 사람을 위로하는 법을 더 좋아한다.',

 yeonsaeng:'떠돌이 화공. 강호의 고수들을 그려 왔다. 천마의 초상도, 검선의 초상도 그의 붓에서 나왔다는 소문이 있다. 정작 자기 얼굴은 한 번도 그리지 않았다.',

Object.assign(VISIT_LINE,{gongmyeong:'“만두 사 왔소! …두 개는 오다가 먹었소.”',hyeonmu:'“지나는 길이다. 수련을 게을리하지 않았는지 보러 왔다.”',joyeon:'“청운 사형한테 또 졌어. 위로하러 온 거 아니야. 비무하러 왔어.”',namgungho:'“형님은 모르게 왔다. 술 한잔하자.”',tangmo:'“차 한 잔 얻어 마시러 왔다. 독은 내가 가져왔다. 농이다.”',paengsa:'“붓 한 자루 들고 왔소. 현판 글씨가 영 마음에 안 들어서.”',jaun:'“소소가 안부를 전해 달라기에. …나도 궁금했고.”',hwangpo:'“녹림왕은 모르게 왔다. 할 얘기가 있다.”',gilsu:'“형님! 아니 누님! 아무튼, 소식 가져왔어요!”',chilyeong:'“…쫓기는 중이다. 하룻밤만.”',sudong:'“노 젓다 들렀다. 배 위에서 먹을 밥 좀 얻자.”',baekryeon:'“춤출 데가 필요해서 왔어요. 여기 마당 넓네요.”',ganghon:'“형님 왔다! 술 꺼내라!”',hongui:'“…숨겨 줘. 하루만.”',hanbing:'“국 끓여 왔다. 얼기 전에 먹어라.”',yeonsaeng:'“얼굴 한번 그리러 왔소. 지난번보다 깊어졌구려.”',yeomcs:'“…순찰 중이다. 차 한 잔만 마시고 가겠다.”',jumo:'“술 한 독 지고 왔다. 외상은 안 된다.”',
 eunha:'“어머니 몰래 나왔어요. 궁 밖은 정말 따뜻하네요.”',yeonhwa:'“고양이가 너를 찾길래. 나 말고 고양이가.”',soryeong:'“땡땡이 쳤어요. 이건 진짜예요.”',seola:'“장터 엿 사 왔어요. 반은 당신 거예요.”',uihyang:'“왕진 다녀오는 길이에요. 안색 좀 봐요.”',sohwa:'“국수 배달 왔어요. 주문은 안 했죠? 알아요.”',seolhan:'“…지나가던 길이다. 눈사람은 안 만들었다.”',mukya:'“교주님 심부름이다. …거짓말이다.”',nangcheong:'“소문 하나 팔러 왔어. 너한텐 공짜.”',hongchil:'“밥 얻으러 왔다. 거지가 밥 얻는 게 흠이냐.”',unhae:'“사, 산 아래 내려온 김에…”',seokdol:'“…호미 고쳐 왔다.”'});

   o:[['상대해 준다',S=>{const b=battle(S,npcFoe(S,'joyeon'),{spar:1});TK(S,'joyeon',b.win?10:8);return fightText(b,'그녀가 졌다. 그런데 웃었다. “또 졌네. 근데 너한테 진 건 사형한테 진 것보다 덜 분해. 이상하지.”','그녀가 이겼다. 검을 거두며 말했다. “고마워. 이긴 게 얼마 만인지 모르겠어.”');}],['돈을 낸다',S=>{TK(S,'joyeon',4);A(S,{gold:-1});return '그녀가 엽전을 받아 들고 멍하니 보았다. “…진짜 낼 줄은 몰랐는데.” 그날 그녀는 엽전 하나로 당신에게 만두를 샀다.';}],['청운보다 네 검이 더 좋다',S=>{TK(S,'joyeon',12);return '그녀의 칼끝이 떨렸다. “…그런 말 처음 들어.” 그러고는 고개를 돌렸다. 귀가 빨갰다.';}]],
   n:{l:'“사람들은 사형을 천재라고 해. 나는 노력파래. 근데 있잖아, 노력파라는 말은 칭찬이 아니야. ‘재능은 없는데’라는 말이 앞에 생략된 거야.”',
    o:[['노력하는 재능도 재능이다',S=>{TK(S,'joyeon',8);A(S,{cult:2});return '“…그 말, 돌기둥에 새겨 놔야겠다.” 그녀가 웃었다. 진짜 웃음이었다.';}],['청운도 밤마다 몰래 연습한다',S=>{TK(S,'joyeon',6);A(S,{mind:2});return '“뭐?” 그녀가 벌떡 일어났다. “그 자식… 나한테는 한 번도 안 한다고 했으면서!” 화를 내는데 왠지 기뻐 보였다.';}]]}}],
 namgungho:[{min:-99,x:'안휘의 주루 이층, 남궁세가의 중년 검객이 혼자 술을 마시고 있다. 잔이 세 개 놓여 있다. 두 개는 비었다.',l:'“앉게. 비어 있는 잔은 형님 것과 형수님 것일세. 형님은 오지 않고, 형수님은 이제 오실 수 없지.”',
   o:[['빈 잔에 술을 채운다',S=>{TK(S,'namgungho',10);return '사내가 당신을 오래 보았다. “…형님도 이렇게 해 준 적이 없는데.” 그날 둘은 세 잔을 번갈아 비웠다.';}],['검왕의 아우시군요',S=>{TK(S,'namgungho',-2);return '“그래. 평생 그 말을 들었지. 내 이름은 남궁 호일세. 기억해 주면 고맙겠군.”';}],['당신의 검을 보고 싶습니다',S=>{TK(S,'namgungho',8);A(S,{mind:2});return '사내가 놀란 얼굴로 웃었다. “내 검을? 형님 검이 아니라?” 그가 젓가락 하나로 탁자 위에 검로를 그렸다. 빠르고, 외로운 검이었다.';}]],
   n:{l:'“형님이 천하제일검이 되던 날, 나는 연무장에서 내 검을 부러뜨렸네. 그런데 다음 날 아침, 서린이가 부러진 검을 들고 와서 울더군. ‘숙부님 검이 제일 좋은데.’ 그래서 다시 검을 들었지.”',
    o:[['서린 아가씨가 옳았습니다',S=>{TK(S,'namgungho',8);return '“…그 아이가 시집갈 때까지는 검을 놓지 않을 생각일세.” 사내의 눈가가 붉었다.';}],['형님과 겨뤄 보신 적은 있습니까',S=>{A(S,{mind:2});return '“한 번. 열일곱 살 때. 세 초 만에 졌네. 그 뒤로 다시 청하지 않았어. 질 게 무서워서가 아니라, 형님이 봐줄 게 무서워서.”';}]]}}],
 tangmo:[{min:-99,x:'당가 후원, 백발의 노부인이 등나무 의자에 앉아 찻잔을 들고 있다. 하인들이 멀찍이 떨어져 숨을 죽인다.',l:'“거기, 젊은이. 이리 와서 이 차 좀 마셔 봐라. 독이 들었는지 안 들었는지 맞히면 상을 주마.”',
   o:[['마신다',S=>{if(S.rp>=30||has(S,'manduk')){TK(S,'tangmo',12);A(S,{rp:3});return '“호오. 혀가 독을 아는구나.” 노부인이 웃었다. “칠보단혼산을 한 방울 넣었다. 너라면 괜찮을 줄 알았지.”';}hurt(S,8,'노태군의 차');TK(S,'tangmo',6);return '혀가 저렸다. 노부인이 해독환을 던졌다. “용기는 좋다. 머리는 나쁘고. 당가 사람이 주는 차는 냄새부터 맡는 거다.”';}],['냄새부터 맡는다',S=>{TK(S,'tangmo',10);A(S,{mind:3});return '“그렇지!” 노부인이 무릎을 쳤다. “내 손자들보다 낫구나. 걔들은 내가 주면 그냥 마신다니까. 효도라나.”';}],['정중히 사양한다',S=>{TK(S,'tangmo',3);return '“겁쟁이는 오래 살지.” 노부인이 차를 한 모금 마셨다. 독이 든 차였는지는 끝내 알 수 없었다.';}]],
   n:{l:'“사람들은 당가가 독으로 사람을 죽인다고 하지. 나는 평생 독 셋을 만들고 해독약 열을 만들었다. 셋으로 죽인 사람보다 열로 살린 사람이 훨씬 많아. 그런데 사람들은 셋만 기억하더구나.”',
    o:[['저는 열을 기억하겠습니다',S=>{TK(S,'tangmo',10);A(S,{moral:2});return '노부인이 찻잔을 내려놓았다. “…그럼 너한테 열한 번째를 가르쳐 주마. 언젠가.”';}],['그 셋은 무엇이었습니까',S=>{A(S,{mind:2,med:2});return '“하나는 남편을 죽인 놈한테. 하나는 아들을 노린 놈한테. 하나는…” 노부인이 웃었다. “그건 비밀이다.”';}]]}}],
 paengsa:[{min:-99,x:'하북 저잣거리 서화점, 체격 좋은 젊은 서생이 현판 글씨를 쓰고 있다. 붓이 도처럼 획을 긋는다.',l:'“아, 손님이시오? 잠깐만. 이 획만 긋고. …보시오. 팽가오호도의 첫 초식을 글씨로 옮기면 이렇게 되오.”',
   o:[['글씨에 도가 보인다',S=>{TK(S,'paengsa',12);A(S,{lore:2});return '서생의 눈이 커졌다. “보이시오? 정말? 아버지도 못 보신 걸!” 그날 그는 당신에게 「묵도첩」 첫 장을 보여 주었다.';}],['팽가 아들이 왜 붓을 드오',S=>{TK(S,'paengsa',2);return '“다들 그렇게 묻소.” 서생이 붓을 씻었다. “도는 사람을 베고, 붓은 사람을 남기오. 나는 남기는 쪽이 좋소.”';}],['현판을 하나 부탁한다',S=>{TK(S,'paengsa',6);A(S,{gold:-5});return '열흘 뒤 받은 현판의 글씨는 살아 움직이는 것 같았다. 낙관에는 ‘묵도(墨刀)’라 찍혀 있었다.';}]],
   n:{l:'“아버지는 내가 붓을 들 때마다 고함을 지르시오. ‘팽가 놈이 무슨 붓이냐!’ 그런데 지난번에 몰래 내 글씨를 서재에 걸어 두신 걸 봤소. 거꾸로 걸려 있었지만.”',
    o:[['거꾸로 걸린 것도 걸린 것이오',S=>{TK(S,'paengsa',8);A(S,{mood:5});return '서생이 배를 잡고 웃었다. “그렇소! 아버지 고함보다 큰 글씨를 쓰는 날, 똑바로 걸리겠지.”';}],['아버님께 직접 보여 드리시오',S=>{TK(S,'paengsa',5);A(S,{moral:2});return '“…그럴 용기가 생기면.” 서생이 붓을 쥐었다. 손이 조금 떨렸다.';}]]}}],
 jaun:[{min:-99,x:'아미 금정의 계단, 중년 비구니가 계단을 쓸고 있다. 빗자루 소리마저 엄하다.',l:'“거기 서시오. 신발에 흙이 묻었소. 금정에 올라오려면 흙부터 털고 오시오. 마음도.”',
   o:[['흙을 턴다',S=>{TK(S,'jaun',6);A(S,{cult:2});return '“마음은?” 비구니가 물었다. 당신이 대답을 못 하자, 처음으로 그녀의 입꼬리가 아주 조금 올라갔다.';}],['마음의 흙은 어떻게 텁니까',S=>{TK(S,'jaun',8);A(S,{cult:3});return '“계단을 쓰시오. 백 계단쯤 쓸면 알게 되오.” 당신은 백 계단을 쓸었다. 정말로 조금 가벼워졌다.';}],['소소를 만나러 왔습니다',S=>{TK(S,'jaun',2);return '비구니의 눈이 가늘어졌다. “그 아이를 웃게 하러 왔소, 울게 하러 왔소?” 대답이 마음에 들었는지, 그녀가 길을 비켰다.';}]],
   n:{l:'“나는 소소를 키우며 한 번도 웃지 않았소. 그 아이가 너무 잘 웃어서, 하나는 엄해야 했소. 그런데 요즘 생각하오. 그 아이가 웃음을 다 써 버리면 누가 그 아이를 웃게 해 줄지.”',
    o:[['사태께서 웃어 주시면 됩니다',S=>{TK(S,'jaun',10);return '비구니가 한참 말이 없었다. “…연습해 보겠소.” 엄한 얼굴로 그렇게 말해서, 당신이 먼저 웃고 말았다.';}],['소소는 강한 사람입니다',S=>{TK(S,'jaun',5);A(S,{moral:2});return '“알고 있소. 그래서 더 걱정이오. 강한 아이는 혼자 울거든.”';}]]}}],
 hwangpo:[{min:-99,x:'녹림 산채의 무기고, 누런 도포의 사내가 장부를 넘기고 있다. 산적 산채에 장부라니, 낯선 풍경이다.',l:'“녹림 칠십이 채, 형제 삼천. 그런데 곳간엔 쌀이 석 달 치뿐이오. 형님은 의리로 배를 채우라 하시지. 당신은 의리로 배가 부르오?”',
   o:[['의리가 없으면 녹림도 없소',S=>{TK(S,'hwangpo',2);A(S,{moral:2});return '“그 말, 형님한테 백 번 들었소.” 사내가 장부를 덮었다. “백한 번째는 듣고 싶지 않군.”';}],['그래서 무엇을 하려 하오',S=>{TK(S,'hwangpo',8);A(S,{mind:3});return '사내가 웃었다. 이를 다 드러낸 웃음이었다. “녹림을 군대로 만들 거요. 털지 않고 거두는 군대. 관아처럼.”';}],['장부 정리를 돕는다',S=>{TK(S,'hwangpo',6);A(S,{savvy:3});return '밤새 장부를 맞췄다. 사내가 말했다. “산채에 셈할 줄 아는 놈이 나 말고 하나 더 있으면 좋겠소. 당신이면 좋겠군.”';}]]},
  {min:25,x:'달 없는 밤, 황포채주가 당신을 산채 뒤 절벽으로 불렀다. 칼을 차지 않았다.',l:'“솔직히 말하겠소. 형님을 몰아낼 거요. 피는 안 흘리오. 형님이 스스로 물러나게 할 거요. 당신이 내 편에 서 주면 일이 쉬워지오.”',
   o:[['편에 선다',S=>{S.flags.hwangpoSide=1;TK(S,'hwangpo',15);TK(S,'nokrim',-15);A(S,{moral:-5,savvy:3});npcMem(S,'nokrim','황포채주의 편에 섰다는 소문을 들었다');return '“고맙소.” 사내가 손을 내밀었다. 그 손을 잡는 순간, 산채 어딘가에서 녹림왕의 웃음소리가 들렸다. 아직 아무것도 모르는 웃음이었다.';}],['녹림왕에게 알린다',S=>{S.flags.hwangpoSide=-1;TK(S,'hwangpo',-20);TK(S,'nokrim',12);A(S,{moral:3});npcMem(S,'nokrim','황포채주의 일을 알려 주었다');return '녹림왕은 오래 말이 없었다. “…그놈이 셈을 하는 건 알았다. 칼을 셈하는 줄은 몰랐지.” 그는 의형제를 벌하지 않았다. 대신 곳간 열쇠를 반 나눠 주었다.';}],['둘이 직접 이야기하라고 한다',S=>{TK(S,'hwangpo',4);TK(S,'nokrim',4);A(S,{tongue:2});return '사흘 뒤 두 사람이 술독을 사이에 두고 마주 앉았다. 무슨 이야기가 오갔는지는 모른다. 다음 날 산채에 장부가 하나 더 생겼다.';}]]}],
 gilsu:[{min:-99,x:'강남 저잣거리, 꼬질꼬질한 아이가 당신 소매를 붙잡았다. 손바닥에 엽전 두 닢이 있다.',l:'“아저씨, 아니 누님? 아무튼요! 이 동네 소식 하나에 엽전 두 닢. 싸죠? 오늘 저녁에 이 객잔에 칼 찬 놈들이 몰려온대요.”',
   o:[['엽전 두 닢을 준다',S=>{TK(S,'gilsu',8);A(S,{gold:-1,mind:2});return '아이가 엽전을 깨물어 보고 씩 웃었다. 소식은 정확했다. 그날 밤 객잔은 칼부림으로 엉망이 되었다. 당신만 빼고.';}],['넉넉히 준다',S=>{TK(S,'gilsu',12);A(S,{gold:-5});return '아이 눈이 휘둥그레졌다. “…이거 다요? 나 이거 모아서 객잔 차릴 거예요. 차리면 첫 손님은 공짜예요!”';}],['꼬마가 위험한 일을 한다고 꾸짖는다',S=>{TK(S,'gilsu',3);A(S,{moral:2});return '“위험한 거 알아요. 근데 배고픈 게 더 위험해요.” 아이가 혀를 내밀고 달아났다.';}]],
   n:{l:'“나 객잔 차리는 게 꿈이에요. 손님들 얘기 다 들을 수 있잖아요. 하오문은 그런 데서 다 듣거든요. 아, 근데 나는 듣기만 하고 안 팔 거예요. 내 손님 얘기는.”',
    o:[['좋은 객잔 주인이 되겠구나',S=>{TK(S,'gilsu',8);return '아이가 가슴을 폈다. “당연하죠! 간판도 벌써 정했어요. 비밀이에요.”';}],['돈을 모으는 법을 알려 준다',S=>{TK(S,'gilsu',6);A(S,{savvy:2});return '아이가 땅바닥에 숫자를 그리며 열심히 들었다. 글자는 못 읽어도 숫자는 금방 외웠다.';}]]}}],
 chilyeong:[{min:-99,x:'비 오는 밤, 객잔 처마 밑에 검은 옷의 사내가 서 있다. 비를 피하는 게 아니라, 누군가를 기다리는 자세다.',l:'“…당신은 표적이 아니다. 안심해라. 오늘 밤 내 표적은 저 객잔 이층의 사내다. 아이가 둘 있지.”',
   o:[['막아선다',S=>{const b=battle(S,npcFoe(S,'chilyeong'),{spar:1});TK(S,'chilyeong',b.win?10:4);if(b.win)A(S,{moral:6,fame:5});return fightText(b,'사내가 칼을 거두었다. “…잘됐다. 막아 줄 사람이 필요했다. 오늘은 실패한 걸로 하지.” 그는 빗속으로 사라졌다.','사내가 당신을 쓰러뜨리고 이층을 올려다보았다. 한참 서 있다가, 그냥 돌아섰다. “…아이가 둘이라서.”');}],['왜 내게 말하오',S=>{TK(S,'chilyeong',8);A(S,{mind:3});return '“…누가 막아 주길 바랐는지도 모르지.” 사내가 처음으로 당신을 보았다. 눈이 지쳐 있었다.';}],['못 본 척한다',S=>{TK(S,'chilyeong',-3);A(S,{moral:-3});return '다음 날 아침, 객잔 이층은 조용했다. 아이들 울음소리만 들렸다.';}]],
   n:{l:'“살막은 들어오는 문은 많고 나가는 문은 하나다. 관 뚜껑. 나는 백 번 죽이고 한 번 살렸다. 그 한 번 때문에 밤마다 잠을 못 잔다. 이상하지. 백 번 때문이 아니고.”',
    o:[['그 한 번이 당신이 아직 사람이라는 증거다',S=>{TK(S,'chilyeong',12);A(S,{moral:3});return '사내가 오래 비를 보았다. “…사람. 오랜만에 들어 보는 말이군.”';}],['나가는 문을 함께 찾자',S=>{S.flags.chilEscape=1;TK(S,'chilyeong',10);return '“…그 말을 한 놈은 다 죽었다.” 사내가 말했다. 그러고는 덧붙였다. “그래도 고맙다.”';}]]}}],
 sudong:[{min:-99,x:'장강 나루, 늙은 사공이 노를 젓는다. 물살이 거센데 배가 흔들리지 않는다.',l:'“어디까지 가오? 뱃삯은 이야기 하나요. 재미없으면 물에 빠뜨리겠소. 농이오. 반쯤.”',
   o:[['강호 이야기를 한다',S=>{TK(S,'sudong',8);A(S,{tongue:2});return '노인이 껄껄 웃었다. “재미있군! 그 이야기, 나도 젊어서 겪었지. 결말은 달랐지만.”';}],['노 젓는 팔이 범상치 않습니다',S=>{TK(S,'sudong',10);A(S,{mind:3});return '노인이 노를 멈췄다. 배가 물살 위에 그대로 섰다. “…눈이 좋군. 그 눈 때문에 물에 빠지는 놈도 있소.” 그러고는 다시 노를 저었다. 웃고 있었다.';}],['말없이 강을 본다',S=>{TK(S,'sudong',5);A(S,{cult:2});return '노인도 말이 없었다. 강 건너에 닿을 때쯤 노인이 말했다. “장강은 말 없는 손님을 좋아하오.”';}]],
   n:{l:'“삼십 년 전에 이 강의 주인이었소. 지금의 용왕 녀석한테 자리를 넘기고 노 하나 들고 내려왔지. 왜냐고? 주인일 때는 강이 안 보였소. 노를 저으니 보이더군.”',
    o:[['수공을 한 수 배울 수 있겠습니까',S=>{TK(S,'sudong',6);if(!S.arts.includes('jangsu_1')&&chance(.5)){const r=learn(S,'jangsu_1');return '노인이 노를 건넸다. “강물처럼 휘되 꺾이지 마라.” '+r;}A(S,{exp:tb(S)*.5});return '“배우는 건 쉽소. 버리는 게 어렵지.” 노인이 노 젓는 법만 가르쳐 주었다. 그것도 수공이었다.';}],['강은 무엇이 보입니까',S=>{TK(S,'sudong',8);A(S,{cult:4});return '“사람이 보이오. 강을 건너는 사람들. 다들 어딘가로 가오. 주인일 때는 그게 다 통행세로 보였지.”';}]]}}],
 baekryeon:[{min:-99,x:'강남 만화궁 무대, 흰 옷의 무희가 춤을 추고 있다. 관객이 숨을 죽였다. 춤이 끝나자 그녀가 곧장 당신 앞으로 왔다.',l:'“당신만 박수를 안 쳤어요. 내 춤이 별로였어요?”',
   o:[['숨 쉬는 걸 잊었소',S=>{TK(S,'baekryeon',12);A(S,{tongue:2});return '무희가 눈을 깜빡이다가 웃음을 터뜨렸다. “그런 칭찬은 처음이에요. 박수보다 좋네요.”';}],['춤이 슬퍼 보였소',S=>{TK(S,'baekryeon',10);A(S,{mind:2});return '무희의 웃음이 멈췄다. “…어떻게 알았어요?” 그녀가 당신 옆에 앉았다. “오늘은 연이가 울던 날이에요. 그래서 그런 춤이 나왔나 봐요.”';}],['박수를 친다',S=>{TK(S,'baekryeon',3);return '“늦었어요.” 무희가 혀를 찼다. 그래도 웃고 있었다.';}]],
   n:{l:'“연이랑 나는 같은 해에 궁에 들어왔어요. 그 애는 궁주님 딸, 나는 무희. 다들 우리가 친구인 게 이상하대요. 근데 그 애가 웃을 수 있는 데가 내 앞밖에 없어요. 나도 그래요.”',
    o:[['좋은 벗이 있어 다행이오',S=>{TK(S,'baekryeon',8);if(S.met.hwayeon)TK(S,'hwayeon',3);return '“다행이죠.” 무희가 웃었다. “그러니까 연이 울리면 나한테 죽어요. 농담 아니에요.”';}],['당신이 웃을 데는 또 없소?',S=>{TK(S,'baekryeon',10);return '무희가 당신을 한참 보았다. “…이제 생길지도 모르죠.”';}]]}}],
 ganghon:[{min:-99,x:'마교 수라대 막사, 덩치 큰 사내가 부하들과 팔씨름을 하고 있다. 지는 놈이 술을 산다.',l:'“거기! 새로 왔냐? 팔 걷어! 수라대는 팔씨름으로 인사한다!”',
   o:[['팔씨름을 한다',S=>{const w=S.t.bone*6+S.realm*5+R(0,30)>=70;TK(S,'ganghon',w?12:8);return w?'대주의 팔이 넘어갔다. 막사가 뒤집어졌다. 대주가 크게 웃으며 당신 등을 쳤다. “술은 내가 산다! 오늘부터 너는 수라대 형제다!”':'당신 팔이 넘어갔다. 대주가 술잔을 내밀었다. “졌으니 술 사라. 그리고 내일 또 와라. 이길 때까지.”';}],['나는 수라대가 아니오',S=>{TK(S,'ganghon',2);return '“상관없다! 팔은 다 똑같다!” 대주가 껄껄 웃었다.';}],['술을 먼저 산다',S=>{TK(S,'ganghon',8);A(S,{gold:-5});return '“이 녀석, 지기도 전에 사네! 마음에 든다!” 그날 막사는 새벽까지 시끄러웠다.';}]],
   n:{l:'“정마대전 때 삼백을 데리고 나가서 백을 데리고 왔다. 이백 놈 이름 다 외운다. 밤마다 하나씩 불러 본다. 대답은 없지. 그래도 부른다. 안 부르면 진짜 죽는 거니까.”',
    o:[['함께 이름을 불러 준다',S=>{TK(S,'ganghon',12);A(S,{cult:3});return '그날 밤 둘이서 이백 개의 이름을 불렀다. 마지막 이름에서 대주의 목소리가 갈라졌다.';}],['마교도 그런 정이 있소?',S=>{TK(S,'ganghon',3);A(S,{mind:2});return '“정파 놈들은 우리가 정도 없는 줄 알지.” 대주가 잔을 비웠다. “정이 없으면 미쳐서 못 싸운다.”';}]]}}],
 hongui:[{min:-99,x:'청해 붉은 호숫가, 붉은 옷의 소녀가 물가에 쪼그려 앉아 하늘을 보고 있다. 주위에 혈교도들이 없다.',l:'“…쉿. 나 지금 도망치는 중이야. 하늘 보려고 잠깐. 하늘이 무슨 색인지 까먹을까 봐.”',
   o:[['같이 하늘을 본다',S=>{TK(S,'hongui',10);A(S,{cult:2});return '한참을 둘이 하늘을 보았다. 소녀가 말했다. “파랗다. 기억해 둬야지.” 멀리서 혈교도들의 목소리가 들리자 그녀가 일어났다. “고마워. 너도 기억할게.”';}],['도망치는 걸 돕는다',S=>{TK(S,'hongui',14);A(S,{moral:5,enemies:1});S.flags.honguiHelp=1;return '혈교도들을 다른 길로 따돌렸다. 소녀가 사라지기 전에 당신 손에 붉은 실 하나를 쥐여 주었다. “빚진 거야. 꼭 갚을게.”';}],['혈교에 넘긴다',S=>{TK(S,'hongui',-30);A(S,{moral:-10,gold:50});return '소녀는 끌려가며 한 번도 돌아보지 않았다. 은자 쉰 냥이 손에 남았다. 이상하게 무거웠다.';}]],
   n:{l:'“나는 혈천대법의 마지막 제물이래. 열다섯 살에 알았어. 그래서 그때부터 하늘을 보기 시작했어. 마지막에 볼 게 붉은 호수면 너무 억울하잖아.”',
    o:[['마지막은 내가 바꿔 주겠다',S=>{S.flags.honguiVow=1;TK(S,'hongui',15);A(S,{moral:4});return '소녀가 당신을 빤히 보았다. “…그런 말 하는 사람은 처음이야. 믿어도 돼?” 대답하기도 전에 그녀가 웃었다. “믿을게. 어차피 믿을 사람이 없거든.”';}],['도망쳐서 어디로 가려고',S=>{TK(S,'hongui',6);return '“바다. 책에서 봤어. 끝이 없대. 끝이 없는 데로 가면 아무도 못 쫓아오잖아.”';}]]}}],
 hanbing:[{min:-99,x:'빙궁 부엌, 늙은 유모가 큰 솥에 국을 끓이고 있다. 빙궁에서 김이 나는 곳은 여기뿐이다.',l:'“얼어 죽기 전에 이거나 먹어라. 빙궁 사람들은 다 마음까지 얼려야 무공이 는다고 믿지. 헛소리야. 배가 따뜻해야 마음도 따뜻해.”',
   o:[['국을 받아먹는다',S=>{TK(S,'hanbing',10);A(S,{hp:15,mood:8});return '국이 뜨거웠다. 몸 안쪽부터 녹는 것 같았다. 유모가 흐뭇하게 웃었다. “그렇지. 그게 사람 얼굴이다.”';}],['궁주님도 이 국을 드십니까',S=>{TK(S,'hanbing',8);A(S,{mind:2});return '“그 애가 어릴 땐 먹었지. 궁주가 되고는 안 먹어. 그래서 지금 그 꼴이야.” 유모가 국자를 휘저었다. “은하는 아직 먹는다. 다행이지.”';}],['무공은 마음을 얼려야 는다고 배웠습니다',S=>{TK(S,'hanbing',4);return '“그래서 행복하냐?” 유모가 물었다. 대답을 못 하자 국을 한 그릇 더 퍼 주었다.';}]],
   n:{l:'“나는 궁주를 품에 안고 키웠다. 그 애가 처음 빙백신공을 익힌 날, 내 품에서 울다가 눈물이 얼었어. 그날 이후로 안 울더라. 나는 그게 제일 슬퍼.”',
    o:[['궁주님께 국을 가져다드리겠습니다',S=>{TK(S,'hanbing',10);if(S.met.binghu)TK(S,'binghu',4);return '유모가 국그릇을 내밀었다. 그날 밤 궁주의 방에서 오랜만에 김이 새어 나왔다고 한다.';}],['울지 않는 것도 강함입니다',S=>{TK(S,'hanbing',2);return '“그래. 강하지. 강해서 외로워.” 유모가 불을 줄였다.';}]]}}],
 yeonsaeng:[{min:-99,x:'저잣거리 모퉁이, 떠돌이 화공이 지나가는 사람들의 얼굴을 그리고 있다. 당신을 보더니 붓을 멈췄다.',l:'“잠깐. 그 얼굴, 그리게 해 주시오. 값은 안 받소. 당신 얼굴은 아직 다 안 만들어졌소. 그런 얼굴이 제일 재밌거든.”',
   o:[['앉아 준다',S=>{TK(S,'yeonsaeng',10);A(S,{mood:5});S.flags.portrait1=S.age;return '반 시진 뒤 화공이 그림을 보여 주었다. 당신인데, 당신보다 조금 나이 들어 보였다. “이게 십 년 뒤의 당신이오. 아마도.”';}],['다 만들어지지 않았다는 게 무슨 뜻이오',S=>{TK(S,'yeonsaeng',6);A(S,{cult:2});return '“사람 얼굴은 산 만큼 만들어지오. 웃은 만큼 눈가가, 이를 악문 만큼 턱이. 당신은 아직 웃은 것도 이를 악문 것도 모자라오.”';}],['바쁘다',S=>{TK(S,'yeonsaeng',-1);return '화공이 어깨를 으쓱했다. “다음에 보면 그리겠소. 그땐 얼굴이 달라져 있겠지.”';}]]},
  {min:20,x:'화공이 당신을 다시 찾아왔다. 낡은 화첩을 들고 있다.',l:S=>S.flags.portrait1?`“${S.flags.portrait1}세 때 그린 당신 얼굴이오. 지금 얼굴과 나란히 놓아 보고 싶었소.”`:'“전에 못 그린 그 얼굴, 이제 그릴 때가 됐소.”',
   o:[['나란히 놓아 본다',S=>{TK(S,'yeonsaeng',10);A(S,{cult:4});deed(S,'떠돌이 화공 연생이 내 얼굴을 그렸다');return S.moral>=30?'두 그림 속 얼굴이 달랐다. 지금 얼굴에는 웃음 주름이 있었다. 화공이 말했다. “좋은 길을 걸었구려.”':S.moral<=-30?'지금 얼굴의 눈매가 날카로웠다. 화공이 말했다. “많이 베었구려. 그래도 눈 밑에 아직 사람이 있소.”':'두 얼굴이 닮았고, 또 달랐다. 화공이 말했다. “아직 만들어지는 중이오. 그게 좋소.”';}],['당신 얼굴은 왜 안 그리오',S=>{TK(S,'yeonsaeng',8);A(S,{mind:2});return '화공이 웃었다. “내 얼굴은 내가 본 사람들 얼굴 안에 다 있소. 천마도, 검선도, 당신도.”';}]]}],
 yeomcs:[{min:-99,x:'관도 검문소, 굳은 얼굴의 포두가 당신의 칼을 노려본다.',l:'“칼 찬 놈들은 다 똑같다. 정파든 사파든. 법 밖에서 칼을 휘두르고, 뒷수습은 우리가 하지. 이름과 소속.”',
   o:[['순순히 답한다',S=>{TK(S,'yeomcs',6);return '포두가 장부에 적었다. “…협조적이군. 칼 찬 놈치고는.” 지나가는 당신 등 뒤로 그가 말했다. “사고 치지 마라.”';}],['칼을 맡긴다',S=>{TK(S,'yeomcs',10);A(S,{moral:2});return '포두의 눈이 커졌다. “…무림인이 칼을 맡기는 건 처음 본다.” 성을 나갈 때 칼은 기름칠이 되어 돌아왔다.';}],['관부 따위가',S=>{TK(S,'yeomcs',-8);A(S,{temper:2});return '포두가 당신 얼굴을 오래 보았다. “기억해 두지.” 그 말이 칼보다 무서웠다.';}]],
   n:{l:'“열 살 때 무림인들 싸움에 휘말려 부모를 잃었다. 정파였는지 사파였는지도 모른다. 그래서 다 싫다. …그런데 그날 나를 업고 나온 놈도 칼을 차고 있었지. 그게 제일 화가 난다.”',
    o:[['그런 칼도 있소',S=>{TK(S,'yeomcs',10);return '포두가 한참 말이 없었다. “…안다. 그래서 화가 나는 거다.”';}],['법도 사람을 다 구하진 못하오',S=>{TK(S,'yeomcs',4);A(S,{mind:2});return '“그래. 그래서 나는 포두를 하고, 너는 칼을 차는 거겠지.” 포두가 처음으로 차를 한 잔 따라 주었다.';}]]}}],
 jumo:[{min:-99,x:'산길 주막, 주모가 술독을 휘젓는다. 술 냄새만으로 취할 것 같다.',l:'“처음 보는 얼굴이네. 우리 집 술은 비싸. 대신 한 잔 마시면 그날 밤 꿈에 젊은 날이 나와. 늙은이들이 그 맛에 와.”',

/* ══ 일대기: 삶을 한 권의 책(○○록)으로 엮는다. AI가 엮을 수도 있다 ══ */
function bookFallback(S){const syl=[];
 if(S.flags.ascend)syl.push('등선');else if(S.qing>=60)syl.push('풍신');if(S.titles.includes('천하제일인'))syl.push('천하');
 if(S.moral>=60)syl.push('협의');else if(S.moral<=-60)syl.push('혈풍');if(S.job==='inn')syl.push('객잔');else if(S.job==='smith')syl.push('철향');else if(S.job==='doctor')syl.push('인술');
 if(S.spouse&&NPCS[S.spouse])syl.push('연정');if(S.lore>=70)syl.push('문향');if(!syl.length)syl.push(S.realm>=5?'강호':'평생');
 const head=S.nick?S.nick.n:S.name;return {title:`${head}${syl.slice(0,2).join('')}록`,hanja:'',subtitle:`${S.name}의 일생`,epithet:epitaph(S),review:'',chapters:[],ai:false};}
const BOOK_SCHEMA={type:'object',additionalProperties:false,required:['title','hanja','subtitle','epithet','review','chapters'],properties:{title:{type:'string'},hanja:{type:'string'},subtitle:{type:'string'},epithet:{type:'string'},review:{type:'string'},
 chapters:{type:'array',items:{type:'object',additionalProperties:false,required:['h','t'],properties:{h:{type:'string'},t:{type:'string'}}}}}};
const BOOK_SHAPE='\n\n[출력 형식] 아래 모양의 JSON 하나만 출력한다. 설명이나 코드 블록을 붙이지 않는다.\n{"title":"○○록","hanja":"○○錄","subtitle":"부제","epithet":"한 문장","review":"평가","chapters":[{"h":"제1장 ○○","t":"내용"}]}\n인물의 말은 “ ”로 감싸고, 문자열 안에 큰따옴표(")를 쓰지 않는다.';
const BOOK_SYS=`너는 무협 인생 시뮬레이션 「무림인생」에서 한 사람의 일생을 한 권의 일대기로 엮는 사관(史官)이다.

제목
- 제목은 그 사람을 나타내는 2~6글자 뒤에 '록(錄)'을 붙인다. 별호, 두드러진 능력, 삶의 결을 합쳐 짓는다. 예를 들어 별호가 무신이고 경공이 뛰어났다면 '무신풍신록' 같은 식이다. 예시를 그대로 쓰지 말고 이 사람만의 제목을 짓는다.
- hanja: 제목의 한자 표기(예: 武神風神錄). subtitle: 한 줄 부제.

내용
- epithet: 이 사람을 한 문장으로.
- review: 3~5문장의 평가. 이 사람의 선택들을 돌아보며 빛났던 것과 아쉬운 것을 솔직하게 말한다. '당신'에게 말하듯 쓴다.
- chapters: 4~6장. h는 '제1장 ○○' 꼴의 제목, t는 2~4문장. 이 사람을 '그' 또는 '그녀'로 부르며 과거형의 문학적인 문장으로 쓴다.
- 일어난 일은 주어진 기록에서만 가져온다. 기록에 없는 큰 사건을 지어내지 않는다. 장면의 작은 묘사는 더해도 된다.
- 무협 문학의 결로, 짧고 감각적으로. 실제 소설이나 게임의 문장을 베끼지 않는다.`;
function bookState(S){const o=S.org&&ORGS[S.org],e=endingOf(S);
 const big=['qing','lore','med','forge','tongue','savvy','mind','cult'].map(k=>[LBL[k],Math.round(S[k]||0)]).filter(x=>x[1]>=40).map(x=>`${x[0]} ${x[1]}`).join(', ');
 return [`[이름] ${S.name} · ${S.sex==='m'?'남':'여'} · ${ORIGINS.find(x=>x.id===S.origin).n} · ${S.region} 출신`,`[끝] ${S.age}세 · ${S.dead||'천수를 다함'} · 결말: ${e[1]}`,
  `[소속] ${o?`${o.n}(${o.side}) ${o.ranks[S.rank]}`:'없음'}${S.job?` · 직업 ${jobTitle(S)}`:''}`,`[경지] ${REALMS[S.realm].n} · 명성 ${Math.round(S.fame)} · 도덕 ${Math.round(S.moral)}(${moralName(S.moral)}) · 성정 ${temperName(S.temper)}`,
  `[별호·칭호] ${S.nick?S.nick.n:'없음'} / ${S.titles.join(', ')||'없음'}`,`[두드러진 능력] ${big||'없음'} · 주무기 ${S.mainW}`,
  `[무공] ${artsOf(S).sort((a,b)=>b.t-a.t).slice(0,6).map(a=>a.n+(a.made?'(창안)':'')).join(', ')||'없음'}`,
  `[인연] 배우자 ${S.spouse?(NPCS[S.spouse]?nnm(S.spouse,S):'평범한 사람'):'없음'}${S.harem?` · 함께 산 사람 ${S.harem.map(id=>NPCS[id].n).join(', ')}`:''} · 자식 ${S.kids} · 제자 ${S.disciples}`,
  `[가까웠던 사람] ${Object.keys(S.rel).filter(id=>NPCS[id]&&S.met[id]).sort((a,b)=>S.rel[b]-S.rel[a]).slice(0,6).map(id=>`${NPCS[id].n}(${npcStatus(S,id)})`).join(', ')||'없음'}`,
  `[남긴 자취]\n${S.deeds.map(d=>`${d.age}세 ${d.t}`).join('\n')||'없음'}`,`[강호사]\n${S.hist.map(h=>`${h.age}세 ${h.t}`).join('\n')||'없음'}`,
  `[가슴에 남은 말] ${(S.words||[]).map(w=>`${w.who}: ${w.t}`).join(' / ')||'없음'}`,
  `[주요 연대기]\n${S.log.filter(l=>l.k).slice(-40).map(l=>`${l.age}세 ${l.t}`).join('\n')}`].join('\n');}
function bookClean(j){const s=(v,n)=>String(v==null?'':v).trim().slice(0,n);if(!j||!s(j.title,30))throw new Error('AI가 책을 엮지 못했어요. 다시 해 보세요.');
 const ch=(Array.isArray(j.chapters)?j.chapters:[]).slice(0,7).map(c=>({h:s(c.h,40),t:s(c.t,600)})).filter(c=>c.h&&c.t);
 let t=s(j.title,20);if(!/록$/.test(t))t+='록';return {title:t,hanja:s(j.hanja,20),subtitle:s(j.subtitle,60),epithet:s(j.epithet,160),review:s(j.review,900),chapters:ch,ai:true};}
let BOOK_RID=0;const BOOK_ST={busy:0,err:''};
function bookGo(){if(BOOK_ST.busy||!S||S.phase!=='end')return;BOOK_ST.busy=1;BOOK_ST.err='';render();const rid=++BOOK_RID,life=S.lifeId;
 aiCall(BOOK_SYS,bookState(S),{schema:BOOK_SCHEMA,shape:BOOK_SHAPE}).then(j=>{if(rid!==BOOK_RID||S.lifeId!==life)return;S.book=bookClean(j);
   const h=loadHall(),r=h.find(x=>x.lifeId===life);if(r){r.book=S.book.title;saveHall(h);}save();})
  .catch(e=>{if(rid===BOOK_RID)BOOK_ST.err=e.message||String(e);}).finally(()=>{if(rid===BOOK_RID){BOOK_ST.busy=0;render();}});}
function bookHTML(s){const b=s.book||bookFallback(s),ready=aiReady(acfg());
 const vt=t=>[...String(t)].map(c=>c===' '?'':esc(c)).join('<br>');
 return `<section class="book fade"><div class="bcover"><span class="bt">${vt(b.hanja||b.title)}</span>${b.hanja?`<span class="bk">${vt(b.title)}</span>`:''}<span class="ba">${vt(s.name+' 著')}</span></div>
  <div class="bpages"><p class="grp-t" style="margin:0">${esc(b.title)}</p>${b.subtitle?`<p class="muted small" style="margin:0">${esc(b.subtitle)}</p>`:''}<p class="bep">“${esc(b.epithet)}”</p>
   ${b.chapters.map(c=>`<div class="bch"><b>${esc(c.h)}</b><p>${esc(c.t)}</p></div>`).join('')}
   ${b.review?`<div class="brev"><span class="seal" aria-hidden="true">評</span><p>${esc(b.review)}</p></div>`:''}
   ${BOOK_ST.err?`<p class="status">${esc(BOOK_ST.err)}</p>`:''}${BOOK_ST.busy?'<p class="status">사관이 일대기를 엮는 중… 보통 10~40초 걸린다.</p>':''}
   ${ready?`<button class="ghost" data-a="bookai" ${BOOK_ST.busy?'disabled':''}>${b.ai?'AI에게 다시 엮게 한다':'AI 사관에게 일대기를 맡긴다'}</button>`:'<p class="muted small" style="margin:0">설정에서 AI 이야기꾼을 켜면, AI 사관이 이 삶을 돌아보고 제목을 짓고 평가해 장(章)을 나눠 엮는다.</p>'}</div></section>`;}

function addWeapon(S,wp){S.wpns.push(wp);if(!S.wpn||wpVal(S,wp)>wpVal(S,S.wpn))S.wpn={...wp};}
function commitWpn(S,name){const p=S.pendingWpn;if(!p)return;const n=(name||'').trim()||p.def;addWeapon(S,{n,w:p.w,q:p.q,kw:p.kw||null});addLog(S,`${jo(n,'을','를')} 얻었다. (${p.w} · 등급 ${p.q})`,1);S.pendingWpn=null;}
const forgeRange=(S,m,w)=>{const b=S.flags.smith?1:0,cap=w?matCap(m,w):MATS[m].cap;return [clamp(Math.floor(S.forge/20)+b,1,cap),clamp(Math.floor((S.forge+25)/20)+b,1,cap)];};
const forgeDefault=(S,f)=>{const [lo,hi]=forgeRange(S,f.m,f.w);return (hi>=4?pick(EPIC):f.m)+WNAME[f.w];};
function doForge(){const f=S.tmp.forge;if(!f)return;if(f.mode==='refine')return doRefine();const before=SNAP(S);const [lo,hi]=forgeRange(S,f.m,f.w);const q=R(lo,hi);
  if(f.m!=='정철'){S.mats[f.m]--;if(!S.mats[f.m])delete S.mats[f.m];}
  const n=(f.name||'').trim()||f.def;const wp={n,w:f.w,q,kw:MATS[f.m].kw,made:1};addWeapon(S,wp);if(S.job==='smith'){S.biz.made++;S.biz.rep+=q*3;S.biz.last=n;}A(S,{forge:4,fame:q>=4?q*5:0});
  if(q>=5)deed(S,`신병이기 ${jo(n,'을','를')} 벼려 냈다`);else if(q>=4)deed(S,`명병 ${jo(n,'을','를')} 벼려 냈다`);
  finish(S,'병기를 벼리다',`${n} (${f.m} · ${f.w})`,q>=5?`칼이 화로에서 나오던 밤 하늘에서 별똥이 떨어졌다. 강호 사람들은 구야자가 돌아왔다고 했다. ${n}, 병기 등급 5.`:`${q>=4?'석 달 밤낮을 망치질했다. ':''}${jo(n,'이','가')} 모습을 드러냈다. 병기 등급 ${q}${wp.kw?` · ${wp.kw}의 결이 깃들었다`:''}.`,before,true);}

function doRefine(){const f=S.tmp.forge,w=S.wpns[f.i];if(!w||f.m==='정철'||!(S.mats[f.m]>0))return;const before=SNAP(S),cap=matCap(f.m,w.w);
 S.mats[f.m]--;if(!S.mats[f.m])delete S.mats[f.m];let t;
 if(w.q>=cap)t=`${f.m}${bat(f.m)?'으로':'로'}는 ${jo(w.n,'을','를')} 더 끌어올릴 수 없었다. 쇠의 결만 조금 바뀌었다.`;
 else if(S.forge+R(0,40)>=25+w.q*12){const was=w.q;w.q++;if(!w.kw&&MATS[f.m].kw)w.kw=MATS[f.m].kw;w.made=1;t=`날을 풀고 ${jo(f.m,'을','를')} 덧대어 다시 벼렸다. ${jo(w.n,'이','가')} 등급 ${was}에서 ${w.q}${w.q===3||w.q===6?'으로':'로'} 올랐다.${w.kw?` 결: ${w.kw}.`:''}`;if(w.q>=5)deed(S,`${jo(w.n,'을','를')} 신병이기로 다시 벼렸다`);}
 else t=`망치질이 어긋났다. ${f.m} 한 덩이만 날아갔다. ${jo(w.n,'은','는')} 그대로다.`;
 if(S.wpn&&S.wpn.n===w.n)S.wpn={...w};A(S,{forge:3});if(S.job==='smith'){S.biz.rep+=w.q*2;}

    else if(E.tool==='wand'){edPush(E);edWand(E,Math.floor(p.x),Math.floor(p.y));E.cx.putImageData(E.work,0,0);soon();return;}
    else{edPush(E);E.last=p;edBrush(E,p.x,p.y);}

const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function makeZip(files){const enc=new TextEncoder(),parts=[],cen=[];let off=0; // 압축 없이 담는 zip
  for(const [name,data] of files){const nm=enc.encode(name),crc=crc32(data),h=new DataView(new ArrayBuffer(30)),c=new DataView(new ArrayBuffer(46));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(12,0x21,true);h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,nm.length,true);
    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(14,0x21,true);c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);
    parts.push(h.buffer,nm,data);cen.push(c.buffer,nm);off+=30+nm.length+data.length;}
  const csz=cen.reduce((a,x)=>a+x.byteLength,0),e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,csz,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cen,e.buffer],{type:'application/zip'});}
async function exportPack(g){g.busy=1;g.msg='묶음을 만드는 중…';render();
  try{const db=await idb();const keys=await new Promise((res,rej)=>{const q=db.transaction('img').objectStore('img').getAllKeys();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});
    const ks=keys.filter(k=>typeof k==='string'&&!k.startsWith('pc:')&&!k.startsWith('prev:')&&!k.startsWith('raw:')&&!k.startsWith('wk:')&&!/^ev:lv_/.test(k));if(!ks.length)throw new Error('내보낼 내 그림이 없어요. 먼저 그림을 그리거나 넣어 주세요.');
    await MANP;const man=Object.assign({},MAN||{}),files=[];
    for(const k of ks){let b=await imgGet(k);if(!b)continue;if(g.webp!==false)b=await toWebp(b);const u8=new Uint8Array(await b.arrayBuffer()),ty=imgType(u8);const p=repoPath(k,ty==='image/webp'?'webp':ty==='image/jpeg'?'jpg':'png');man[k]=p;files.push(['img/'+p,u8]);}
    files.push(['img/index.json',new TextEncoder().encode(JSON.stringify({v:1,files:man},null,1))]);download(makeZip(files),'murim-img.zip');
    g.msg=`${files.length-1}장을 묶었어요. 압축을 풀어 나온 img 폴더를 저장소 맨 위(index.html 옆)에 올리면, 그 주소로 들어오는 모든 사람에게 보여요.`;}
  catch(e){g.msg='묶지 못했어요: '+e.message;}finally{g.busy=0;render();}}
// 깃허브에 바로 올리기: 저장소의 img 폴더와 index.json을 한 번의 커밋으로 갱신한다. 바뀐 그림만 올린다.
const ghDefault=()=>{try{const h=location.hostname;if(h.endsWith('.github.io')){const u=h.split('.')[0],p=location.pathname.split('/')[1];return u+'/'+(p||h);}}catch(e){}return '';};
function b64(u8){let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s);}
async function gitSha(u8){try{if(!(window.crypto&&crypto.subtle))return null;const h=new TextEncoder().encode('blob '+u8.length+'\0'),a=new Uint8Array(h.length+u8.length);a.set(h);a.set(u8,h.length);return [...new Uint8Array(await crypto.subtle.digest('SHA-1',a))].map(x=>x.toString(16).padStart(2,'0')).join('');}catch(e){return null;}}
async function ghPush(g){const c=ncfg(),repo=(c.ghRepo||ghDefault()).trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').replace(/\/$/,''),br=(c.ghBranch||'main').trim(),tok=(c.ghToken||'').trim();
  if(!tok){g.msg='깃허브 토큰을 먼저 넣어 주세요.';render();return;}
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)){g.msg='저장소는 아이디/이름 꼴로 적어 주세요. 예: jjhk0803/murim-life';render();return;}
  g.busy=1;const say=t=>{g.msg=t;soon();};
  const api=async(p,o)=>{o=o||{};const r=await fetch(`https://api.github.com/repos/${repo}${p}`,{method:o.method||'GET',cache:'no-store',headers:Object.assign({Authorization:'Bearer '+tok,Accept:'application/vnd.github+json'},o.body?{'Content-Type':'application/json'}:{}),body:o.body?JSON.stringify(o.body):undefined});
    if(!r.ok){if(o.ok404&&r.status===404)return null;let t='';try{t=(await r.json()).message||'';}catch(e){}
      throw new Error(r.status===401?'토큰이 맞지 않거나 만료되었어요.':r.status===403?'토큰에 이 저장소의 Contents 쓰기 권한이 없어요.'+(t?` (${t})`:''):r.status===404?'저장소나 브랜치를 찾지 못했어요. 토큰이 이 저장소에 접근할 수 있는지도 확인해 주세요.':(r.status===409||r.status===422)?'그사이 저장소가 바뀌었어요. 다시 눌러 주세요.'+(t?` (${t})`:''):`GitHub 오류 ${r.status}${t?' '+t:''}`);}
    return r.status===204?null:r.json();};
  try{say('저장소를 확인하는 중…');
    const ref=await api(`/git/ref/heads/${encodeURI(br)}`),base=ref.object.sha,bc=await api(`/git/commits/${base}`);
    const tr=await api(`/git/trees/${bc.tree.sha}?recursive=1`),have=new Map((tr.tree||[]).filter(t=>t.type==='blob').map(t=>[t.path,t.sha]));
    let man={};const mf=await api(`/contents/img/index.json?ref=${encodeURIComponent(br)}`,{ok404:1});
    if(mf&&mf.content){try{const j=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(mf.content.replace(/\s/g,'')),ch=>ch.charCodeAt(0))));man=Object.assign({},j.files||j);}catch(e){}}
    const old=JSON.stringify(man);
    const db=await idb();const keys=(await new Promise((res,rej)=>{const q=db.transaction('img').objectStore('img').getAllKeys();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);})).filter(k=>typeof k==='string'&&!/^(pc|raw|wk|prev):/.test(k)&&!/^ev:lv_/.test(k));
    if(!keys.length)throw new Error('올릴 내 그림이 없어요. 먼저 그림을 그리거나 넣어 주세요.');
    const entries=[];let done=0,skip=0;
    const one=async k=>{let b=await imgGet(k);if(!b)return;if(g.webp!==false)b=await toWebp(b);
      const u8=new Uint8Array(await b.arrayBuffer()),ty=imgType(u8),p=repoPath(k,ty==='image/webp'?'webp':ty==='image/jpeg'?'jpg':'png'),path='img/'+p;
      if(man[k]&&man[k]!==p&&have.has('img/'+man[k]))entries.push({path:'img/'+man[k],mode:'100644',type:'blob',sha:null}); // 확장자가 바뀌면 옛 파일은 지운다
      man[k]=p;const sha=await gitSha(u8);
      if(sha&&have.get(path)===sha)skip++;else{const bl=await api('/git/blobs',{method:'POST',body:{content:b64(u8),encoding:'base64'}});entries.push({path,mode:'100644',type:'blob',sha:bl.sha});}
      done++;say(`올리는 중… ${done}/${keys.length}`);};
    for(let i=0;i<keys.length;i+=3)await Promise.all(keys.slice(i,i+3).map(one));
    const n=entries.filter(e=>e.sha).length;
    if(!n&&JSON.stringify(man)===old){g.msg=`바뀐 그림이 없어요. 모두 ${skip}장이 이미 저장소에 있어요.`;return;}
    entries.push({path:'img/index.json',mode:'100644',type:'blob',content:JSON.stringify({v:1,files:man},null,1)});
    say('커밋을 만드는 중…');
    const t=await api('/git/trees',{method:'POST',body:{base_tree:bc.tree.sha,tree:entries}});
    const cm=await api('/git/commits',{method:'POST',body:{message:`그림 ${n}장 올리기 (게임 안 그림 관리에서)`,tree:t.sha,parents:[base]}});
    await api(`/git/refs/heads/${encodeURI(br)}`,{method:'PATCH',body:{sha:cm.sha}});
    MAN=Object.assign({},MAN||{},man);
    g.msg=`그림 ${n}장을 저장소에 올렸어요${skip?` (그대로인 ${skip}장은 건너뜀)`:''}. 깃허브 페이지에는 1~3분 뒤 반영돼요.`;}
  catch(e){g.msg='올리지 못했어요: '+e.message;}finally{g.busy=0;render();}}

  else if(a==='gdev'){modal.dev=!modal.dev;render();}
  else if(a==='gstop'){if(BATCH)BATCH.stop=true;render();}
  else if(a==='ncut'){openEditor(modal.k);}
  else if(a==='etool'&&ED){ED.tool=b.dataset.v;render();}
  else if(a==='ebg'&&ED){ED.bg=b.dataset.v;render();}
  else if(a==='ezoom'&&ED){ED.zoom=+b.dataset.v;ED.cv.style.width=ED.zoom*100+'%';render();}
  else if(a==='eundo'&&ED&&ED.undo.length){ED.work.data.set(ED.undo.pop());ED.cx.putImageData(ED.work,0,0);render();}
  else if(a==='eauto'&&ED){edPush(ED);ED.work.data.set(ED.orig.data);autoMask(ED.work.data,ED.W,ED.H,{tol:ED.tol});ED.cx.putImageData(ED.work,0,0);render();}
  else if(a==='eorig'&&ED){edPush(ED);ED.work.data.set(ED.orig.data);ED.cx.putImageData(ED.work,0,0);render();}
  else if(a==='esave'){edSave();}
  else if(a==='enai'&&ED){const m=modal;if(!m.naiSure){m.naiSure=1;render();}else{m.naiSure=0;m.busy=1;m.err='NovelAI가 배경을 지우는 중…';render();const E=ED;
    naiBgRemove(E.src).then(async bl=>{if(ED!==E||modal!==m)return;const bm=await createImageBitmap(bl);edPush(E);E.cx.clearRect(0,0,E.W,E.H);E.cx.drawImage(bm,0,0,E.W,E.H);E.work=E.cx.getImageData(0,0,E.W,E.H);m.err='';}).catch(e=>{m.err=e.message;}).finally(()=>{m.busy=0;render();});}}
  else if(a==='gslot'){const k=b.dataset.k,sh=document.querySelector('.sheet');modal.sst=sh?sh.scrollTop:0;modal={t:'draw',k,title:slotTitle(k),prompt:slotPrompt(k),err:'',back:modal};render();}
  else if(a==='gmysave'){const c=ncfg(),el=document.getElementById('g_myn'),n=(el&&el.value.trim())||`그림체 ${(c.mySt||[]).length+1}`;const L=(c.mySt||[]).filter(x=>x.n!==n);L.push({n,style:c.style,tnpc:c.tnpc,tev:c.tev,tmap:c.tmap,neg:c.neg,q:c.q});c.mySt=L.slice(-20);nsave(c);render();toast(`'${n}' 그림체를 저장했어요.`);}
  else if(a==='gmyst'){const c=ncfg(),x=(c.mySt||[])[+b.dataset.i];if(x){Object.assign(c,{style:x.style,tnpc:x.tnpc||'',tev:x.tev||'',tmap:x.tmap||'',neg:x.neg||NAI_NEG,q:x.q!==false});nsave(c);render();toast(`'${x.n}' 그림체로 바꿨어요.`);}}
  else if(a==='gmydel'){const c=ncfg(),i=+b.dataset.i;if(modal.delSt!==i){modal.delSt=i;render();toast('한 번 더 누르면 지워요.');return;}modal.delSt=null;c.mySt=(c.mySt||[]).filter((_,j)=>j!==i);nsave(c);render();}
  else if(a==='gpreset'){const c=ncfg();c.style=STYLE_PRESETS[+b.dataset.i][1];nsave(c);render();}
  else if(a==='gcopy'){const w=b.dataset.w;copyText(w==='pv'?fullPrompt('st:seorin'):w==='neg'?((ncfg().neg||'').trim()||NAI_NEG):fullPrompt(modal.k,modal.prompt));}
  else if(a==='gexport'){exportPack(modal);}
  else if(a==='ghpush'){ghPush(modal);}
  else if(a==='nreset'){const c=ncfg();delete c.pr[modal.k];nsave(c);modal.prompt=basePrompt(modal.k);render();}
  else if(a==='nsavefile'){const k=modal.k;imgGet(k).then(bl=>{if(bl)bl.arrayBuffer().then(ab=>{const t=imgType(new Uint8Array(ab));download(bl,fileName(k).replace(/png$/,t==='image/webp'?'webp':t==='image/jpeg'?'jpg':'png'));});});}
  else if(a==='nprev'){const k=modal.k;(async()=>{const p=await imgGet('prev:'+k);if(!p)return;const cur=(await imgGet('raw:'+k))||(await imgGet(k));await storeSlot(k,p);if(cur)await imgPut('prev:'+k,cur);else{await imgDel('prev:'+k);PREVK[k]=0;}render();toast('이전 그림으로 되돌렸어요. 한 번 더 누르면 방금 그림으로 돌아가요.');})();}
  else if(a==='ndel'){const k=modal.k;Promise.all([imgDel(k),imgDel('raw:'+k),imgDel('wk:'+k)]).then(()=>{setImg(k,null);render();});}
  else if(a==='aigo')aiGo();
  else if(a==='apre'&&modal&&modal.t==='nai'){readNaiForm();const x=OAI_PRE[+b.dataset.i],o=modal.c.ai.p.openai;o.base=x[1];o.model=x[2];render();}
  else if(a==='mclose')closeModal();
  else if(a==='mbg'){if(ev.target===b)closeModal();}
  else if(a==='quit'){if(modal&&modal.sure){S=newFate();modal=null;tab='ab';view='ev';resetScroll=true;save();render();}else if(modal){modal.sure=1;render();}}
});
app.addEventListener('input',ev=>{if(ev.target.id==='evinp'){S.tmp.inp=ev.target.value;return;}if(ED&&modal&&modal.t==='edit'){const id=ev.target.id;if(id==='e_tol'||id==='e_size'){ED[id==='e_tol'?'tol':'size']=+ev.target.value;const v=document.getElementById(id+'v');if(v)v.textContent=ev.target.value;return;}}if(ev.target.id==='nm'&&S.phase==='birth'){S.name=S.base.name=ev.target.value;}if(ev.target.id==='cname'&&S.tmp.craft)S.tmp.craft.name=ev.target.value;if(ev.target.id==='fname'&&S.tmp.forge)S.tmp.forge.name=ev.target.value;if(ev.target.id==='n_prompt'&&modal){modal.prompt=ev.target.value;savePr(modal.k,modal.prompt);const f=document.getElementById('n_full');if(f)f.textContent=fullPrompt(modal.k,modal.prompt);}
  if(modal&&modal.t==='gal'&&/^g_gh/.test(ev.target.id)){const c=ncfg(),v=id=>{const e=document.getElementById(id);return e?e.value.trim():'';};c.ghRepo=v('g_ghRepo');c.ghBranch=v('g_ghBranch')||'main';c.ghToken=v('g_ghToken');nsave(c);return;}
  if(modal&&modal.t==='gal'&&/^g_(style|tnpc|tev|tmap|neg|q)$/.test(ev.target.id)){const c=ncfg(),v=id=>document.getElementById(id).value;c.style=v('g_style');c.tnpc=v('g_tnpc');c.tev=v('g_tev');c.tmap=v('g_tmap');c.neg=v('g_neg');c.q=document.getElementById('g_q').checked;nsave(c);const pv=document.getElementById('g_pv');if(pv)pv.textContent=fullPrompt('st:seorin');}if(modal&&modal.t==='nai'&&ev.target.id.startsWith('n_'))readNaiForm();});
app.addEventListener('change',ev=>{if(modal&&modal.t==='nai'&&ev.target.id==='a_prov'){readNaiForm();render();return;}if(modal&&modal.t==='gal'){const id=ev.target.id;if(id==='g_miss'){modal.miss=ev.target.checked;render();return;}if(id==='g_webp'){modal.webp=ev.target.checked;return;}if(id==='g_q'){const c=ncfg();c.q=ev.target.checked;nsave(c);render();return;}if(id==='g_files'&&ev.target.files.length){importFiles(modal,[...ev.target.files]);return;}if(id==='g_autocut'){const c=ncfg();c.autoCut=ev.target.checked;nsave(c);return;}if(id==='g_v5tp'){const c=ncfg();c.v5tp=ev.target.checked;nsave(c);NAI_TP_OFF=false;return;}}
  if(modal&&modal.t==='edit'&&ED&&ev.target.id==='e_contig'){ED.contig=ev.target.checked;return;}if(modal&&modal.t==='nai'&&ev.target.id.startsWith('n_'))readNaiForm();if(ev.target.id==='n_file'&&modal&&ev.target.files[0]){const k=modal.k,f=ev.target.files[0];const m=modal;storeSlot(k,f).then(()=>render()).catch(e=>{m.err='그림을 저장하지 못했어요: '+e.message;render();});}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&modal){ev.preventDefault();closeModal();return;}if(!modal&&(ev.key==='Enter'||ev.key===' ')&&document.querySelector('.vnfull[data-a]')&&!(ev.target.closest&&ev.target.closest('button,input,textarea,select'))){ev.preventDefault();VN.i++;render();return;}const g=ev.target.closest&&ev.target.closest('.mn');if(g&&(ev.key==='Enter'||ev.key===' ')){ev.preventDefault();mapSel=g.dataset.r;render();}});

function start(data){
  let s=data&&data.S;
  if(!s){try{s=migrate(JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('murim-life-v4')||localStorage.getItem(OLDKEY)||'null'));}catch(e){}}
  S=s||newFate();render();}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
