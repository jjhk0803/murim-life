<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>무림인생</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="강호에 한 번 태어나 한 해씩 선택하며 살아 보는 무협 인생 시뮬레이션.">
<meta name="theme-color" content="#1c2420">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='6' fill='%23a7352b'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='%23f1f4ef' font-family='serif'%3E%E7%94%9F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
/* 한 줄 세로 기둥: 인물 명패 → 올해의 사건 두루마리 → 연대기. 청자빛 한지와 먹, 인주는 도장 한 곳에만. */
:root{
  --paper:#e3e9e2; --card:#f1f4ef; --ink:#1c2420; --ink2:#56625b; --line:#bccac0;
  --jade:#2c6a57; --jade-soft:#d3e3da; --seal:#a7352b; --bad:#9a3b2f; --good:#2c6a57; --gold:#8a6a1f;
  --yin:#3c5e8c; --yang:#b0502c;
  --f-disp:"Song Myung","Nanum Myeongjo","Batang",serif;
  --f-body:"Gowun Batang","Nanum Myeongjo","Batang",serif;
  --f-ui:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111714; --card:#18201c; --ink:#e2e8e1; --ink2:#96a39a; --line:#2d3a33;
  --jade:#74b8a0; --jade-soft:#1f3229; --seal:#d0594c; --bad:#e08273; --good:#74b8a0; --gold:#d6b25c;
  --yin:#87a9dc; --yang:#e48a62; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111714; --card:#18201c; --ink:#e2e8e1; --ink2:#96a39a; --line:#2d3a33;
  --jade:#74b8a0; --jade-soft:#1f3229; --seal:#d0594c; --bad:#e08273; --good:#74b8a0; --gold:#d6b25c;
  --yin:#87a9dc; --yang:#e48a62; color-scheme:dark}
*{box-sizing:border-box}
/* 한 화면: 위 이름표, 가운데 한 장면, 아래 탭. 가운데만 스크롤된다. */
html{height:100%;box-sizing:border-box;padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}
html,body{background:var(--paper);color:var(--ink)}
body{height:100%;margin:0;overflow:hidden;font-family:var(--f-body);font-size:16px;line-height:1.7}
#app{height:100%;max-width:600px;margin:0 auto;display:flex;flex-direction:column}
.top{flex:none;display:flex;gap:10px;align-items:center;padding-block:10px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.top .portrait{width:46px;height:46px}
.tinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.tn{font-family:var(--f-disp);font-size:1.15rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tn .nick{color:var(--jade);font-size:.95rem}
.ts{display:flex;gap:4px 10px;font-family:var(--f-ui);font-size:.78rem;color:var(--ink2);flex-wrap:wrap}
.ts b{color:var(--ink)}
.main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:14px;padding-block:14px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav{flex:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--line);background:var(--card);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav button{background:none;border:0;padding:11px 0 10px;font-family:var(--f-ui);font-size:.84rem;color:var(--ink2);cursor:pointer;position:relative}
.nav button.on{color:var(--jade);font-weight:700;box-shadow:inset 0 2px 0 var(--jade)}
.nav .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--seal);margin-left:3px;vertical-align:top}
.map{width:100%;height:auto;display:block;background:var(--card);border:1px solid var(--line);border-radius:10px}
.map .ml{stroke:var(--line);stroke-width:1}
.map .ml.adj{stroke:var(--jade);stroke-width:1.6}
.map .rv{fill:none;stroke:var(--yin);stroke-width:5;opacity:.22;stroke-linecap:round}
.map .mn{cursor:pointer}
.map .mn .c{fill:var(--paper);stroke:var(--ink2);stroke-width:1.2}
.map .mn .mo{fill:var(--gold)}
.map .mn.near .c{stroke:var(--jade);stroke-width:2.2}
.map .mn.sel .c{stroke:var(--ink);stroke-width:2.6}
.map .mn.cur .c{fill:var(--seal);stroke:var(--seal)}
.map text{fill:var(--ink);font-family:var(--f-ui);font-size:11px;text-anchor:middle}
.map .mn.cur text{font-weight:700;fill:var(--seal)}
.era{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;font-size:.92rem}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.tl li{display:grid;grid-template-columns:3.4em 1fr;gap:8px}.tl .a{color:var(--ink2);font-family:var(--f-ui);text-align:right;font-variant-numeric:tabular-nums}
.tal.yc3{grid-template-columns:3.2em 1fr auto}
.yb{display:flex;gap:4px}
.plate p{margin:0}
.epi{font-family:var(--f-disp);font-size:1.05rem;line-height:1.6;max-width:26em;margin:4px auto 2px;text-wrap:balance}
.tags{display:inline-flex;gap:4px;margin-left:6px;vertical-align:middle}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.mast{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-disp);font-size:1.35rem;letter-spacing:.06em}
.seal{display:inline-grid;place-items:center;width:30px;height:30px;background:var(--seal);color:var(--card);
  font-family:var(--f-disp);font-size:1.1rem;border-radius:3px;transform:rotate(-4deg);flex:none}
.ghost{background:none;border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-family:var(--f-ui);font-size:.82rem;color:var(--ink2);cursor:pointer}
.ghost:hover{color:var(--ink);border-color:var(--ink2)}
.ghost.on{color:var(--card);background:var(--jade);border-color:var(--jade)}
/* 명패 */
.plate{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.who{display:flex;align-items:baseline;gap:8px 10px;flex-wrap:wrap}
.who .nm{font-family:var(--f-disp);font-size:1.6rem;line-height:1.2}
.who .nick{font-family:var(--f-disp);color:var(--jade);font-size:1.1rem}
.who .age{margin-left:auto;font-family:var(--f-ui);font-variant-numeric:tabular-nums;color:var(--ink2);font-size:.88rem}
.aff{font-family:var(--f-ui);font-size:.85rem;color:var(--ink2);margin-top:-6px}
.aff .grp{color:var(--gold)}
.powrow{display:flex;align-items:center;justify-content:space-between;gap:10px;border-block:1px solid var(--line);padding-block:6px}
.powrow b{font-family:var(--f-ui);font-weight:400;font-size:.75rem;letter-spacing:.12em;color:var(--ink2)}
.powrow .pv{font-family:var(--f-disp);font-size:1.7rem;line-height:1.1;font-variant-numeric:tabular-nums}
.powrow .pk{font-family:var(--f-ui);font-size:.8rem;color:var(--ink2);text-align:right}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 12px}
.st{display:flex;flex-direction:column;min-width:0}
.st b{font-family:var(--f-ui);font-weight:400;font-size:.72rem;letter-spacing:.08em;color:var(--ink2)}
.st span{font-variant-numeric:tabular-nums;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:3px;position:relative}
.bar i{display:block;height:100%;background:var(--jade)}
.bar.hp i{background:var(--seal)}
.bar.dv{overflow:visible}
.bar.dv i{position:absolute;top:0;height:100%}
.bar.dv::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--ink2)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabbody{display:flex;flex-direction:column;gap:12px;font-size:.92rem}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px}
.kv{display:flex;flex-direction:column;min-width:0}
.kv .k{display:flex;justify-content:space-between;gap:6px;font-family:var(--f-ui);font-size:.8rem;color:var(--ink2)}
.kv .k em{font-style:normal;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.grp-t{font-family:var(--f-disp);font-size:1rem;margin:0 0 4px}
.tal{display:grid;grid-template-columns:3.2em 1fr;gap:4px 8px;align-items:center;font-family:var(--f-ui);font-size:.82rem}
.dots{display:flex;gap:3px}.dots i{width:12px;height:6px;border-radius:1px;background:var(--line)}.dots i.on{background:var(--jade)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-ui);font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:1px 9px;color:var(--ink2);background:none}
.chip.t{border-color:var(--jade);color:var(--jade)}
.chip.g{border-color:var(--gold);color:var(--gold)}
button.chip{cursor:pointer;padding:3px 11px}
button.chip.on{background:var(--jade);color:var(--card);border-color:var(--jade)}
.art{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;padding-block:5px;border-bottom:1px dashed var(--line)}
.art:last-child{border-bottom:0}
.art .an{font-weight:700}
.art .am{font-family:var(--f-ui);font-size:.78rem;color:var(--ink2)}
.art.off{opacity:.55}
.ppl{display:flex;flex-direction:column}
.pp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding-block:6px;border-bottom:1px dashed var(--line)}
.pp:last-child{border-bottom:0}
.pp .pn b{font-family:var(--f-disp);font-weight:400;color:var(--jade)}
.pp .pr{font-family:var(--f-ui);font-size:.8rem;color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums}
.pp .pd{grid-column:1/-1;font-size:.82rem;color:var(--ink2)}
/* 두루마리 */
.scroll{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--ink);border-radius:2px 2px 10px 10px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px}
.yr{font-family:var(--f-ui);font-size:.78rem;letter-spacing:.14em;color:var(--ink2)}
.scroll h2{font-family:var(--f-disp);font-weight:400;font-size:1.55rem;margin:0;line-height:1.3;text-wrap:balance}
.scroll p{margin:0;white-space:pre-line}
.fade{animation:ink .5s ease-out both}
@keyframes ink{from{opacity:.25;filter:blur(1.5px)}to{opacity:1;filter:none}}
@media (prefers-reduced-motion:reduce){.fade,.scene .sst{animation:none}}
.foe{border:1px solid var(--line);border-left:3px solid var(--seal);border-radius:6px;padding:8px 12px;display:flex;flex-direction:column;gap:2px;font-size:.9rem}
.foe .fn{font-family:var(--f-disp);font-size:1.1rem}
.foe .fn b{font-weight:400;color:var(--seal)}
.foe .fv{font-family:var(--f-ui);font-size:.85rem;color:var(--ink2);font-variant-numeric:tabular-nums}
.foe .fv em{font-style:normal;color:var(--ink);font-size:1rem}
.foe .cue{font-size:.82rem;color:var(--seal)}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.choice{text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 14px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.choice:hover{border-color:var(--jade);background:var(--jade-soft)}
.choice .h{font-size:.8rem;font-family:var(--f-ui);color:var(--ink2)}
.picked{font-family:var(--f-ui);font-size:.85rem;color:var(--jade);border-left:2px solid var(--jade);padding-left:10px}
.delta{display:flex;flex-wrap:wrap;gap:6px}
.delta .chip.up{border-color:var(--good);color:var(--good)}.delta .chip.dn{border-color:var(--bad);color:var(--bad)}
.go{align-self:flex-end;background:var(--ink);color:var(--card);border:0;border-radius:8px;padding:10px 20px;font-family:var(--f-ui);font-size:.95rem;cursor:pointer}
.go:hover{background:var(--jade)}
.go.seal-btn{background:var(--seal)}
.go:disabled{opacity:.4;cursor:not-allowed}
.craft label{display:block;font-family:var(--f-ui);font-size:.78rem;letter-spacing:.1em;color:var(--ink2);margin-bottom:4px}
.craft input{width:100%;font:inherit;font-family:var(--f-disp);font-size:1.25rem;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 12px}
/* 연대기 */
.chron h3,.sec h3{font-family:var(--f-disp);font-weight:400;font-size:1.1rem;margin:0 0 6px}
.chron ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.chron li{display:grid;grid-template-columns:3.4em 1fr;gap:8px;font-size:.9rem;line-height:1.55}
.chron li .a{font-family:var(--f-ui);font-variant-numeric:tabular-nums;color:var(--ink2);text-align:right}
.chron li.k{color:var(--jade)}
/* 탄생 */
.hero{display:flex;flex-direction:column;gap:6px;padding-top:10px}
.hero h1{font-family:var(--f-disp);font-weight:400;font-size:3rem;line-height:1.1;margin:0;letter-spacing:.08em;display:flex;align-items:center;gap:14px}
.hero h1 .seal{width:44px;height:44px;font-size:1.6rem}
.hero p{margin:0;color:var(--ink2)}
.field{display:flex;gap:8px;align-items:stretch}
.field input{flex:1;min-width:0;font:inherit;font-family:var(--f-disp);font-size:1.3rem;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 12px}
.lab{font-family:var(--f-ui);font-size:.78rem;letter-spacing:.1em;color:var(--ink2)}
.fate{display:flex;flex-direction:column;gap:10px}
.fate .og{font-family:var(--f-disp);font-size:1.3rem}
.rowbtn{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;align-items:center}
.hall ol{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:4px;font-size:.9rem}
.hall .m{color:var(--ink2);font-family:var(--f-ui);font-size:.8rem}
/* 묘비 */
.stele{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px 18px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.stele .nick{font-family:var(--f-disp);font-size:1.15rem;color:var(--jade)}
.stele .nm{font-family:var(--f-disp);font-size:2.2rem;line-height:1.2}
.stele .life{font-family:var(--f-ui);color:var(--ink2);font-size:.9rem}
.grade{margin-top:8px;font-family:var(--f-disp);font-size:1.4rem;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.sec{display:flex;flex-direction:column;gap:6px}
.sec ul{margin:0;padding-left:1.2em}
.muted{color:var(--ink2)}
.small{font-size:.85rem}
.head{display:flex;gap:12px;align-items:flex-start}
.head>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.portrait{width:60px;height:60px;border-radius:8px;overflow:hidden;border:1px dashed var(--line);flex:none;padding:0;background:var(--paper);cursor:pointer;display:grid;place-items:center;font-family:var(--f-ui);font-size:.72rem;color:var(--ink2)}
.portrait.has{border-style:solid}
.portrait img{width:100%;height:100%;object-fit:cover;object-position:top}
.pp .thumb{width:44px;height:44px;margin-right:10px;float:left;font-size:.65rem}
.evimg{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:6px;display:block}
.scene{position:relative;width:100%;aspect-ratio:3/2;border-radius:6px;overflow:hidden;background:linear-gradient(180deg,var(--paper),var(--line))}
.scene .sbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.9)}
.scene .sst{position:absolute;left:50%;top:6%;height:135%;max-width:none;transform:translateX(-50%);filter:drop-shadow(0 4px 10px rgba(0,0,0,.35));animation:stin .6s ease-out both}
@keyframes stin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translateX(-50%)}}
.scene .snm{position:absolute;left:8px;bottom:8px;background:rgba(20,24,22,.74);color:#f3efe6;font-family:var(--f-ui);font-size:.8rem;padding:2px 10px;border-radius:4px}
.chk,.gth.chk{background:repeating-conic-gradient(#cfcfcf 0 25%,#fafafa 0 50%) 0 0/16px 16px}
.cutpv{width:100%;max-height:52vh;object-fit:contain;border-radius:8px;display:block}
.yrrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.modal{position:fixed;inset:0;background:rgba(10,14,12,.55);display:grid;place-items:center;z-index:30;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;width:100%;max-width:480px;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:10px}
.sheet h3{font-family:var(--f-disp);font-weight:400;font-size:1.3rem;margin:0}
.sheet label{font-family:var(--f-ui);font-size:.78rem;color:var(--ink2);letter-spacing:.06em}
.sheet input[type=text],.sheet input[type=password],.sheet select,.sheet textarea{width:100%;font:inherit;font-size:.9rem;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.sheet textarea{min-height:88px;font-family:var(--f-ui)}
.sheet .big{width:100%;border-radius:8px;display:block}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.status{font-family:var(--f-ui);font-size:.85rem;color:var(--seal)}
.sheet.wide{max-width:760px}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px}
.ggrid.ev,.ggrid.map{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.gcard{display:flex;flex-direction:column;gap:3px;padding:4px;border:1px solid var(--line);border-radius:8px;background:var(--paper);cursor:pointer;text-align:left;font-family:var(--f-ui);color:var(--ink);min-width:0}
.gth{display:grid;place-items:center;width:100%;border-radius:6px;overflow:hidden;background:var(--card);color:var(--ink2);font-size:.75rem}
.gth.p{aspect-ratio:2/3}.gth.l{aspect-ratio:3/2}
.gth img{width:100%;height:100%;object-fit:cover;object-position:top}
.gn{font-size:.8rem;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gs{font-size:.68rem;color:var(--ink2)}.gs.local{color:var(--jade);font-weight:700}.gs.repo{color:var(--gold);font-weight:700}
.pv{margin:0;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--paper);font-family:ui-monospace,Menlo,monospace;font-size:.75rem;line-height:1.45;word-break:break-word;color:var(--ink)}
.row.wrap{flex-wrap:wrap;gap:6px}
.sheet .big{max-height:48vh;object-fit:contain;background:var(--paper)}
.btnl{cursor:pointer;display:inline-flex;align-items:center}
.map .mbg{opacity:.92}
.map text{paint-order:stroke;stroke:var(--card);stroke-width:3px;stroke-linejoin:round}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--card);padding:8px 14px;border-radius:8px;font-family:var(--f-ui);font-size:.85rem;z-index:40;max-width:calc(100% - 32px)}
.wp{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-block:4px;border-bottom:1px dashed var(--line)}
</style>
</head><body>
<div id="app"></div>
<script>

  const base=Math.min(S.ng,1000)+(has(S,'gongryeong')?60+S.realm*40:0)+S.sk[S.mainW]*2+bestTier(S)*30+S.qing*.6+S.t.bone*5+wpVal(S,S.wpn)+20;

function mkFoe(o){const f=Object.assign({q:1,hide:0,hs:0,kw:[]},o);f.pow=Math.round(FOEBASE[f.realm]*f.q*REALMS[f.realm].mult*(f.id?1:(.95+Math.random()*.1)));return f;}

function guessRealm(v){let b=0,bd=1e9;REALMS.forEach((r,i)=>{const d=Math.abs(FOEBASE[i]*r.mult-v);if(d<bd){bd=d;b=i;}});return b;}
function perceive(S,f){if(!f.hide||insight(S,f)>=f.hs)return {v:f.pow,real:true,realm:f.realm,cue:false};
  const v=Math.round(f.pow*(1-f.hide));return {v,real:false,realm:guessRealm(v),cue:insight(S,f)>=f.hs*.6};}
function battle(S,f,o){o=o||{};const k=kwSet(S);const fk=f.kw||[];
  let my=pow(S)*(.85+Math.random()*.3),fo=f.pow*(.85+Math.random()*.3);
  if(k.has('쾌')&&fk.includes('중'))my*=1.05; if((k.has('불')||k.has('도'))&&fk.some(x=>x==='마'||x==='혈'))my*=1.1;
  if(k.has('환'))fo*=.96; if(k.has('암'))my*=1.03; if(k.has('율')&&f.group)my*=1.1;
  if(o.ally)my*=o.ally; if(o.weaken)fo*=o.weaken;
  const r=my/fo;let fr=r>=1?.35/(r*r):.35+.5*(1-r);
  if(fk.includes('독')){if(has(S,'dokche')){A(S,{ng:2});fr-=.05;}else fr+=.12*(1-S.rp/100);} if(fk.includes('마')&&S.rm<50)A(S,{mood:-6});
  fr*=dmgMult(S); if(r<.6&&f.lethal)fr=Math.max(fr,1.1); if(o.spar)fr=Math.min(fr,.3);
  hurt(S,Math.round(hpMax(S)*fr),o.cause||`${f.nick?f.nick+' ':''}${jo(f.n,'과','와')}의 싸움`);
  if(r>=1&&k.has('혈'))A(S,{hp:Math.round(hpMax(S)*.1),moral:-1});
  if(k.has('마')||k.has('혈'))A(S,{moral:-1,temper:1});
  if(r>=1&&f.lethal){const sl=has(S,'slaughter')&&!S.flags.salTamed;A(S,{salgi:sl?6:3,mood:sl?8:-3});if(has(S,'seongol'))A(S,{mood:-10,cult:-3});}
  if(f.id)S.met[f.id]=1;

  return {win:r>=1,r,rev};}

/* 별호 후보: 경지·명성·성향·소속·무공의 결로 정해진다 */
const NICK_RANK=['소협·소귀','객·수·귀','협·룡·봉','지역 마','왕·후·마','제','황','존·선','신'];
function adjPool(S){const a=[];[...kwSet(S)].forEach(x=>a.push(...KW[x].adj));if(S.t.looks>=8)a.push('옥면');if(!a.length)a.push('청풍','일검','철혈');return a;}
function nickCands(S){const r=S.realm,f=S.fame,W=WCH[S.mainW]||'검',A_=adjPool(S),k=kwSet(S),out=[];
  const evil=S.moral<=-30||styleOf(S)==='마';const add=(n,rk)=>{if(!out.some(o=>o.n===n))out.push({n,r:rk});};

  if(S.t.looks>=8&&top>=1)add('옥면'+W+(top>=4?'왕':'객'),Math.min(top,4));

  const taken=new Set(Object.keys(NPCS).filter(id=>!S.dead_npc[id]).map(id=>NPCS[id].nick));
  return out.map(o=>taken.has(o.n)?{n:pick(A_).slice(0,1)+o.n,r:o.r}:o);}

  {t:'정혼서',x:'서린에게서 짧은 서찰이 왔다. “아버지가 모용세가와 혼약을 정하셨어요. 아버지는 검 하나로 천하의 절반을 얻으셨지만, 딸의 마음 하나는 얻지 못하셨어요. 나는 그분을 미워하지 않아요. 그래서 더 아파요.”',
   ch:[{t:'검왕을 찾아가 직언한다',h:'명성·구력. 천하제일검 앞에서 말이 나올지.',go:S=>{S.met.gumwang=1;if(S.fame/5+S.tongue+R(0,40)>=75){S.flags.seorinFree=1;rel(S,'seorin',15);A(S,{fame:10});return '검왕의 기세가 방 안을 눌렀다. 숨이 막혔지만 끝까지 말했다. “따님은 꽃이 아니라 검입니다. 검을 칼집에만 두면 녹이 습니다.” 검왕은 한참 말이 없다가 혼약서를 화로에 넣었다.';}
      A(S,{mood:-15});rel(S,'seorin',8);return '입을 열기도 전에 검왕의 눈빛 하나에 말이 목에 걸렸다. 천하의 무게가 한 사람의 눈에 다 담겨 있었다. 아무 말도 못 하고 물러났다. 강해지고 싶다고, 그날 처음 뼈저리게 생각했다.';}},
    {t:'함께 달아나자고 한다',go:S=>{S.flags.seorinRun=1;rel(S,'seorin',20);A(S,{enemies:2});return '그녀가 당신 손을 잡았다가 놓았다. “도망친 자리에도 아버지는 계실 거예요. 그래도… 그 말을 들은 것만으로 오늘은 견딜 수 있어요.”';}},
    {t:'그녀가 스스로 고르도록 기다린다',go:S=>{rel(S,'seorin',10);A(S,{cult:3});return '답장에 한 줄만 적었다. “어느 길을 가든 그 끝에서 기다리겠소.” 보름 뒤 돌아온 답장에는 먹물이 번져 있었다.';}}]},
  {t:'창궁무애',x:'서린이 아버지에게 검을 겨누었다는 소문이 돌았다. 그녀가 당신을 불렀다. “이기려는 게 아니에요. 아버지께 내 검을 보여 드리려는 거예요. 당신이 봐 주세요.”',
   ch:[{t:'곁에서 지켜본다',go:S=>{S.flags.seorinFree=1;rel(S,'seorin',15);return '백 합. 서린의 검이 부러졌다. 검왕이 부러진 검끝을 주워 오래 보았다. “검에 마음이 실렸구나. 내가 가르치지 못한 것을 너는 어디서 배웠느냐.” 서린은 대답 대신 당신 쪽을 보았다.';}},
    {t:'대신 검왕 앞에 선다',h:'검왕과 비무',go:S=>{const b=battle(S,npcFoe(S,'gumwang'),{spar:1});rel(S,'seorin',b.win?10:14);if(b.win||b.r>.5)S.flags.seorinFree=1;return fightText(b,'검왕의 검이 처음으로 반걸음 물러났다. 서린이 달려와 당신 소매를 붙잡았다. “내 싸움이었는데.” 목소리는 화가 났는데 눈은 웃고 있었다.','검왕의 검은 산 같았다. 쓰러진 당신을 서린이 일으켰다. 검왕이 등을 돌리며 말했다. “딸을 위해 산에 부딪치는 놈이라. 나쁘지 않다.”');}}]}],
  wed:'남궁세가의 후원에서 매일 새벽 둘이서 검을 맞댄다. 서린은 아직도 진 날이면 저녁을 굶는다. 당신은 몰래 설탕 과자를 사 온다. 처음 담장을 넘던 날 사 준 그것이다.',
  old:'백발이 된 서린이 마당에서 검무를 춘다. 검은 느려졌지만 흔들리지 않는다. “우리 둘 다 천하제일은 못 됐네요.” 당신이 웃는다. “서로에게는 됐지.” 바람에 매화가 진다.',
  fate:S=>S.flags.seorinFree?'남궁 서린이 남궁세가 최초의 여가주가 되었다는 소식이 왔다. 취임하던 날 그녀는 면사를 벗고 검을 들었다고 한다. 사람들은 이제 그녀를 천하제일미가 아니라 창궁검후라 부른다.':'남궁 서린은 모용세가로 시집갔다. 해마다 봄이면 이름 없는 서찰이 한 통 온다. “검은 아직 놓지 않았어요.” 그 한 줄이 전부지만, 그것으로 충분했다.'},
 soso:{st:[
  {t:'웃음의 까닭',x:'늘 웃던 연 소소가 금정 절벽 끝에 앉아 울고 있었다. 당신을 보자 얼른 눈물을 닦았다. “사부님이 웃으면 복이 온대서 열심히 웃었거든요. 그런데 복은 안 오고 웃음만 늘었네요.”',
   ch:[{t:'옆에 앉아 함께 운다',go:S=>{rel(S,'soso',15);A(S,{mood:-5,cult:2});return '둘이서 구름바다를 보며 울었다. 다 울고 나서 소소가 코를 훌쩍이며 말했다. “이상하다. 같이 우니까 반만 슬퍼요.”';}},
    {t:'우스운 이야기를 해 준다',h:'구력',go:S=>{rel(S,'soso',10+Math.round(S.tongue/10));A(S,{tongue:2});return '소림 땡중이 고기만두를 훔쳐 먹다 들킨 이야기에 소소가 콧물까지 흘리며 웃었다. 이번에는 진짜 웃음이었다.';}},
    {t:'말없이 손수건을 건넨다',go:S=>{rel(S,'soso',11);return '그녀가 손수건에 코를 팽 풀고는 돌려주려다 멈칫했다. “빨아서 줄게요.” 그 손수건은 끝내 돌아오지 않았다.';}}]},
  {t:'삭발하는 날',x:'아미 장문인이 소소를 후계로 정했다. 다음 보름에 머리를 깎는다. 소소가 머리카락 한 줌을 쥐고 말했다. “부처님께 다 드리면 무서운 게 없어진대요. 그런데 나는 아직 무서운 게 하나 남았어요.”',
   ch:[{t:'그대의 길을 가라고 한다',h:'놓아준다',go:S=>{S.flags.sosoNun=1;S.flags.noMarry_soso=1;rel(S,'soso',5);A(S,{cult:6});return '“그 말 할 줄 알았어요.” 소소가 웃었다. 처음 만난 날처럼 환하게. 보름 뒤 금정에서 종이 아홉 번 울렸다.';}},
    {t:'그 무서운 것이 나라면, 머리를 기를 이유가 되겠다',go:S=>{S.flags.sosoStay=1;rel(S,'soso',20);return '소소가 쥐고 있던 머리카락을 바람에 놓았다. “그럼 책임져요. 이 머리 다 자랄 때까지.”';}},
    {t:'어느 쪽이든 기다리겠다고 한다',go:S=>{rel(S,'soso',14);A(S,{cult:3});return '소소는 한참 당신을 보다가 고개를 끄덕였다. “기다려 주는 사람이 있으면, 어느 길이든 덜 외로울 거예요.”';}}]},
  {t:S=>S.flags.sosoNun?'염주 한 줄':'금정의 약속',x:S=>S.flags.sosoNun?'머리를 깎은 소소가 찾아왔다. 법명은 혜연. 웃음은 그대로였다. 그녀가 당신 손에 염주 한 줄을 쥐여 주었다. “매일 당신을 위해 경을 한 권씩 읽어요. 이것도 사랑이라면… 아마 세상에서 제일 오래가는 사랑일 거예요.”':'소소가 아미의 계첩을 돌려주고 산을 내려왔다. 보따리 하나를 메고 당신 앞에 섰다. “부처님께는 다음 생에 다 드리기로 했어요. 이번 생은 조금만 빌려 쓸게요.”',
   ch:S=>S.flags.sosoNun?[{t:'염주를 받는다',go:S=>{rel(S,'soso',5);A(S,{rm:12,cult:8});S.flags.sosoBeads=1;return '그 염주는 평생 당신 손목을 떠나지 않았다. 마기가 들끓는 밤이면 한 알씩 굴렸다. 그때마다 어디선가 경 읽는 소리가 들리는 것 같았다.';}}]
    :[{t:'보따리를 받아 든다',go:S=>{rel(S,'soso',15);return '보따리는 생각보다 가벼웠다. 그녀가 가진 것은 그게 다였다. 그래서 더 무거웠다.';}},
      {t:'정말 후회하지 않겠느냐 묻는다',go:S=>{rel(S,'soso',10);A(S,{cult:2});return '“후회할지도 몰라요.” 소소가 말했다. “그래도 안 해 보고 하는 후회보다, 해 보고 하는 후회가 덜 억울하잖아요.”';}}]}],
  wed:'소소는 혼인하고도 아이처럼 웃는다. 가끔 새벽에 몰래 일어나 불경을 외운다. 다음 생에 갚을 빚이라며. 당신은 모른 척 이불을 덮어 준다.',
  old:'소소의 머리가 하얗게 셌다. “봐요, 결국 다 깎은 거나 마찬가지잖아요.” 그녀가 웃는다. 금정 절벽에서 처음 웃던 그날처럼.',
  fate:S=>S.flags.sosoNun?'아미의 혜연 신니가 고아 백 명을 거두었다는 소식이 들렸다. 사람들이 까닭을 묻자 그녀는 웃으며 말했다고 한다. “옛날에 누가 나랑 같이 울어 줬거든요.”':'연 소소는 강호를 떠도는 여협이 되었다. 가는 곳마다 우는 아이를 웃기고 다닌다고 한다. 그 웃음에는 이제 그늘이 없다.'},
 hwayeon:{st:[
  {t:'부채 뒤의 얼굴',x:'화 연의 금 소리가 객잔을 채우자 사내들의 눈이 풀렸다. 당신만 멀쩡했다. 연주가 끝나자 그녀가 부채 너머로 당신을 보았다. “내 소리에 흔들리지 않는 분은 처음이네요. 그래서 궁금해요. 당신이 들은 건 내 소리인가요, 나인가요.”',
   ch:[{t:'그대를 들었소',go:S=>{rel(S,'hwayeon',15);return '부채가 아주 잠깐 흔들렸다. “거짓말.” 그녀가 말했다. 그런데 그 목소리가 금 소리보다 떨렸다.';}},
    {t:'부채를 내려 보라고 한다',go:S=>{rel(S,'hwayeon',12);return '그녀가 부채를 내렸다. 짙은 화장 아래 얼굴이 생각보다 어렸다. “이 얼굴은 어머니께도 안 보여 드려요.”';}},
    {t:'흔들리는 척해 본다',h:'심계',go:S=>{rel(S,'hwayeon',6);A(S,{mind:3});return '“연기가 서툴러요.” 그녀가 웃었다. 처음 보는, 가면 없는 웃음이었다.';}}]},
  {t:'어머니의 명',x:'한밤에 화 연이 찾아왔다. 소매 속에 비수가 있었다. 손이 떨렸다. “어머니께서 당신을 데려오라 하셨어요. 살아서든 죽어서든. 어머니는 사랑하는 법은 가르쳐 주신 적이 없어요. 죽이는 법만 가르치셨죠. 그런데 이상하죠. 당신 앞에서는 둘 다 모르겠어요.”',
   ch:[{t:'비수를 쥔 손을 감싸 내려놓는다',go:S=>{rel(S,'hwayeon',20);A(S,{moral:5});return '비수가 바닥에 떨어졌다. 그녀가 아이처럼 울었다. 만화궁의 꽃들은 울지 않도록 배운다고 했다.';}},
    {t:'함께 만화궁을 떠나자고 한다',go:S=>{S.flags.hwaRun=1;rel(S,'hwayeon',15);A(S,{enemies:2});return '“꽃은 꺾이면 시든다고 배웠어요.” 그녀가 말했다. “옮겨 심으면 어떻게 되는지는 아무도 안 가르쳐 줬어요. 알아보고 싶어요.”';}},
    {t:'백화마후와 담판을 짓겠다',h:'비무로 겨룬다',go:S=>{const b=battle(S,npcFoe(S,'hwayoung'),{spar:1});S.met.hwayoung=1;if(b.win){S.flags.hwaFree=1;rel(S,'hwayeon',18);}else rel(S,'hwayeon',12);return fightText(b,'백화마후가 부채를 접었다. “내 딸의 소리에 흔들리지 않더니, 내 소리에도 흔들리지 않는구나. 데려가거라. 꽃은 본래 바람이 데려가는 것이다.”','백화마후의 소리에 무릎이 꺾였다. 정신을 차렸을 때 화 연이 당신 앞을 막아서 있었다.');}}]},
  {t:'백화가 지는 날',x:'화 연이 만화궁의 부채를 불에 넣었다. 비단이 타며 꽃 냄새가 났다. “꽃은 지는 걸 두려워하지 않아요. 피어 보지도 못하는 걸 두려워하지.” 그녀가 당신을 돌아보았다. “이제 피어 볼게요.”',
   ch:[{t:'그 손을 잡는다',go:S=>{S.flags.hwaFree=1;rel(S,'hwayeon',15);return '불빛이 그녀 얼굴을 비췄다. 화장하지 않은 얼굴이 처음으로 화사했다.';}},
    {t:'새 부채를 만들어 주겠다고 한다',go:S=>{S.flags.hwaFree=1;rel(S,'hwayeon',12);A(S,{forge:2});return '“이번엔 아무도 홀리지 않는 부채로 해 주세요.” 그녀가 웃었다. “한 사람이면 충분하니까.”';}}]}],
  wed:'화 연은 이제 사람을 홀리려고 금을 타지 않는다. 저녁마다 당신을 위해 한 곡, 마당의 아이들을 위해 한 곡. 미혼음이 아닌데도 듣는 이들이 하나같이 넋을 놓는다.',
  old:'늙은 화 연의 손가락이 굳어 금줄을 자꾸 놓친다. 그래도 그녀는 탄다. 음이 틀릴 때마다 당신이 웃는다. “이제야 내 소리가 들리나 보네요.” 그녀가 말한다.',
  fate:S=>S.flags.hwaFree||S.flags.hwaRun?'화 연이 강남에 작은 서원을 열고 아이들에게 금을 가르친다는 소식이 왔다. 미혼음은 가르치지 않는다고 한다. “소리는 마음을 훔치는 게 아니라 건네는 거란다.” 그것이 첫 가르침이라 했다.':'화 연이 만화궁의 궁주가 되었다. 그녀가 궁주가 된 뒤로 만화궁의 소리에 죽은 사내는 하나도 없다고 한다.'},
 sohye:{st:[
  {t:'장갑',x:'당 소혜는 한여름에도 비단 장갑을 벗지 않았다. “내 손에 닿은 건 다 시들어요. 꽃도, 고양이도. 어릴 때 손을 잡아 주던 유모도요.” 그녀가 장갑 낀 손을 등 뒤로 숨겼다.',
   ch:[{t:'장갑 위로 손을 잡는다',go:S=>{rel(S,'sohye',14);return '그녀가 손을 빼려다 멈췄다. 장갑 너머로도 손이 찼다. “따뜻하네요.” 그녀가 작게 말했다.';}},
    {t:'장갑을 벗기고 맨손을 잡는다',h:'항독 60 이상이거나 독에 강한 몸',if:S=>S.rp>=60||has(S,'manduk')||has(S,'dokche'),go:S=>{rel(S,'sohye',25);S.flags.sohyeTouch=1;return '그녀가 비명을 질렀다. 그런데 당신은 멀쩡했다. 그녀는 한참 당신 손을 내려다보다가, 그 손에 얼굴을 묻고 울었다. 열두 해 만에 맞잡은 맨손이었다.';}},
    {t:'고칠 방법을 찾겠다고 약속한다',go:S=>{rel(S,'sohye',10);S.flags.sohyePromise=1;return '“다들 그렇게 말했어요.” 그녀가 웃었다. “그래도 고마워요. 약속은 지켜지지 않아도, 받는 사람은 따뜻하거든요.”';}}]},
  {t:'독이 심장에 닿다',x:'소혜가 쓰러졌다. 몸 안의 독이 심장 가까이 올라왔다. 당가 장로들은 차라리 그녀를 독인으로 만들어 가문의 무기로 쓰자고 한다. 그녀가 숨을 몰아쉬며 말했다. “가문은 나를 보물이라 불러요. 칼집에 든 칼도 보물이라 부르죠.”',
   ch:[{t:'의술로 독을 뽑아낸다',h:'의술 50 이상',if:S=>S.med>=50,go:S=>{if(chance(.4+S.med/150)){S.flags.sohyeCured=1;rel(S,'sohye',20);deed(S,'당 소혜의 독을 고쳤다');return '아흐레 밤을 은침 하나에 걸었다. 열흘째 아침, 소혜가 창가의 난초를 맨손으로 만졌다. 난초는 시들지 않았다.';}rel(S,'sohye',12);return '독을 반쯤 뽑아냈다. 완전하지는 않았지만, 그녀는 다시 걸을 수 있었다.';}},
    {t:'그 독을 내 몸으로 끌어온다',h:'항독이 낮으면 크게 다친다',go:S=>{hurt(S,Math.round(45*(1-S.rp/120)),'끌어온 독');if(S.rp>=70||has(S,'manduk')||has(S,'dokche'))S.flags.sohyeCured=1;rel(S,'sohye',20);return '그녀의 독을 손바닥으로 받아 내 몸으로 끌어왔다. 혈관이 검게 물들었다. 정신이 들었을 때 그녀가 당신 손을 쥐고 있었다. 장갑 없이.';}},
    {t:'장로들 앞을 막아선다',go:S=>{rel(S,'sohye',12);A(S,{enemies:1,fame:5});return '“이 사람은 칼이 아니라 사람이오.” 장로들이 독침을 꺼냈지만 아무도 쏘지 못했다. 독을 다루는 자일수록, 숨김없는 말 앞에서 손이 굳는다.';}}]},
  {t:'맨손',x:'소혜가 들판에 서서 장갑을 벗었다. 들꽃 한 송이를 꺾어 오래 쥐고 있었다. 꽃은 시들지 않았다. 아니, 시들었더라도 그녀는 웃고 있었다.',
   ch:[{t:'그 꽃을 받는다',go:S=>{rel(S,'sohye',15);return '“처음이에요.” 그녀가 말했다. “무언가를 쥐고도 잃지 않은 게.”';}}]}],
  wed:'당가식 신혼은 조금 별나다. 아침상의 어느 그릇에 독이 들었는지 맞히는 내기를 한다. 소혜는 매일 진다. 일부러 지는 것 같다.',
  old:'늙은 소혜가 장갑 없이 손주들의 머리를 쓰다듬는다. 아이들은 할머니 손이 왜 이렇게 따뜻하냐고 묻는다. 그녀가 당신을 쳐다본다.',
  fate:S=>S.flags.sohyeCured?'당 소혜가 당가 의각의 주인이 되었다. 독을 다루던 손으로 이제는 해독제를 만든다. 사천에서 독에 죽는 이가 해마다 줄고 있다.':'독봉 당 소혜는 여전히 장갑을 낀다. 하지만 이제 그 장갑으로 아이들 머리를 쓰다듬는다고 한다. 당가 사람들이 그 모습을 처음 보고 놀랐다고 한다.'},
 hyun:{st:[
  {t:'옥룡의 밤',x:'달밤에 남궁 현이 혼자 검을 휘두르고 있었다. 손바닥이 터져 피가 손잡이를 적셨다. “사람들은 내가 타고났다고 하오. 내가 타고난 건 이 굳은살뿐이오. 남궁의 장자는 지면 안 되니까.”',
   ch:[{t:'손을 싸매 준다',go:S=>{rel(S,'hyun',14);A(S,{med:1});return '“하찮은 상처요.” 그가 말했지만 손을 빼지 않았다.';}},
    {t:'곁에서 함께 휘두른다',go:S=>{rel(S,'hyun',12);A(S,{exp:tb(S)*.3});return '새벽까지 나란히 검을 휘둘렀다. 그가 처음으로 웃었다. “혼자가 아니니 덜 무겁군.”';}},
    {t:'져도 된다고 말해 준다',go:S=>{rel(S,'hyun',16);A(S,{tongue:2});return '그가 오래 당신을 보았다. “그 말을 해 준 사람이 없었소. 아버지도, 나 자신도.”';}}]},
  {t:'가주의 무게',x:'검왕이 병석에 누웠다. 원로들이 남궁 현에게 가주 자리와 함께 정략혼을 내밀었다. 그가 당신에게 물었다. “가문을 지키는 것과 나를 지키는 것. 하나만 고르라면, 당신이라면 무엇을 고르겠소.”',
   ch:[{t:'둘 다 지킬 길을 찾자',h:'구력·처세',go:S=>{if(S.tongue+S.savvy+R(0,40)>=70){S.flags.hyunFree=1;rel(S,'hyun',20);return '원로 회의에서 당신이 남궁세가의 빚을 갚을 길을 내놓았다. 정략혼은 없던 일이 되었다. 회의장을 나서며 남궁 현이 처음으로 소리 내어 웃었다.';}rel(S,'hyun',10);return '원로들은 당신 말을 듣지 않았다. 그래도 그가 말했다. “같이 싸워 준 것만으로 됐소.”';}},
    {t:'가주가 되시오. 나는 기다리겠소',go:S=>{rel(S,'hyun',12);A(S,{cult:3});return '“기다린다는 말이 이렇게 무거운 줄 몰랐소.” 그가 말했다. “그러니 반드시 돌아오겠소.”';}}]},
  {t:'깨진 옥',x:'가주가 된 남궁 현이 첫 싸움에서 크게 졌다. 사람들은 옥룡에 금이 갔다고 수군댄다. 그가 당신 앞에서 처음으로 고개를 숙였다. “깨진 옥도 옥이오?”',
   ch:[{t:'깨진 틈으로 빛이 드는 법이오',go:S=>{S.flags.hyunFree=1;rel(S,'hyun',18);return '그가 한참 웃었다. 그러다 울었다. 완벽한 옥룡이 아니라 한 사람이 거기 있었다.';}}]}],
  wed:'남궁 현은 가주의 일이 아무리 늦게 끝나도 꼭 당신과 저녁을 먹는다. “천하에서 내가 지지 않아도 되는 유일한 자리요.” 그가 말한다.',
  old:'백발의 남궁 현이 손주에게 검을 가르친다. “지는 것도 배워야 한다.” 그러고는 당신을 보며 웃는다. “누가 가르쳐 준 거요.”',
  fate:S=>S.flags.hyunFree?'남궁 현이 가주가 된 뒤로 남궁세가가 서자와 방계를 차별 없이 받기 시작했다. 사람들은 옥룡이 둥글어졌다고 한다.':'남궁 현은 정략혼을 했다. 그래도 당신이 그의 손을 싸매 준 날이 돌아오면, 그는 혼자 달밤에 검을 든다고 한다.'},
 cheongun:{st:[
  {t:'신룡의 오만',x:'매 청운이 술잔을 내밀었다. “너 정도면 내 상대로 나쁘지 않아. 칭찬이다.” 싸가지 없는 말투인데 귀끝이 빨갰다.',
   ch:[{t:'칭찬 고맙다고 받아친다',h:'구력',go:S=>{rel(S,'cheongun',12);return '“…뭐야, 화를 내야지.” 그가 당황했다. 그 모습이 의외로 우스웠다.';}},
    {t:'잔을 받아 단숨에 비운다',go:S=>{rel(S,'cheongun',14);return '“좋아, 그 기세.” 그가 한 잔 더 따랐다. 밤새 마셨다. 다음 날 둘 다 비무에 늦었다.';}}]},
  {t:'검성의 그림자',x:'매 청운이 화산 정상에서 혼자 나뭇가지를 꺾고 있었다. “화산 백 년 만의 기재래. 그 백 년 전에 누가 있었는지 알아? 검성 독고 무야. 나는 평생 그 사람 그림자 밑에서 비교만 당할 거야.”',
   ch:[{t:'그림자는 빛이 있어야 생긴다',go:S=>{rel(S,'cheongun',16);return '그가 가지를 꺾던 손을 멈췄다. “…그런 말은 어디서 배웠어?” “방금 지었소.” 그가 웃음을 터뜨렸다.';}},
    {t:'함께 검성의 바위를 보러 간다',go:S=>{rel(S,'cheongun',12);A(S,{mu:5});return '검성이 새겼다는 바위의 초식을 둘이서 밤새 따라 했다. 둘 다 반도 따라 하지 못했다. 그게 오히려 위안이 됐다.';}}]},
  {t:'남은 손',x:S=>S.flags.cwFate==='saved'?'외팔이 된 매 청운이 왼손으로 당신 손을 잡았다. “오른손은 검한테 줬어. 남은 하나는… 너한테 줄게. 싫으면 말고.”':'매 청운이 처음으로 진지한 얼굴을 했다. “신룡이니 뭐니, 다 남들이 붙인 이름이야. 너한테는 그냥 청운이고 싶어.”',
   ch:[{t:'그 손을 잡는다',go:S=>{rel(S,'cheongun',18);return '“…싫다고 할 줄 알았는데.” 그가 고개를 돌렸다. 귀끝이 또 빨갰다.';}}]}],
  wed:'매 청운은 혼인하고도 여전히 싸가지가 없다. 다만 그 싸가지가 당신 앞에서만 조금 순해진다. 화산 제자들이 그 모습을 보고 기겁한다.',
  old:'늙은 매 청운이 제자들에게 자랑한다. “너희 사모는 나를 한 번도 이긴 적이 없다.” 당신이 헛기침을 한다. 그가 슬그머니 말을 바꾼다. “…거의 없다.”',
  fate:S=>'매 청운이 화산 장문인이 되어 제자들에게 이렇게 가르친다고 한다. “남과 비교하지 마라. 견줄 상대는 어제의 너 하나다.” 다들 그가 한 말 같지 않다고 수군댄다.'},
 jegalun:{st:[
  {t:'반쯤 쓴 시',x:'제갈 운이 정자에서 시를 쓰다 붓을 멈췄다. 기침이 길었다. “점쟁이가 나는 서른을 넘기지 못한다더군요. 그래서 시를 끝까지 쓰지 않아요. 끝을 쓰면, 정말 끝날 것 같아서.”',
   ch:[{t:'마지막 행을 대신 써 준다',h:'학문',go:S=>{rel(S,'jegalun',10+Math.round(S.lore/10));A(S,{lore:2});return '당신이 쓴 행을 보고 그가 웃었다. “형편없군요.” 그러면서도 그 종이를 품에 넣었다.';}},
    {t:'점쟁이를 찾아가 따지겠다',go:S=>{rel(S,'jegalun',12);return '“점쟁이는 이미 죽었어요. 자기 운명은 못 봤나 봐요.” 그가 웃었다. 처음으로 기침 없이.';}},
    {t:'약을 지어 준다',h:'의술',go:S=>{rel(S,'jegalun',10+Math.round(S.med/10));S.flags.unMed=1;return '쓴 탕약을 그가 얼굴을 찡그리며 다 마셨다. “맛없는 걸 끝까지 먹는 건, 살고 싶다는 뜻이겠죠.”';}}]},
  {t:'각혈',x:'제갈 운이 피를 토했다. 정천신산 제갈 휘가 조카의 손을 잡고 아무 말도 하지 못했다. 천하의 수를 다 읽는다는 사람이었다. 제갈 운이 당신에게 속삭였다. “숙부도 못 읽는 수가 있네요. 그게 좀 우스워요.”',
   ch:[{t:'영약을 구해 온다',h:'은자 200냥',if:S=>S.gold>=200,go:S=>{A(S,{gold:-200});S.flags.unCured=1;rel(S,'jegalun',20);return '사천의 약방을 다 뒤져 만년설삼을 구해 왔다. 그가 한 모금 마시고 말했다. “서른이 넘으면, 시의 끝을 같이 써 줘요.”';}},
    {t:'의술로 맥을 다스린다',h:'의술 40 이상',if:S=>S.med>=40,go:S=>{if(chance(.45+S.med/150))S.flags.unCured=1;rel(S,'jegalun',18);return '침을 놓고 밤새 맥을 짚었다. 새벽녘 그의 숨이 고르게 가라앉았다.';}},
    {t:'남은 날을 같이 보내자고 한다',go:S=>{rel(S,'jegalun',16);A(S,{cult:4});return '그날부터 그가 쓰는 시마다 당신이 나왔다. 서른이 넘도록.';}}]},
  {t:'시의 끝',x:'서른 번째 생일. 제갈 운이 반쯤 쓴 시들을 모두 펼쳤다. “점쟁이가 틀렸어요. 아니면 당신이 운명을 틀리게 만들었거나.” 그가 붓을 내밀었다. “끝을 같이 써요.”',
   ch:[{t:'붓을 함께 쥔다',go:S=>{rel(S,'jegalun',15);A(S,{lore:5});return '마지막 행은 두 사람 글씨가 섞여 삐뚤빼뚤했다. 그래서 더 좋았다.';}}]}],
  wed:'제갈 운은 여전히 기침을 한다. 하지만 이제 시의 끝을 쓴다. 집 벽마다 완성된 시가 붙어 있다. 대부분 당신 이야기다. 손님이 오면 좀 민망하다.',
  old:'제갈 운이 일흔을 넘겼다. “점쟁이가 들으면 기절하겠군요.” 그가 웃는다. 서른을 못 넘긴다던 사내가 손주의 손주를 안고 있다.',
  fate:S=>'제갈 운의 시집이 강남에서 널리 읽힌다는 소식이 들렸다. 첫 장에는 이렇게 적혀 있다고 한다. “끝을 쓰게 해 준 이에게.”'},
 mugyeol:{st:[
  {t:'침묵',x:'당 무결은 하루에 열 마디도 하지 않는다. 사흘을 함께 걸었는데 그가 한 말은 “비 온다” 하나였다. 그리고 정말 비가 왔다.',
   ch:[{t:'말없이 함께 걷는다',go:S=>{rel(S,'mugyeol',14);A(S,{cult:3});return '말없이 걷는 것이 이렇게 편할 줄 몰랐다. 나흘째, 그가 당신에게 우산을 씌워 주었다. 역시 말없이.';}},
    {t:'쉬지 않고 말을 건다',h:'구력',go:S=>{rel(S,'mugyeol',10);A(S,{tongue:2});return '그가 결국 웃었다. 소리 없이, 입꼬리만. 그게 그의 최대치라는 건 나중에 알았다.';}},
    {t:'그의 독술을 배우고 싶다고 청한다',go:S=>{rel(S,'mugyeol',12);A(S,{rp:5,med:3});return '그는 대답 대신 독초 하나를 건넸다. 다음 날 또 하나. 그렇게 백 가지를 배웠다.';}}]},
  {t:'누명',x:'당가의 셋째 공자가 독살되었다. 모두가 당 무결을 의심한다. 그는 변명하지 않았다. “변명은 의심하는 자를 위한 것이다. 나는 그들을 위해 입을 열 생각이 없다.”',
   ch:[{t:'진범을 찾는다',h:'심계',go:S=>{if(S.mind+R(0,40)>=55){S.flags.mugyeolClear=1;rel(S,'mugyeol',20);A(S,{fame:10});return '독의 흔적을 거꾸로 밟아 진범을 찾았다. 둘째 공자였다. 당 무결은 끝내 형의 일을 누구에게도 말하지 않았다. 당신에게만 한마디 했다. “고맙다.”';}rel(S,'mugyeol',10);return '진범을 찾지 못했다. 그래도 그가 말했다. “믿어 주는 사람이 하나면, 나머지는 상관없다.”';}},
    {t:'그의 곁에 선다',go:S=>{rel(S,'mugyeol',15);A(S,{enemies:1});return '당가 사람들이 당신까지 의심했다. 당 무결이 처음으로 길게 말했다. “나를 의심하는 건 상관없다. 이 사람은 건드리지 마라.”';}}]},
  {t:'아껴 둔 말',x:'당 무결이 당신을 사천의 대숲으로 데려갔다. 한참 말이 없다가 입을 열었다. “나는 말을 아낀다. 아껴 둔 말이 하나 있어서다.”',
   ch:[{t:'그 말을 기다린다',go:S=>{rel(S,'mugyeol',18);return '그가 그 말을 했다. 세 글자였다. 대숲에 바람이 불었다. 그 뒤로도 그는 그 말을 자주 하지 않았지만, 할 때마다 진심이었다.';}}]}],

  const f=EV.find(e=>e.force&&eligible(S,e)&&e.force(S));if(f)return f.id;
  if(S.flags.nextEv){const id=S.flags.nextEv;delete S.flags.nextEv;if(EVM[id])return id;}
  if(chance(S.age<13?.5:.6)){const pool=EV.filter(e=>e.w&&eligible(S,e)&&wOf(S,e)>0);
    const ws=pool.map(e=>wOf(S,e)*(e.reg?(e.reg.includes(S.loc)?3:.35):1));const tot=ws.reduce((a,b)=>a+b,0);
    let r=Math.random()*tot;for(let i=0;i<pool.length;i++){if((r-=ws[i])<0)return pool[i].id;}}

const LBL={exp:'깨달음',ng:'내공',fame:'명성',moral:'도덕',gold:'은자',hp:'체력',qing:'경공',mu:'무학',forge:'단조',med:'의술',lore:'학문',tongue:'구력',rp:'항독',rm:'항마',savvy:'처세',cult:'수양',mind:'심계',contrib:'공헌',salgi:'살기',enemies:'원한'};
const SNAP=S=>Object.assign({loc:S.loc,mats:{...S.mats},traits:[...S.traits],realm:S.realm,arts:[...S.arts],org:S.org,t:{...S.t},sk:{...S.sk},nick:S.nick&&S.nick.n,wpn:S.wpn&&S.wpn.n,pow:pow(S),temper:S.temper,mood:S.mood,yy:S.yy},Object.fromEntries(Object.keys(LBL).map(k=>[k,S[k]])));
function diffChips(a,b){const c=[];
  for(const k in LBL){const d=b[k]-a[k];if(Math.abs(d)>=.5)c.push({t:`${LBL[k]} ${d>0?'+':''}${k==='ng'?Math.round(d)+'년':Math.round(d)}`,up:(k==='enemies'||k==='salgi')?d<0:d>0});}
  [['bone','근골'],['wit','오성'],['luck','기연'],['looks','용모']].forEach(([k,l])=>{const d=b.t[k]-a.t[k];if(d)c.push({t:`${l} ${d>0?'+':''}${d}`,up:d>0});});
  WEAPONS.forEach(w=>{const d=b.sk[w]-a.sk[w];if(d>=1)c.push({t:`${w} 숙련 +${Math.round(d)}`,up:true});});
  const tm=b.temper-a.temper;if(Math.abs(tm)>=2)c.push({t:tm>0?'성정이 거칠어짐':'성정이 온화해짐',up:tm<0});
  const md=b.mood-a.mood;if(Math.abs(md)>=5)c.push({t:md>0?'심상 밝아짐':'심상 가라앉음',up:md>0});
  const yd=b.yy-a.yy;if(Math.abs(yd)>=3)c.push({t:yd>0?`양기 +${yd}`:`음기 +${-yd}`,up:true});
  if(b.loc!==a.loc)c.push({t:`위치 ${b.loc}`,up:true});
  if(b.realm>a.realm)c.push({t:`경지 ${REALMS[b.realm].n}`,up:true});
  b.arts.filter(x=>!a.arts.includes(x)).forEach(x=>c.push({t:`무공 ${getArt(x).n}`,up:true}));
  if(b.org!==a.org)c.push({t:b.org?`${ORGS[b.org].n} 입문`:'사문을 떠남',up:!!b.org});
  if(b.nick!==a.nick&&b.nick)c.push({t:`별호 ${b.nick}`,up:true});
  if(b.wpn!==a.wpn&&b.wpn)c.push({t:`병기 ${b.wpn}`,up:true});
  [...new Set([...Object.keys(a.mats),...Object.keys(b.mats)])].forEach(m=>{const d=(b.mats[m]||0)-(a.mats[m]||0);if(d)c.push({t:`${m} ${d>0?'+':''}${d}`,up:d>0});});
  b.traits.filter(x=>!a.traits.includes(x)).forEach(x=>c.push({t:`체질 ${TRAITS[x].n}`,up:true}));
  const dp=b.pow-a.pow;if(Math.abs(dp)>=1)c.push({t:`전투력 ${dp>0?'+':''}${num(dp)}`,up:dp>0});
  return c;}

async function imgGet(k){try{const db=await idb();return await new Promise(res=>{const q=db.transaction('img').objectStore('img').get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null);});}catch(e){return null;}}
async function imgPut(k,b){const db=await idb();await new Promise((res,rej)=>{const t=db.transaction('img','readwrite');t.objectStore('img').put(b,k);t.oncomplete=res;t.onerror=()=>rej(t.error);});}
async function imgDel(k){try{const db=await idb();await new Promise(res=>{const t=db.transaction('img','readwrite');t.objectStore('img').delete(k);t.oncomplete=res;t.onerror=res;});}catch(e){}}

   img/index.json이 있으면 그 목록을 따르고, 목록에 없는 칸은 이름 규칙(img/npc/seorin.png 등)대로 찾아본다. 주인공 초상(pc:)은 저장소에서 찾지 않는다. */

  if(!r.ok){let t='';try{t=(await r.text()).slice(0,160);}catch(e){}throw new Error(r.status===401?'토큰이 맞지 않아요. novelai.net → 설정 → Account → Get Persistent API Token에서 다시 복사해 주세요.':r.status===402?'Anlas가 모자라거나 구독이 필요해요.':r.status===429?'요청이 너무 잦아요. 잠시 뒤 다시 해 주세요.':`NovelAI 오류 ${r.status}: ${t}`);}

   가장자리는 배경색과의 거리로 반투명하게 하고 배경색을 빼서 번짐을 줄인다. 결과는 인물 둘레로 잘라 PNG로 돌려준다. */
async function cutBg(blob,o){const bm=await createImageBitmap(blob),W=bm.width,H=bm.height,N=W*H;

  const im=cx.getImageData(0,0,W,H),d=im.data,bx=[],by=[],bz=[];const pb=i=>{bx.push(d[i*4]);by.push(d[i*4+1]);bz.push(d[i*4+2]);};

  // 가장자리 픽셀은 배경색과 안쪽 인물색이 섞인 것으로 보고, 가까운 안쪽 픽셀과 견주어 투명도를 정한 뒤 배경색을 빼낸다

async function storeSlot(k,b){ // 스탠딩은 원본을 raw:로 남기고 배경을 지워 넣는다
  if(k.startsWith('st:')&&ncfg().autoCut!==false&&!(await hasAlpha(b))){try{await imgPut('raw:'+k,b);b=await cutBg(b,{tol:40});}catch(e){toast('배경을 자동으로 지우지 못해 원본을 넣었어요: '+e.message);}}

async function drawSlot(k,prompt,portrait,quiet){if(BUSY.has(k))return '이미 그리는 중';BUSY.add(k);if(modal&&modal.k===k){modal.err='';}render();

    await storeSlot(k,b);if(modal&&modal.k===k)modal.err='';return true;}
  catch(e){if(modal&&modal.k===k)modal.err=e.message;else if(!quiet)toast(e.message);return e.message;}

/* 한꺼번에 그리기: 빈 칸만 하나씩 차례로 그린다. 그사이 내 그림이나 저장소 그림이 생긴 칸은 건너뛴다. */
let BATCH=null;
async function runBatch(keys){if(BATCH)return;const B=BATCH={keys,i:0,ok:0,fail:0,stop:false,err:'',cur:''};soon();
  for(const k of keys){if(B.stop)break;B.cur=k;soon();
    if(URLS[k]||(await imgGet(k))||(await repoHas(k))){B.i++;continue;}
    const r=await drawSlot(k,slotPrompt(k),isPort(k),true);B.i++;if(r===true)B.ok++;else{B.fail++;B.err=r||'';if(/토큰|Anlas|구독|연결/.test(B.err))break;}
    if(!B.stop)await new Promise(r=>setTimeout(r,1200));}
  BATCH=null;toast(`한꺼번에 그리기 ${B.stop?'멈춤':'끝'}: ${B.ok}장 그림${B.fail?` · ${B.fail}장 실패${B.err?' — '+B.err:''}`:''}`);soon();}

function mapHTML(){const mu=imgURL('map'),s=S,cur=REG[s.loc]?s.loc:'하남',adj=REG[cur].adj;const canTravel=s.phase==='event'&&s.cur==='focus'&&s.age>=14;
  const seen=new Set(),lines=[];for(const r in REG)for(const a of REG[r].adj){const k=[r,a].sort().join();if(seen.has(k)||!REG[a])continue;seen.add(k);lines.push(`<line x1="${REG[r].x}" y1="${REG[r].y}" x2="${REG[a].x}" y2="${REG[a].y}" class="ml ${(r===cur||a===cur)?'adj':''}"/>`);}
  const nodes=Object.entries(REG).map(([r,g])=>{const has=Object.keys(ORGS).some(o=>ORGS[o].reg===r);return `<g class="mn ${r===cur?'cur':''} ${adj.includes(r)?'near':''} ${mapSel===r?'sel':''}" data-a="msel" data-r="${r}" role="button" tabindex="0" aria-label="${r}"><circle class="c" cx="${g.x}" cy="${g.y}" r="${r===cur?11:8}"/>${has?`<circle class="mo" cx="${g.x+10}" cy="${g.y-8}" r="3"/>`:''}<text x="${g.x}" y="${g.y+23}">${r}</text></g>`;}).join('');
  const sel=mapSel&&REG[mapSel]?mapSel:cur,g=REG[sel],orgs=Object.keys(ORGS).filter(o=>ORGS[o].reg===sel),ppl=Object.keys(s.met).filter(id=>NPCS[id]&&NPCS[id].org&&ORGS[NPCS[id].org]&&ORGS[NPCS[id].org].reg===sel&&!s.dead_npc[id]);
  return `<svg class="map" viewBox="20 0 360 290" role="img" aria-label="중원 지도. 지금 ${cur}">
   ${mu?`<image class="mbg" href="${mu}" x="20" y="0" width="360" height="290" preserveAspectRatio="xMidYMid slice"/>`:'<path class="rv" d="M60 120 C120 95 170 100 200 96 S280 88 350 90"/><path class="rv" d="M90 200 C150 180 200 190 230 186 S300 196 350 200"/>'}
   ${lines.join('')}${nodes}</svg>
  <section class="plate">${(u=>u?`<img class="evimg" src="${u}" alt="${sel}">`:'')(imgURL('reg:'+REG_EN[sel]))}<p class="grp-t">${sel}${sel===cur?' · 지금 여기':adj.includes(sel)?' · 이웃':''}</p><p class="small">${esc(g.d)}</p>
   ${orgs.length?`<p class="small">세력: ${orgs.map(o=>`${ORGS[o].n}<span class="muted">(${ORGS[o].side})</span>`).join(', ')}</p>`:''}
   ${g.mat?`<p class="small muted">특산 재료: ${g.mat} · 이곳에서 광석을 찾으면 자주 나온다.</p>`:''}
   ${ppl.length?`<p class="small">만난 인물: ${ppl.map(id=>`${npcNick(id,s)} ${NPCS[id].n}`).join(', ')}</p>`:''}
   ${canTravel&&adj.includes(sel)?`<button class="go" data-a="travel" data-r="${sel}">${jo(sel,'으로','로')} 떠난다 · 한 해</button>`:sel!==cur&&!adj.includes(sel)?'<p class="muted small">이웃한 곳으로만 떠날 수 있다.</p>':sel!==cur?'<p class="muted small">평범한 해(올해의 나날)에 \'길을 떠난다\'를 고르면 떠날 수 있다.</p>':''}
   <p class="muted small">금색 점은 문파·세력이 있는 곳. 지역마다 일어나는 일이 다르다.</p><div class="row wrap"><button class="ghost" data-a="draw" data-k="map">지도 그림</button><button class="ghost" data-a="draw" data-k="reg:${REG_EN[sel]}">${sel} 그림</button></div></section>`;}
function travel(r){const before=SNAP(S);const from=S.loc;S.loc=r;mapSel=null;let t=`${jo(from,'을','를')} 떠나 ${r}에 닿았다. ${REG[r].d}`;const x=Math.random();
  if(x<.2){A(S,{fame:R(2,5),moral:2});t+=' 길에서 도적에게 쫓기던 행상을 구했다.';}
  else if(x<.35&&REG[r].mat){S.mats[REG[r].mat]=(S.mats[REG[r].mat]||0)+1;t+=` 이 고장 특산인 ${jo(REG[r].mat,'을','를')} 한 덩이 얻었다.`;}
  else if(x<.5){hurt(S,10,'객지의 풍토병');t+=' 물이 맞지 않아 한동안 앓았다.';}
  else if(x<.6){A(S,{gold:R(10,40)});t+=' 품을 팔아 노잣돈을 벌었다.';}
  A(S,{exp:tb(S)*.3,mood:8});view='ev';resetScroll=true;finish(S,'올해의 나날',`${jo(r,'으로','로')} 떠난다`,t,before,false);}
function viewHTML(){return view==='me'?meHTML():view==='map'?mapHTML():view==='world'?worldHTML():view==='log'?logHTML():scrollCard();}
function render(){
  const ae=document.activeElement,fid=ae&&ae.id&&app.contains(ae)?ae.id:null,sel=fid&&'selectionStart' in ae?[ae.selectionStart,ae.selectionEnd]:null;
  const m0=document.getElementById('main'),st=m0?m0.scrollTop:0,sh0=document.querySelector('.sheet'),sst=sh0?sh0.scrollTop:0,mk=modal?modal.t+'|'+(modal.k||'')+'|'+(modal.tab||''):'',sameM=mk&&mk===lastMK;lastMK=mk;
  app.innerHTML=(S.phase==='birth'?`<main class="main" id="main">${birthHTML()}</main>`:S.phase==='end'?`<main class="main" id="main">${endHTML()}</main>`:topHTML()+`<main class="main" id="main">${viewHTML()}</main>`+navHTML())+modalHTML();
  const m1=document.getElementById('main');if(m1)m1.scrollTop=resetScroll?0:st;resetScroll=false;
  const sh1=document.querySelector('.sheet');if(sh1){if(sameM)sh1.scrollTop=sst;else if(modal&&modal.sst!=null){sh1.scrollTop=modal.sst;modal.sst=null;}} // 하위 창에서 돌아오면 목록 스크롤을 되살린다
  if(fid){const el=document.getElementById(fid);if(el){el.focus({preventScroll:true});if(sel)try{el.setSelectionRange(sel[0],sel[1]);}catch(e){}}}}
function closeModal(){modal=modal&&modal.back||null;render();} // 하위 창은 부모 창으로 돌아간다
function readNaiForm(){const c=modal.c;c.key=document.getElementById('n_key').value;c.model=document.getElementById('n_model').value;c.relay=document.getElementById('n_relay').value.trim();c.autoEv=document.getElementById('n_autoEv').checked;c.autoPc=document.getElementById('n_autoPc').checked;c.useRepo=document.getElementById('n_repo').checked;}
function slotTitle(k){const [t,id]=k.split(/:(.+)/);if(t==='st')return `스탠딩 · ${safe(()=>npcNick(id,S))} ${NPCS[id].n}`;return t==='map'?'중원 지도':t==='reg'?`지역 · ${REG_KO[id]||id}`:t==='pc'?`${S.name}의 초상`:t==='npc'?`${safe(()=>npcNick(id,S))} ${NPCS[id].n}`:`장면 · ${safe(()=>evTitle(S,EVM[id]))||id}`;}
app.addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a;
  if(a==='reroll'){S=newFate(document.getElementById('nm').value.trim(),S.sex,{...S.yc,remove:[]});render();}
  else if(a==='yt'){S.yc.t[b.dataset.k]+=+b.dataset.d;S=buildFate(S.base,S.yc);render();}
  else if(a==='yo'){S.yc.origin=S.yc.origin===b.dataset.v?null:b.dataset.v;S=buildFate(S.base,S.yc);render();}
  else if(a==='ytr'){S.yc.trait=S.yc.trait===b.dataset.v?null:b.dataset.v;S=buildFate(S.base,S.yc);render();}
  else if(a==='yrm'){const v=b.dataset.v;S.yc.remove=S.yc.remove.includes(v)?S.yc.remove.filter(x=>x!==v):[...S.yc.remove,v];S=buildFate(S.base,S.yc);render();}
  else if(a==='ygold'){S.yc.gold+=+b.dataset.d;S=buildFate(S.base,S.yc);render();}
  else if(a==='ymem'){S.yc.mem=!S.yc.mem;S=buildFate(S.base,S.yc);render();}
  else if(a==='view'){view=b.dataset.v;resetScroll=true;render();}
  else if(a==='msel'){mapSel=b.dataset.r;render();}
  else if(a==='travel')travel(b.dataset.r);
  else if(a==='rname'){S.base.name=S.name=randName(S.sex);render();}
  else if(a==='sex'){S.base.sex=b.dataset.v;S=buildFate(S.base,S.yc);render();}
  else if(a==='start'){const c=ycCost(S.yc),v=ycPts();if(c>v.pts)return;v.pts-=c;ycSave(v);S.name=document.getElementById('nm').value.trim()||randName(S.sex);view='ev';resetScroll=true;addLog(S,`${ORIGINS.find(o=>o.id===S.origin).n}로 태어났다.`,1);openEvent(S,chooseEvent(S));save();render();if(ncfg().autoPc)autoDraw('pc:'+S.lifeId,pcPrompt(S),true);}
  else if(a==='ch')choose(+b.dataset.i);
  else if(a==='next'){if(S.pendingWpn){const el=document.getElementById('wname');commitWpn(S,el?el.value:'');}if(S.phase==='death'||S.dead)endLife();else if(S.chain){const c=S.chain;S.chain=null;openEvent(S,c);view='ev';resetScroll=true;save();render();}else nextYear();}
  else if(a==='again'){S=newFate(null,null,{...ycNew()});tab='ab';view='ev';resetScroll=true;save();render();}
  else if(a==='tab'){tab=b.dataset.t;render();}
  else if(a==='mainw'){S.mainW=b.dataset.w;save();render();}
  else if(a==='ck'){const c=S.tmp.craft,k=b.dataset.k;c.sel=c.sel.includes(k)?c.sel.filter(x=>x!==k):c.sel.length<3?[...c.sel,k]:c.sel;render();}
  else if(a==='cw'){S.tmp.craft.w=b.dataset.w;render();}
  else if(a==='cback'){S.phase='event';S.tmp.craft=null;render();}
  else if(a==='craft')doCraft();
  else if(a==='fm'){S.tmp.forge.m=b.dataset.m;S.tmp.forge.def=forgeDefault(S,S.tmp.forge);render();}
  else if(a==='fw'){S.tmp.forge.w=b.dataset.w;S.tmp.forge.def=forgeDefault(S,S.tmp.forge);render();}
  else if(a==='fback'){S.phase='event';S.tmp.forge=null;render();}
  else if(a==='forge')doForge();
  else if(a==='wname'){commitWpn(S,document.getElementById('wname').value);S.res.chips.push({t:'병기 얻음',up:true});save();render();}
  else if(a==='equip'){S.wpn={...S.wpns[+b.dataset.i]};save();render();}
  else if(a==='nai'){modal={t:'nai',c:ncfg()};render();}
  else if(a==='nsave'){readNaiForm();const c=ncfg();['key','model','relay','autoEv','autoPc','useRepo'].forEach(x=>c[x]=modal.c[x]);nsave(c);modal=modal.back||null;render();toast('설정을 저장했어요.');}
  else if(a==='draw'){const k=b.dataset.k;modal={t:'draw',k,title:slotTitle(k),prompt:slotPrompt(k),err:''};render();}
  else if(a==='ngen'){modal.prompt=document.getElementById('n_prompt').value;savePr(modal.k,modal.prompt);drawSlot(modal.k,modal.prompt,isPort(modal.k));}
  else if(a==='gal'){modal={t:'gal',tab:'style',back:modal};render();}
  else if(a==='gtab'){modal.tab=b.dataset.v;modal.msg='';modal.sure=0;render();}
  else if(a==='gbatch'){if(!ncfg().key.trim()){modal.msg='한꺼번에 그리려면 설정에 NovelAI 토큰이 필요해요. 토큰 없이 다른 곳에서 그렸다면 \'여러 장 넣기\'를 쓰세요.';render();}
    else if(!modal.sure){modal.sure=1;render();}else{modal.sure=0;runBatch(galKeys(modal.tab).filter(k=>!imgSrc(k)));}}
  else if(a==='gnosure'){modal.sure=0;render();}
  else if(a==='gdev'){modal.dev=!modal.dev;render();}
  else if(a==='gstop'){if(BATCH)BATCH.stop=true;render();}
  else if(a==='ncut'){const m={t:'cut',k:modal.k,tol:40,holes:false,back:modal};modal=m;render();imgGet('raw:'+m.k).then(r=>{m.hasRaw=!!r;cutPreview(m);});}
  else if(a==='capply'){const m=modal;(async()=>{if(!(await imgGet('raw:'+m.k)))await imgPut('raw:'+m.k,m.src);await imgPut(m.k,m.out);setImg(m.k,m.out);if(modal===m)modal=m.back;render();toast('배경을 지웠어요.');})().catch(e=>{m.err=e.message;render();});}
  else if(a==='cundo'){const m=modal;imgGet('raw:'+m.k).then(async r=>{if(!r)return;await imgPut(m.k,r);setImg(m.k,r);if(modal===m)modal=m.back;render();toast('원본으로 되돌렸어요.');});}
  else if(a==='gslot'){const k=b.dataset.k,sh=document.querySelector('.sheet');modal.sst=sh?sh.scrollTop:0;modal={t:'draw',k,title:slotTitle(k),prompt:slotPrompt(k),err:'',back:modal};render();}
  else if(a==='gpreset'){const c=ncfg();c.style=STYLE_PRESETS[+b.dataset.i][1];nsave(c);render();}
  else if(a==='gcopy'){const w=b.dataset.w;copyText(w==='pv'?fullPrompt('st:seorin'):w==='neg'?((ncfg().neg||'').trim()||NAI_NEG):fullPrompt(modal.k,modal.prompt));}
  else if(a==='gexport'){exportPack(modal);}
  else if(a==='nreset'){const c=ncfg();delete c.pr[modal.k];nsave(c);modal.prompt=basePrompt(modal.k);render();}
  else if(a==='nsavefile'){const k=modal.k;imgGet(k).then(bl=>{if(bl)bl.arrayBuffer().then(ab=>{const t=imgType(new Uint8Array(ab));download(bl,fileName(k).replace(/png$/,t==='image/webp'?'webp':t==='image/jpeg'?'jpg':'png'));});});}
  else if(a==='ndel'){const k=modal.k;Promise.all([imgDel(k),imgDel('raw:'+k)]).then(()=>{setImg(k,null);render();});}
  else if(a==='mclose')closeModal();
  else if(a==='mbg'){if(ev.target===b)closeModal();}
  else if(a==='quit'){if(modal&&modal.sure){S=newFate();modal=null;tab='ab';view='ev';resetScroll=true;save();render();}else if(modal){modal.sure=1;render();}}
});
app.addEventListener('input',ev=>{if(ev.target.id==='c_tol'){const v=document.getElementById('c_tolv');if(v)v.textContent=ev.target.value;return;}if(ev.target.id==='nm'&&S.phase==='birth'){S.name=S.base.name=ev.target.value;}if(ev.target.id==='cname'&&S.tmp.craft)S.tmp.craft.name=ev.target.value;if(ev.target.id==='fname'&&S.tmp.forge)S.tmp.forge.name=ev.target.value;if(ev.target.id==='n_prompt'&&modal){modal.prompt=ev.target.value;savePr(modal.k,modal.prompt);const f=document.getElementById('n_full');if(f)f.textContent=fullPrompt(modal.k,modal.prompt);}
  if(modal&&modal.t==='gal'&&/^g_(style|tnpc|tev|tmap|neg|q)$/.test(ev.target.id)){const c=ncfg(),v=id=>document.getElementById(id).value;c.style=v('g_style');c.tnpc=v('g_tnpc');c.tev=v('g_tev');c.tmap=v('g_tmap');c.neg=v('g_neg');c.q=document.getElementById('g_q').checked;nsave(c);const pv=document.getElementById('g_pv');if(pv)pv.textContent=fullPrompt('st:seorin');}if(modal&&modal.t==='nai'&&ev.target.id.startsWith('n_'))readNaiForm();});
app.addEventListener('change',ev=>{if(modal&&modal.t==='gal'){const id=ev.target.id;if(id==='g_miss'){modal.miss=ev.target.checked;render();return;}if(id==='g_webp'){modal.webp=ev.target.checked;return;}if(id==='g_q'){const c=ncfg();c.q=ev.target.checked;nsave(c);render();return;}if(id==='g_files'&&ev.target.files.length){importFiles(modal,[...ev.target.files]);return;}if(id==='g_autocut'){const c=ncfg();c.autoCut=ev.target.checked;nsave(c);return;}}
  if(modal&&modal.t==='cut'){const id=ev.target.id;if(id==='c_tol'){modal.tol=+ev.target.value;cutPreview(modal);return;}if(id==='c_holes'){modal.holes=ev.target.checked;cutPreview(modal);return;}}if(modal&&modal.t==='nai'&&ev.target.id.startsWith('n_'))readNaiForm();if(ev.target.id==='n_file'&&modal&&ev.target.files[0]){const k=modal.k,f=ev.target.files[0];const m=modal;storeSlot(k,f).then(()=>render()).catch(e=>{m.err='그림을 저장하지 못했어요: '+e.message;render();});}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&modal){ev.preventDefault();closeModal();return;}const g=ev.target.closest&&ev.target.closest('.mn');if(g&&(ev.key==='Enter'||ev.key===' ')){ev.preventDefault();mapSel=g.dataset.r;render();}});

function start(data){
  let s=data&&data.S;
  if(!s){try{s=migrate(JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('murim-life-v4')||localStorage.getItem(OLDKEY)||'null'));}catch(e){}}
  S=s||newFate();render();}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
