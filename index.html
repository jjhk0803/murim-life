<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>무림인생</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="강호에 한 번 태어나 한 해씩 선택하며 살아 보는 무협 인생 시뮬레이션.">
<meta name="theme-color" content="#1c2420">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='6' fill='%23a7352b'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='%23f1f4ef' font-family='serif'%3E%E7%94%9F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
/* 한 줄 세로 기둥: 인물 명패 → 올해의 사건 두루마리 → 연대기. 청자빛 한지와 먹, 인주는 도장 한 곳에만. */
:root{
  --paper:#e3e9e2; --card:#f1f4ef; --ink:#1c2420; --ink2:#56625b; --line:#bccac0;
  --jade:#2c6a57; --jade-soft:#d3e3da; --seal:#a7352b; --bad:#9a3b2f; --good:#2c6a57; --gold:#8a6a1f;
  --yin:#3c5e8c; --yang:#b0502c;
  --f-disp:"Song Myung","Nanum Myeongjo","Batang",serif;
  --f-body:"Gowun Batang","Nanum Myeongjo","Batang",serif;
  --f-ui:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111714; --card:#18201c; --ink:#e2e8e1; --ink2:#96a39a; --line:#2d3a33;
  --jade:#74b8a0; --jade-soft:#1f3229; --seal:#d0594c; --bad:#e08273; --good:#74b8a0; --gold:#d6b25c;
  --yin:#87a9dc; --yang:#e48a62; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111714; --card:#18201c; --ink:#e2e8e1; --ink2:#96a39a; --line:#2d3a33;
  --jade:#74b8a0; --jade-soft:#1f3229; --seal:#d0594c; --bad:#e08273; --good:#74b8a0; --gold:#d6b25c;
  --yin:#87a9dc; --yang:#e48a62; color-scheme:dark}
*{box-sizing:border-box}
/* 한 화면: 위 이름표, 가운데 한 장면, 아래 탭. 가운데만 스크롤된다. */
html{height:100%;box-sizing:border-box;padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}
html,body{background:var(--paper);color:var(--ink)}
body{height:100%;margin:0;overflow:hidden;font-family:var(--f-body);font-size:16px;line-height:1.7}
#app{height:100%;max-width:600px;margin:0 auto;display:flex;flex-direction:column}
.top{flex:none;display:flex;gap:10px;align-items:center;padding-block:10px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.top .portrait{width:46px;height:46px}
.tinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.tn{font-family:var(--f-disp);font-size:1.15rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tn .nick{color:var(--jade);font-size:.95rem}
.ts{display:flex;gap:4px 10px;font-family:var(--f-ui);font-size:.78rem;color:var(--ink2);flex-wrap:wrap}
.ts b{color:var(--ink)}
.main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:14px;padding-block:14px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav{flex:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--line);background:var(--card);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav button{background:none;border:0;padding:11px 0 10px;font-family:var(--f-ui);font-size:.84rem;color:var(--ink2);cursor:pointer;position:relative}
.nav button.on{color:var(--jade);font-weight:700;box-shadow:inset 0 2px 0 var(--jade)}
.nav .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--seal);margin-left:3px;vertical-align:top}
.map{flex:none;width:100%;height:auto;aspect-ratio:360/300;display:block;background:var(--card);border:1px solid var(--line);border-radius:10px}
.map .ml{stroke:var(--line);stroke-width:1}
.map .ml.adj{stroke:var(--jade);stroke-width:1.6}
.map .rv{fill:none;stroke:var(--yin);stroke-width:5;opacity:.22;stroke-linecap:round}
.map .mn{cursor:pointer}
.map .mn .c{fill:var(--paper);stroke:none}
.map .mn .ring{fill:none;stroke:var(--ink2);stroke-width:1.3}
.map .mn .ini{font-size:12px;fill:var(--ink2);stroke:none}
.map .mn .mo{fill:var(--gold)}
.map .mn.near .ring{stroke:var(--jade);stroke-width:2.4}
.map .mn.sel .ring{stroke:var(--ink);stroke-width:3}
.map .mn.cur .ring{stroke:var(--seal);stroke-width:3.4}
.map .mn.cur .c{fill:var(--seal)}
.map .mn.cur .ini{fill:var(--card)}
.map text{fill:var(--ink);font-family:var(--f-ui);font-size:10.5px;text-anchor:middle}
.map .mn.cur text{font-weight:700;fill:var(--seal)}
.era{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;font-size:.92rem}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.tl li{display:grid;grid-template-columns:3.4em 1fr;gap:8px}.tl .a{color:var(--ink2);font-family:var(--f-ui);text-align:right;font-variant-numeric:tabular-nums}
.tal.yc3{grid-template-columns:3.2em 1fr auto}
.yb{display:flex;gap:4px}
.plate p{margin:0}
.epi{font-family:var(--f-disp);font-size:1.05rem;line-height:1.6;max-width:26em;margin:4px auto 2px;text-wrap:balance}
.tags{display:inline-flex;gap:4px;margin-left:6px;vertical-align:middle}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.mast{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-disp);font-size:1.35rem;letter-spacing:.06em}
.seal{display:inline-grid;place-items:center;width:30px;height:30px;background:var(--seal);color:var(--card);
  font-family:var(--f-disp);font-size:1.1rem;border-radius:3px;transform:rotate(-4deg);flex:none}
.ghost{background:none;border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-family:var(--f-ui);font-size:.82rem;color:var(--ink2);cursor:pointer}
.ghost:hover{color:var(--ink);border-color:var(--ink2)}
.ghost.on{color:var(--card);background:var(--jade);border-color:var(--jade)}
/* 명패 */
.plate{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.who{display:flex;align-items:baseline;gap:8px 10px;flex-wrap:wrap}
.who .nm{font-family:var(--f-disp);font-size:1.6rem;line-height:1.2}
.who .nick{font-family:var(--f-disp);color:var(--jade);font-size:1.1rem}
.who .age{margin-left:auto;font-family:var(--f-ui);font-variant-numeric:tabular-nums;color:var(--ink2);font-size:.88rem}
.aff{font-family:var(--f-ui);font-size:.85rem;color:var(--ink2);margin-top:-6px}
.aff .grp{color:var(--gold)}
.powrow{display:flex;align-items:center;justify-content:space-between;gap:10px;border-block:1px solid var(--line);padding-block:6px}
.powrow b{font-family:var(--f-ui);font-weight:400;font-size:.75rem;letter-spacing:.12em;color:var(--ink2)}
.powrow .pv{font-family:var(--f-disp);font-size:1.7rem;line-height:1.1;font-variant-numeric:tabular-nums}
.powrow .pk{font-family:var(--f-ui);font-size:.8rem;color:var(--ink2);text-align:right}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 12px}
.st{display:flex;flex-direction:column;min-width:0}
.st b{font-family:var(--f-ui);font-weight:400;font-size:.72rem;letter-spacing:.08em;color:var(--ink2)}
.st span{font-variant-numeric:tabular-nums;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:3px;position:relative}
.bar i{display:block;height:100%;background:var(--jade)}
.bar.hp i{background:var(--seal)}
.bar.dv{overflow:visible}
.bar.dv i{position:absolute;top:0;height:100%}
.bar.dv::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--ink2)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabbody{display:flex;flex-direction:column;gap:12px;font-size:.92rem}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px}
.kv{display:flex;flex-direction:column;min-width:0}
.kv .k{display:flex;justify-content:space-between;gap:6px;font-family:var(--f-ui);font-size:.8rem;color:var(--ink2)}
.kv .k em{font-style:normal;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.grp-t{font-family:var(--f-disp);font-size:1rem;margin:0 0 4px}
.tal{display:grid;grid-template-columns:3.2em 1fr;gap:4px 8px;align-items:center;font-family:var(--f-ui);font-size:.82rem}
.dots{display:flex;gap:3px}.dots i{width:12px;height:6px;border-radius:1px;background:var(--line)}.dots i.on{background:var(--jade)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-ui);font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:1px 9px;color:var(--ink2);background:none}
.chip.t{border-color:var(--jade);color:var(--jade)}
.chip.g{border-color:var(--gold);color:var(--gold)}
button.chip{cursor:pointer;padding:3px 11px}
button.chip.on{background:var(--jade);color:var(--card);border-color:var(--jade)}
.art{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;padding-block:5px;border-bottom:1px dashed var(--line)}
.art:last-child{border-bottom:0}
.art .an{font-weight:700}
.art .am{font-family:var(--f-ui);font-size:.78rem;color:var(--ink2)}
.art.off{opacity:.55}
.ppl{display:flex;flex-direction:column}
.nlink{background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.nlink:hover b{text-decoration:underline}
.chip.unmet{opacity:.55}.chip.dead{text-decoration:line-through}
.npcm{display:flex;gap:12px;align-items:flex-start}
.npcm .ni{width:38%;flex:none;aspect-ratio:2/3;border-radius:8px;overflow:hidden;display:grid;place-items:center;font-family:var(--f-ui);font-size:.8rem;color:var(--ink2)}
.npcm .ni img{width:100%;height:100%;object-fit:cover;object-position:top}
.npcm .nt{display:flex;flex-direction:column;gap:6px;min-width:0}
.pp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding-block:6px;border-bottom:1px dashed var(--line)}
.pp:last-child{border-bottom:0}
.pp .pn b{font-family:var(--f-disp);font-weight:400;color:var(--jade)}
.pp .pr{font-family:var(--f-ui);font-size:.8rem;color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums}
.pp .pd{grid-column:1/-1;font-size:.82rem;color:var(--ink2)}
/* 두루마리 */
.scroll{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--ink);border-radius:2px 2px 10px 10px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px}
.yr{font-family:var(--f-ui);font-size:.78rem;letter-spacing:.14em;color:var(--ink2)}
.scroll h2{font-family:var(--f-disp);font-weight:400;font-size:1.55rem;margin:0;line-height:1.3;text-wrap:balance}
.scroll p{margin:0;white-space:pre-line}
.fade{animation:ink .5s ease-out both}
@keyframes ink{from{opacity:.25;filter:blur(1.5px)}to{opacity:1;filter:none}}
@media (prefers-reduced-motion:reduce){.fade,.scene .sst{animation:none}}
.foe{border:1px solid var(--line);border-left:3px solid var(--seal);border-radius:6px;padding:8px 12px;display:flex;flex-direction:column;gap:2px;font-size:.9rem}
.foe .fn{font-family:var(--f-disp);font-size:1.1rem}
.foe .fn b{font-weight:400;color:var(--seal)}
.foe .fv{font-family:var(--f-ui);font-size:.85rem;color:var(--ink2);font-variant-numeric:tabular-nums}
.foe .fv em{font-style:normal;color:var(--ink);font-size:1rem}
.foe .cue{font-size:.82rem;color:var(--seal)}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.choice{text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 14px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.choice:hover{border-color:var(--jade);background:var(--jade-soft)}
.choice .h{font-size:.8rem;font-family:var(--f-ui);color:var(--ink2)}
.picked{font-family:var(--f-ui);font-size:.85rem;color:var(--jade);border-left:2px solid var(--jade);padding-left:10px}
.delta{display:flex;flex-wrap:wrap;gap:6px}
.delta .chip.up{border-color:var(--good);color:var(--good)}.delta .chip.dn{border-color:var(--bad);color:var(--bad)}
.go{align-self:flex-end;background:var(--ink);color:var(--card);border:0;border-radius:8px;padding:10px 20px;font-family:var(--f-ui);font-size:.95rem;cursor:pointer}
.go:hover{background:var(--jade)}
.go.seal-btn{background:var(--seal)}
.go:disabled{opacity:.4;cursor:not-allowed}
.craft label{display:block;font-family:var(--f-ui);font-size:.78rem;letter-spacing:.1em;color:var(--ink2);margin-bottom:4px}
.craft input{width:100%;font:inherit;font-family:var(--f-disp);font-size:1.25rem;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 12px}
/* 연대기 */
.chron h3,.sec h3{font-family:var(--f-disp);font-weight:400;font-size:1.1rem;margin:0 0 6px}
.chron ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.chron li{display:grid;grid-template-columns:3.4em 1fr;gap:8px;font-size:.9rem;line-height:1.55}
.chron li .a{font-family:var(--f-ui);font-variant-numeric:tabular-nums;color:var(--ink2);text-align:right}
.chron li.k{color:var(--jade)}
/* 탄생 */
.hero{display:flex;flex-direction:column;gap:6px;padding-top:10px}
.hero h1{font-family:var(--f-disp);font-weight:400;font-size:3rem;line-height:1.1;margin:0;letter-spacing:.08em;display:flex;align-items:center;gap:14px}
.hero h1 .seal{width:44px;height:44px;font-size:1.6rem}
.hero p{margin:0;color:var(--ink2)}
.field{display:flex;gap:8px;align-items:stretch}
.field input{flex:1;min-width:0;font:inherit;font-family:var(--f-disp);font-size:1.3rem;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 12px}
.lab{font-family:var(--f-ui);font-size:.78rem;letter-spacing:.1em;color:var(--ink2)}
.fate{display:flex;flex-direction:column;gap:10px}
.fate .og{font-family:var(--f-disp);font-size:1.3rem}
.rowbtn{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;align-items:center}
.hall ol{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:4px;font-size:.9rem}
.hall .m{color:var(--ink2);font-family:var(--f-ui);font-size:.8rem}
/* 묘비 */
.stele{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px 18px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.stele .nick{font-family:var(--f-disp);font-size:1.15rem;color:var(--jade)}
.stele .nm{font-family:var(--f-disp);font-size:2.2rem;line-height:1.2}
.stele .life{font-family:var(--f-ui);color:var(--ink2);font-size:.9rem}
.grade{margin-top:8px;font-family:var(--f-disp);font-size:1.4rem;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.sec{display:flex;flex-direction:column;gap:6px}
.sec ul{margin:0;padding-left:1.2em}
.muted{color:var(--ink2)}
.small{font-size:.85rem}
.head{display:flex;gap:12px;align-items:flex-start}
.head>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.portrait{width:60px;height:60px;border-radius:8px;overflow:hidden;border:1px dashed var(--line);flex:none;padding:0;background:var(--paper);cursor:pointer;display:grid;place-items:center;font-family:var(--f-ui);font-size:.72rem;color:var(--ink2)}
.portrait.has{border-style:solid}
.portrait img{width:100%;height:100%;object-fit:cover;object-position:top}
.pp .thumb{width:44px;height:44px;margin-right:10px;float:left;font-size:.65rem}
.evimg{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:6px;display:block}
.evinp{width:100%;font:inherit;font-family:var(--f-ui);font-size:1rem;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:4px 0 2px}
.scene{position:relative;width:100%;aspect-ratio:3/2;border-radius:6px;overflow:hidden;background:linear-gradient(180deg,var(--paper),var(--line))}
.scene .sbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.9)}
.scene .sst{position:absolute;left:50%;top:6%;height:135%;max-width:none;transform:translateX(-50%);filter:drop-shadow(0 4px 10px rgba(0,0,0,.35));animation:stin .6s ease-out both}
@keyframes stin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translateX(-50%)}}
.scene .snm{position:absolute;left:8px;bottom:8px;background:rgba(20,24,22,.74);color:#f3efe6;font-family:var(--f-ui);font-size:.8rem;padding:2px 10px;border-radius:4px}
/* 대화 연출(미연시): 배경 위에 인물들이 서고, 말하는 사람만 밝다 */
/* 미연시 화면 */
.main:has(> .vnfull){padding:0;overflow:hidden}
.vnfull{position:relative;flex:1;min-height:0;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#4a524d,#1c211f 75%);color:#f3efe6;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.vnfull.done{cursor:default}
.vnfade{animation:vnt .35s ease-out}
.vnbg{position:absolute;inset:0}.vnbg img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .3s}
.vnfull.done .vnbg img{filter:brightness(.7)}
.vnsps{position:absolute;inset:0;pointer-events:none}
.vnsps .vnsp{position:absolute;bottom:0;top:auto;height:82%;max-width:none;transform:translateX(-50%)}
.vnsps .vnsp.on{transform:translateX(-50%) translateY(-1.5%)}
.vntop{position:absolute;left:0;right:0;top:0;z-index:4;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:10px 12px 18px;background:linear-gradient(180deg,rgba(10,12,11,.72),rgba(10,12,11,0))}
.vnttl{display:flex;flex-direction:column;gap:3px;min-width:0;font-family:var(--f-ui);font-size:.9rem;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.vnttl .tags{display:inline-flex;gap:4px}.vnttl .chip{background:rgba(243,239,230,.18);color:#f3efe6;border-color:rgba(243,239,230,.4);font-size:.7rem;padding:1px 8px}.vnsub{font-size:.78rem;opacity:.85}
.vntools{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px;flex:none;max-width:60%}
.vntool{font:inherit;font-family:var(--f-ui);font-size:.75rem;padding:4px 9px;border-radius:14px;border:1px solid rgba(243,239,230,.35);background:rgba(20,24,22,.55);color:#f3efe6;cursor:pointer;white-space:nowrap}
.vntool.on{background:#f3efe6;color:#1c211f}
.vnch{position:absolute;left:12px;right:12px;top:64px;bottom:calc(30% + 20px);z-index:5;overflow-y:auto;display:flex;flex-direction:column;gap:8px;animation:vnt .3s ease-out}
.vnch>:first-child{margin-top:auto}.vnch>:last-child{margin-bottom:auto}
.vnch .choice{width:100%;padding-block:10px}
.vnch .choice{background:rgba(250,247,240,.94);color:#1c211f;box-shadow:0 3px 12px rgba(0,0,0,.35)}

const usable=(S,a)=>{if(has(S,'heaven'))return true;if(has(S,'taeyang')&&a.kw.includes('음'))return false;if(has(S,'taeeum')&&a.kw.includes('양'))return false;
  if(has(S,'seongol')&&a.kw.some(k=>k==='마'||k==='혈'))return false;return !a.yy||has(S,'eumyang')||(S.yy>=a.yy[0]&&S.yy<=a.yy[1]);};
const artsOf=S=>S.arts.map(getArt).filter(Boolean);
function heartArt(S){return S.heart?getArt(S.heart):null;}
function styleOf(S){const h=heartArt(S);if(h&&h.kw.some(k=>k==='마'||k==='혈'))return '마';if(S.org)return ORGS[S.org].st;return S.moral<=-30?'사':'정';}
function kwSet(S){const s=new Set();for(const a of artsOf(S)){if(!usable(S,a))continue;if(a.k==='심'&&a.id!==S.heart)continue;if(a.k==='무'&&a.w!==S.mainW)continue;a.kw.forEach(k=>s.add(k));}if(S.wpn&&S.wpn.kw&&S.wpn.w===S.mainW)s.add(S.wpn.kw);return s;}
function allKw(S){const s=new Set();artsOf(S).forEach(a=>a.kw.forEach(k=>s.add(k)));return s;}
function bestTier(S,w){return artsOf(S).filter(a=>a.k==='무'&&(S.flags.hvPeak||a.w===(w||S.mainW))&&usable(S,a)).reduce((m,a)=>Math.max(m,a.t),0);}
function pow(S){const k=kwSet(S);
  const base=Math.min(S.ng,1000)+(has(S,'gongryeong')?60+S.realm*40:0)+S.sk[S.mainW]*2+bestTier(S)*30+S.qing*1.5+S.t.bone*5+wpVal(S,S.wpn)+20;
  let m=REALMS[S.realm].mult;
  if(k.has('강기')&&S.realm>=4)m*=1.08; if(k.has('마')||k.has('혈'))m*=1.06; if(k.has('중'))m*=1.04;
  if((k.has('음')&&S.yy<=-60)||(k.has('양')&&S.yy>=60))m*=1.08; if(has(S,'heaven'))m*=1.05; if(S.mood<-50)m*=.92;
  if(has(S,'taeyang')&&k.has('양'))m*=1.12; if(has(S,'taeeum')&&k.has('음'))m*=1.12; if(has(S,'eumyang')&&(k.has('음')||k.has('양')))m*=1.08;
  if(has(S,'dokche')&&k.has('독'))m*=1.15; if(has(S,'sinryeok')&&k.has('중'))m*=1.1; if(S.flags.salsin)m*=1.2; if(S.flags.hyeolsin)m*=1.3; if(S.flags.hvPeak)m*=1.1;
  m*=1+(S.salgi||0)/(has(S,'slaughter')&&!S.flags.salTamed?400:600);
  m*=1+harmony(S)*.2;
  m*=hfx(S,'pm')||1;
  return Math.round(base*m+venomPow(S));}
// 음양 조화(0~1): 음과 양을 함께 쓰거나 조화형 심법·음양지체일 때, 음양이 가운데에 가까울수록 크다
function harmony(S){const k=kwSet(S),h=heartArt(S);if(!((k.has('음')&&k.has('양'))||(h&&h.push==='bal')||has(S,'eumyang')))return 0;return Math.max(0,1-Math.abs(S.yy)/50);}

function ngRate(S){const h=heartArt(S);let r=h?h.rate*(usable(S,h)?1:.5):0;if(S.flags.yinCured)r*=2;if(has(S,'gongryeong'))r*=.5;if(has(S,'eumyang'))r*=.85;return r;}

function mkFoe(o){const f=Object.assign({q:1,hide:0,hs:0,kw:[]},o);f.pow=Math.round(FOEBASE[f.realm]*f.q*REALMS[f.realm].mult*(f.id?1:(.95+Math.random()*.1)));return f;}

 soso:{st:[
  {t:'웃음의 까닭',x:'늘 웃던 연 소소가 금정 절벽 끝에 앉아 울고 있었다. 당신을 보자 얼른 눈물을 닦았다. “사부님이 웃으면 복이 온대서 열심히 웃었거든요. 그런데 복은 안 오고 웃음만 늘었네요.”',
   ch:[{t:'옆에 앉아 함께 운다',go:S=>{rel(S,'soso',15);A(S,{mood:-5,cult:2});return '둘이서 구름바다를 보며 울었다. 다 울고 나서 소소가 코를 훌쩍이며 말했다. “이상하다. 같이 우니까 반만 슬퍼요.”';}},
    {t:'우스운 이야기를 해 준다',h:'구력',go:S=>{rel(S,'soso',10+Math.round(S.tongue/10));A(S,{tongue:2});return '소림 땡중이 고기만두를 훔쳐 먹다 들킨 이야기에 소소가 콧물까지 흘리며 웃었다. 이번에는 진짜 웃음이었다.';}},
    {t:'말없이 손수건을 건넨다',go:S=>{rel(S,'soso',11);return '그녀가 손수건에 코를 팽 풀고는 돌려주려다 멈칫했다. “빨아서 줄게요.” 그 손수건은 끝내 돌아오지 않았다.';}}]},
  {t:'삭발하는 날',x:'아미 장문인이 소소를 후계로 정했다. 다음 보름에 머리를 깎는다. 소소가 머리카락 한 줌을 쥐고 말했다. “부처님께 다 드리면 무서운 게 없어진대요. 그런데 나는 아직 무서운 게 하나 남았어요.”',
   ch:[{t:'그대의 길을 가라고 한다',h:'놓아준다',go:S=>{S.flags.sosoNun=1;S.flags.noMarry_soso=1;rel(S,'soso',5);A(S,{cult:6});return '“그 말 할 줄 알았어요.” 소소가 웃었다. 처음 만난 날처럼 환하게. 보름 뒤 금정에서 종이 아홉 번 울렸다.';}},
    {t:'그 무서운 것이 나라면, 머리를 기를 이유가 되겠다',go:S=>{S.flags.sosoStay=1;rel(S,'soso',20);return '소소가 쥐고 있던 머리카락을 바람에 놓았다. “그럼 책임져요. 이 머리 다 자랄 때까지.”';}},
    {t:'어느 쪽이든 기다리겠다고 한다',go:S=>{rel(S,'soso',14);A(S,{cult:3});return '소소는 한참 당신을 보다가 고개를 끄덕였다. “기다려 주는 사람이 있으면, 어느 길이든 덜 외로울 거예요.”';}}]},
  {t:S=>S.flags.sosoNun?'염주 한 줄':'금정의 약속',x:S=>S.flags.sosoNun?'머리를 깎은 소소가 찾아왔다. 법명은 혜연. 웃음은 그대로였다. 그녀가 당신 손에 염주 한 줄을 쥐여 주었다. “매일 당신을 위해 경을 한 권씩 읽어요. 이것도 사랑이라면… 아마 세상에서 제일 오래가는 사랑일 거예요.”':'소소가 아미의 계첩을 돌려주고 산을 내려왔다. 보따리 하나를 메고 당신 앞에 섰다. “부처님께는 다음 생에 다 드리기로 했어요. 이번 생은 조금만 빌려 쓸게요.”',
   ch:S=>S.flags.sosoNun?[{t:'염주를 받는다',go:S=>{rel(S,'soso',5);A(S,{rm:12,cult:8});S.flags.sosoBeads=1;return '그 염주는 평생 당신 손목을 떠나지 않았다. 마기가 들끓는 밤이면 한 알씩 굴렸다. 그때마다 어디선가 경 읽는 소리가 들리는 것 같았다.';}}]
    :[{t:'보따리를 받아 든다',go:S=>{rel(S,'soso',15);return '보따리는 생각보다 가벼웠다. 그녀가 가진 것은 그게 다였다. 그래서 더 무거웠다.';}},
      {t:'정말 후회하지 않겠느냐 묻는다',go:S=>{rel(S,'soso',10);A(S,{cult:2});return '“후회할지도 몰라요.” 소소가 말했다. “그래도 안 해 보고 하는 후회보다, 해 보고 하는 후회가 덜 억울하잖아요.”';}}]}],
  wed:'소소는 혼인하고도 아이처럼 웃는다. 가끔 새벽에 몰래 일어나 불경을 외운다. 다음 생에 갚을 빚이라며. 당신은 모른 척 이불을 덮어 준다.',
  old:'소소의 머리가 하얗게 셌다. “봐요, 결국 다 깎은 거나 마찬가지잖아요.” 그녀가 웃는다. 금정 절벽에서 처음 웃던 그날처럼.',
  fate:S=>S.flags.sosoNun?'아미의 혜연 신니가 고아 백 명을 거두었다는 소식이 들렸다. 사람들이 까닭을 묻자 그녀는 웃으며 말했다고 한다. “옛날에 누가 나랑 같이 울어 줬거든요.”':'연 소소는 강호를 떠도는 여협이 되었다. 가는 곳마다 우는 아이를 웃기고 다닌다고 한다. 그 웃음에는 이제 그늘이 없다.'},
 hwayeon:{st:[
  {t:'부채 뒤의 얼굴',x:'화 연의 금 소리가 객잔을 채우자 사내들의 눈이 풀렸다. 당신만 멀쩡했다. 연주가 끝나자 그녀가 부채 너머로 당신을 보았다. “내 소리에 흔들리지 않는 분은 처음이네요. 그래서 궁금해요. 당신이 들은 건 내 소리인가요, 나인가요.”',
   ch:[{t:'그대를 들었소',go:S=>{rel(S,'hwayeon',15);return '부채가 아주 잠깐 흔들렸다. “거짓말.” 그녀가 말했다. 그런데 그 목소리가 금 소리보다 떨렸다.';}},
    {t:'부채를 내려 보라고 한다',go:S=>{rel(S,'hwayeon',12);return '그녀가 부채를 내렸다. 짙은 화장 아래 얼굴이 생각보다 어렸다. “이 얼굴은 어머니께도 안 보여 드려요.”';}},
    {t:'흔들리는 척해 본다',h:'심계',go:S=>{rel(S,'hwayeon',6);A(S,{mind:3});return '“연기가 서툴러요.” 그녀가 웃었다. 처음 보는, 가면 없는 웃음이었다.';}}]},
  {t:'어머니의 명',x:'한밤에 화 연이 찾아왔다. 소매 속에 비수가 있었다. 손이 떨렸다. “어머니께서 당신을 데려오라 하셨어요. 살아서든 죽어서든. 어머니는 사랑하는 법은 가르쳐 주신 적이 없어요. 죽이는 법만 가르치셨죠. 그런데 이상하죠. 당신 앞에서는 둘 다 모르겠어요.”',
   ch:[{t:'비수를 쥔 손을 감싸 내려놓는다',go:S=>{rel(S,'hwayeon',20);A(S,{moral:5});return '비수가 바닥에 떨어졌다. 그녀가 아이처럼 울었다. 만화궁의 꽃들은 울지 않도록 배운다고 했다.';}},
    {t:'함께 만화궁을 떠나자고 한다',go:S=>{S.flags.hwaRun=1;rel(S,'hwayeon',15);A(S,{enemies:2});return '“꽃은 꺾이면 시든다고 배웠어요.” 그녀가 말했다. “옮겨 심으면 어떻게 되는지는 아무도 안 가르쳐 줬어요. 알아보고 싶어요.”';}},
    {t:'백화마후와 담판을 짓겠다',h:'비무로 겨룬다',go:S=>{const b=battle(S,npcFoe(S,'hwayoung'),{spar:1});S.met.hwayoung=1;if(b.win){S.flags.hwaFree=1;rel(S,'hwayeon',18);}else rel(S,'hwayeon',12);return fightText(b,'백화마후가 부채를 접었다. “내 딸의 소리에 흔들리지 않더니, 내 소리에도 흔들리지 않는구나. 데려가거라. 꽃은 본래 바람이 데려가는 것이다.”','백화마후의 소리에 무릎이 꺾였다. 정신을 차렸을 때 화 연이 당신 앞을 막아서 있었다.');}}]},
  {t:'백화가 지는 날',x:'화 연이 만화궁의 부채를 불에 넣었다. 비단이 타며 꽃 냄새가 났다. “꽃은 지는 걸 두려워하지 않아요. 피어 보지도 못하는 걸 두려워하지.” 그녀가 당신을 돌아보았다. “이제 피어 볼게요.”',
   ch:[{t:'그 손을 잡는다',go:S=>{S.flags.hwaFree=1;rel(S,'hwayeon',15);return '불빛이 그녀 얼굴을 비췄다. 화장하지 않은 얼굴이 처음으로 화사했다.';}},
    {t:'새 부채를 만들어 주겠다고 한다',go:S=>{S.flags.hwaFree=1;rel(S,'hwayeon',12);A(S,{forge:2});return '“이번엔 아무도 홀리지 않는 부채로 해 주세요.” 그녀가 웃었다. “한 사람이면 충분하니까.”';}}]}],
  wed:'화 연은 이제 사람을 홀리려고 금을 타지 않는다. 저녁마다 당신을 위해 한 곡, 마당의 아이들을 위해 한 곡. 미혼음이 아닌데도 듣는 이들이 하나같이 넋을 놓는다.',
  old:'늙은 화 연의 손가락이 굳어 금줄을 자꾸 놓친다. 그래도 그녀는 탄다. 음이 틀릴 때마다 당신이 웃는다. “이제야 내 소리가 들리나 보네요.” 그녀가 말한다.',
  fate:S=>S.flags.hwaFree||S.flags.hwaRun?'화 연이 강남에 작은 서원을 열고 아이들에게 금을 가르친다는 소식이 왔다. 미혼음은 가르치지 않는다고 한다. “소리는 마음을 훔치는 게 아니라 건네는 거란다.” 그것이 첫 가르침이라 했다.':'화 연이 만화궁의 궁주가 되었다. 그녀가 궁주가 된 뒤로 만화궁의 소리에 죽은 사내는 하나도 없다고 한다.'},
 sohye:{st:[
  {t:'장갑',x:'당 소혜는 한여름에도 비단 장갑을 벗지 않았다. “내 손에 닿은 건 다 시들어요. 꽃도, 고양이도. 어릴 때 손을 잡아 주던 유모도요.” 그녀가 장갑 낀 손을 등 뒤로 숨겼다.',
   ch:[{t:'장갑 위로 손을 잡는다',go:S=>{rel(S,'sohye',14);return '그녀가 손을 빼려다 멈췄다. 장갑 너머로도 손이 찼다. “따뜻하네요.” 그녀가 작게 말했다.';}},
    {t:'장갑을 벗기고 맨손을 잡는다',h:'항독 60 이상이거나 독에 강한 몸',if:S=>S.rp>=60||has(S,'manduk')||has(S,'dokche'),go:S=>{rel(S,'sohye',25);S.flags.sohyeTouch=1;return '그녀가 비명을 질렀다. 그런데 당신은 멀쩡했다. 그녀는 한참 당신 손을 내려다보다가, 그 손에 얼굴을 묻고 울었다. 열두 해 만에 맞잡은 맨손이었다.';}},
    {t:'고칠 방법을 찾겠다고 약속한다',go:S=>{rel(S,'sohye',10);S.flags.sohyePromise=1;return '“다들 그렇게 말했어요.” 그녀가 웃었다. “그래도 고마워요. 약속은 지켜지지 않아도, 받는 사람은 따뜻하거든요.”';}}]},
  {t:'독이 심장에 닿다',x:'소혜가 쓰러졌다. 몸 안의 독이 심장 가까이 올라왔다. 당가 장로들은 차라리 그녀를 독인으로 만들어 가문의 무기로 쓰자고 한다. 그녀가 숨을 몰아쉬며 말했다. “가문은 나를 보물이라 불러요. 칼집에 든 칼도 보물이라 부르죠.”',
   ch:[{t:'의술로 독을 뽑아낸다',h:'의술 50 이상',if:S=>S.med>=50,go:S=>{if(chance(.4+S.med/150)){S.flags.sohyeCured=1;rel(S,'sohye',20);deed(S,'당 소혜의 독을 고쳤다');return '아흐레 밤을 은침 하나에 걸었다. 열흘째 아침, 소혜가 창가의 난초를 맨손으로 만졌다. 난초는 시들지 않았다.';}rel(S,'sohye',12);return '독을 반쯤 뽑아냈다. 완전하지는 않았지만, 그녀는 다시 걸을 수 있었다.';}},
    {t:'그 독을 내 몸으로 끌어온다',h:'항독이 낮으면 크게 다친다',go:S=>{hurt(S,Math.round(45*(1-S.rp/120)),'끌어온 독');if(S.rp>=70||has(S,'manduk')||has(S,'dokche'))S.flags.sohyeCured=1;rel(S,'sohye',20);return '그녀의 독을 손바닥으로 받아 내 몸으로 끌어왔다. 혈관이 검게 물들었다. 정신이 들었을 때 그녀가 당신 손을 쥐고 있었다. 장갑 없이.';}},
    {t:'장로들 앞을 막아선다',go:S=>{rel(S,'sohye',12);A(S,{enemies:1,fame:5});return '“이 사람은 칼이 아니라 사람이오.” 장로들이 독침을 꺼냈지만 아무도 쏘지 못했다. 독을 다루는 자일수록, 숨김없는 말 앞에서 손이 굳는다.';}}]},
  {t:'맨손',x:'소혜가 들판에 서서 장갑을 벗었다. 들꽃 한 송이를 꺾어 오래 쥐고 있었다. 꽃은 시들지 않았다. 아니, 시들었더라도 그녀는 웃고 있었다.',
   ch:[{t:'그 꽃을 받는다',go:S=>{rel(S,'sohye',15);return '“처음이에요.” 그녀가 말했다. “무언가를 쥐고도 잃지 않은 게.”';}}]}],
  wed:'당가식 신혼은 조금 별나다. 아침상의 어느 그릇에 독이 들었는지 맞히는 내기를 한다. 소혜는 매일 진다. 일부러 지는 것 같다.',
  old:'늙은 소혜가 장갑 없이 손주들의 머리를 쓰다듬는다. 아이들은 할머니 손이 왜 이렇게 따뜻하냐고 묻는다. 그녀가 당신을 쳐다본다.',
  fate:S=>S.flags.sohyeCured?'당 소혜가 당가 의각의 주인이 되었다. 독을 다루던 손으로 이제는 해독제를 만든다. 사천에서 독에 죽는 이가 해마다 줄고 있다.':'독봉 당 소혜는 여전히 장갑을 낀다. 하지만 이제 그 장갑으로 아이들 머리를 쓰다듬는다고 한다. 당가 사람들이 그 모습을 처음 보고 놀랐다고 한다.'},
 hyun:{st:[
  {t:'옥룡의 밤',x:'달밤에 남궁 현이 혼자 검을 휘두르고 있었다. 손바닥이 터져 피가 손잡이를 적셨다. “사람들은 내가 타고났다고 하오. 내가 타고난 건 이 굳은살뿐이오. 남궁의 장자는 지면 안 되니까.”',
   ch:[{t:'손을 싸매 준다',go:S=>{rel(S,'hyun',14);A(S,{med:1});return '“하찮은 상처요.” 그가 말했지만 손을 빼지 않았다.';}},
    {t:'곁에서 함께 휘두른다',go:S=>{rel(S,'hyun',12);A(S,{exp:tb(S)*.3});return '새벽까지 나란히 검을 휘둘렀다. 그가 처음으로 웃었다. “혼자가 아니니 덜 무겁군.”';}},
    {t:'져도 된다고 말해 준다',go:S=>{rel(S,'hyun',16);A(S,{tongue:2});return '그가 오래 당신을 보았다. “그 말을 해 준 사람이 없었소. 아버지도, 나 자신도.”';}}]},
  {t:'가주의 무게',x:'검왕이 병석에 누웠다. 원로들이 남궁 현에게 가주 자리와 함께 정략혼을 내밀었다. 그가 당신에게 물었다. “가문을 지키는 것과 나를 지키는 것. 하나만 고르라면, 당신이라면 무엇을 고르겠소.”',
   ch:[{t:'둘 다 지킬 길을 찾자',h:'구력·처세',go:S=>{if(S.tongue+S.savvy+R(0,40)>=70){S.flags.hyunFree=1;rel(S,'hyun',20);return '원로 회의에서 당신이 남궁세가의 빚을 갚을 길을 내놓았다. 정략혼은 없던 일이 되었다. 회의장을 나서며 남궁 현이 처음으로 소리 내어 웃었다.';}rel(S,'hyun',10);return '원로들은 당신 말을 듣지 않았다. 그래도 그가 말했다. “같이 싸워 준 것만으로 됐소.”';}},
    {t:'가주가 되시오. 나는 기다리겠소',go:S=>{rel(S,'hyun',12);A(S,{cult:3});return '“기다린다는 말이 이렇게 무거운 줄 몰랐소.” 그가 말했다. “그러니 반드시 돌아오겠소.”';}}]},
  {t:'깨진 옥',x:'가주가 된 남궁 현이 첫 싸움에서 크게 졌다. 사람들은 옥룡에 금이 갔다고 수군댄다. 그가 당신 앞에서 처음으로 고개를 숙였다. “깨진 옥도 옥이오?”',
   ch:[{t:'깨진 틈으로 빛이 드는 법이오',go:S=>{S.flags.hyunFree=1;rel(S,'hyun',18);return '그가 한참 웃었다. 그러다 울었다. 완벽한 옥룡이 아니라 한 사람이 거기 있었다.';}}]}],
  wed:'남궁 현은 가주의 일이 아무리 늦게 끝나도 꼭 당신과 저녁을 먹는다. “천하에서 내가 지지 않아도 되는 유일한 자리요.” 그가 말한다.',
  old:'백발의 남궁 현이 손주에게 검을 가르친다. “지는 것도 배워야 한다.” 그러고는 당신을 보며 웃는다. “누가 가르쳐 준 거요.”',
  fate:S=>S.flags.hyunFree?'남궁 현이 가주가 된 뒤로 남궁세가가 서자와 방계를 차별 없이 받기 시작했다. 사람들은 옥룡이 둥글어졌다고 한다.':'남궁 현은 정략혼을 했다. 그래도 당신이 그의 손을 싸매 준 날이 돌아오면, 그는 혼자 달밤에 검을 든다고 한다.'},
 cheongun:{st:[
  {t:'신룡의 오만',x:'매 청운이 술잔을 내밀었다. “너 정도면 내 상대로 나쁘지 않아. 칭찬이다.” 싸가지 없는 말투인데 귀끝이 빨갰다.',
   ch:[{t:'칭찬 고맙다고 받아친다',h:'구력',go:S=>{rel(S,'cheongun',12);return '“…뭐야, 화를 내야지.” 그가 당황했다. 그 모습이 의외로 우스웠다.';}},
    {t:'잔을 받아 단숨에 비운다',go:S=>{rel(S,'cheongun',14);return '“좋아, 그 기세.” 그가 한 잔 더 따랐다. 밤새 마셨다. 다음 날 둘 다 비무에 늦었다.';}}]},
  {t:'검성의 그림자',x:'매 청운이 화산 정상에서 혼자 나뭇가지를 꺾고 있었다. “화산 백 년 만의 기재래. 그 백 년 전에 누가 있었는지 알아? 검성 독고 무야. 나는 평생 그 사람 그림자 밑에서 비교만 당할 거야.”',
   ch:[{t:'그림자는 빛이 있어야 생긴다',go:S=>{rel(S,'cheongun',16);return '그가 가지를 꺾던 손을 멈췄다. “…그런 말은 어디서 배웠어?” “방금 지었소.” 그가 웃음을 터뜨렸다.';}},
    {t:'함께 검성의 바위를 보러 간다',go:S=>{rel(S,'cheongun',12);A(S,{mu:5});return '검성이 새겼다는 바위의 초식을 둘이서 밤새 따라 했다. 둘 다 반도 따라 하지 못했다. 그게 오히려 위안이 됐다.';}}]},
  {t:'남은 손',x:S=>S.flags.cwFate==='saved'?'외팔이 된 매 청운이 왼손으로 당신 손을 잡았다. “오른손은 검한테 줬어. 남은 하나는… 너한테 줄게. 싫으면 말고.”':'매 청운이 처음으로 진지한 얼굴을 했다. “신룡이니 뭐니, 다 남들이 붙인 이름이야. 너한테는 그냥 청운이고 싶어.”',
   ch:[{t:'그 손을 잡는다',go:S=>{rel(S,'cheongun',18);return '“…싫다고 할 줄 알았는데.” 그가 고개를 돌렸다. 귀끝이 또 빨갰다.';}}]}],
  wed:'매 청운은 혼인하고도 여전히 싸가지가 없다. 다만 그 싸가지가 당신 앞에서만 조금 순해진다. 화산 제자들이 그 모습을 보고 기겁한다.',
  old:'늙은 매 청운이 제자들에게 자랑한다. “너희 사모는 나를 한 번도 이긴 적이 없다.” 당신이 헛기침을 한다. 그가 슬그머니 말을 바꾼다. “…거의 없다.”',
  fate:S=>'매 청운이 화산 장문인이 되어 제자들에게 이렇게 가르친다고 한다. “남과 비교하지 마라. 견줄 상대는 어제의 너 하나다.” 다들 그가 한 말 같지 않다고 수군댄다.'},
 jegalun:{st:[

    {t:'점쟁이를 찾아가 따지겠다',go:S=>{rel(S,'jegalun',12);return '“점쟁이는 이미 죽었어요. 자기 운명은 못 봤나 봐요.” 그가 웃었다. 처음으로 기침 없이.';}},

  {t:'각혈',x:'제갈 운이 피를 토했다. 정천신산 제갈 휘가 조카의 손을 잡고 아무 말도 하지 못했다. 천하의 수를 다 읽는다는 사람이었다. 제갈 운이 당신에게 속삭였다. “숙부도 못 읽는 수가 있네요. 그게 좀 우스워요.”',

    {t:'의술로 맥을 다스린다',h:'의술 40 이상',if:S=>S.med>=40,go:S=>{if(chance(.45+S.med/150))S.flags.unCured=1;rel(S,'jegalun',18);return '침을 놓고 밤새 맥을 짚었다. 새벽녘 그의 숨이 고르게 가라앉았다.';}},
    {t:'남은 날을 같이 보내자고 한다',go:S=>{rel(S,'jegalun',16);A(S,{cult:4});return '그날부터 그가 쓰는 시마다 당신이 나왔다. 서른이 넘도록.';}}]},
  {t:'시의 끝',x:'서른 번째 생일. 제갈 운이 반쯤 쓴 시들을 모두 펼쳤다. “점쟁이가 틀렸어요. 아니면 당신이 운명을 틀리게 만들었거나.” 그가 붓을 내밀었다. “끝을 같이 써요.”',
   ch:[{t:'붓을 함께 쥔다',go:S=>{rel(S,'jegalun',15);A(S,{lore:5});return '마지막 행은 두 사람 글씨가 섞여 삐뚤빼뚤했다. 그래서 더 좋았다.';}}]}],
  wed:'제갈 운은 여전히 기침을 한다. 하지만 이제 시의 끝을 쓴다. 집 벽마다 완성된 시가 붙어 있다. 대부분 당신 이야기다. 손님이 오면 좀 민망하다.',
  old:'제갈 운이 일흔을 넘겼다. “점쟁이가 들으면 기절하겠군요.” 그가 웃는다. 서른을 못 넘긴다던 사내가 손주의 손주를 안고 있다.',
  fate:S=>'제갈 운의 시집이 강남에서 널리 읽힌다는 소식이 들렸다. 첫 장에는 이렇게 적혀 있다고 한다. “끝을 쓰게 해 준 이에게.”'},
 mugyeol:{st:[
  {t:'침묵',x:'당 무결은 하루에 열 마디도 하지 않는다. 사흘을 함께 걸었는데 그가 한 말은 “비 온다” 하나였다. 그리고 정말 비가 왔다.',
   ch:[{t:'말없이 함께 걷는다',go:S=>{rel(S,'mugyeol',14);A(S,{cult:3});return '말없이 걷는 것이 이렇게 편할 줄 몰랐다. 나흘째, 그가 당신에게 우산을 씌워 주었다. 역시 말없이.';}},
    {t:'쉬지 않고 말을 건다',h:'구력',go:S=>{rel(S,'mugyeol',10);A(S,{tongue:2});return '그가 결국 웃었다. 소리 없이, 입꼬리만. 그게 그의 최대치라는 건 나중에 알았다.';}},
    {t:'그의 독술을 배우고 싶다고 청한다',go:S=>{rel(S,'mugyeol',12);A(S,{rp:5,med:3});return '그는 대답 대신 독초 하나를 건넸다. 다음 날 또 하나. 그렇게 백 가지를 배웠다.';}}]},
  {t:'누명',x:'당가의 셋째 공자가 독살되었다. 모두가 당 무결을 의심한다. 그는 변명하지 않았다. “변명은 의심하는 자를 위한 것이다. 나는 그들을 위해 입을 열 생각이 없다.”',
   ch:[{t:'진범을 찾는다',h:'심계',go:S=>{if(S.mind+R(0,40)>=55){S.flags.mugyeolClear=1;rel(S,'mugyeol',20);A(S,{fame:10});return '독의 흔적을 거꾸로 밟아 진범을 찾았다. 둘째 공자였다. 당 무결은 끝내 형의 일을 누구에게도 말하지 않았다. 당신에게만 한마디 했다. “고맙다.”';}rel(S,'mugyeol',10);return '진범을 찾지 못했다. 그래도 그가 말했다. “믿어 주는 사람이 하나면, 나머지는 상관없다.”';}},
    {t:'그의 곁에 선다',go:S=>{rel(S,'mugyeol',15);A(S,{enemies:1});return '당가 사람들이 당신까지 의심했다. 당 무결이 처음으로 길게 말했다. “나를 의심하는 건 상관없다. 이 사람은 건드리지 마라.”';}}]},
  {t:'아껴 둔 말',x:'당 무결이 당신을 사천의 대숲으로 데려갔다. 한참 말이 없다가 입을 열었다. “나는 말을 아낀다. 아껴 둔 말이 하나 있어서다.”',

  wed:'당 무결은 여전히 말이 없다. 대신 매일 아침 탁자에 해독제를 하나씩 놓아 둔다. 당가식 “잘 다녀오시오”다.',
  old:'늙은 당 무결이 손주에게 처음으로 긴 이야기를 해 주었다. 당신을 처음 만난 날의 이야기였다. 손주가 물었다. “할아버지도 말을 길게 할 줄 알아요?” 그가 당신을 보며 웃었다.',
  fate:S=>'당 무결이 당가의 가주가 되었다. 사람들은 그를 침묵의 가주라 부른다. 그런데 회의 때마다 꼭 한마디는 한다고 한다. “독은 숨겨도 마음은 숨기지 마라.” 당가의 새 가훈이 되었다.'},
 ha:{st:[],
  wed:'천마의 자식과 혼인했다고 강호가 수군댔다. 혁련 하는 신경 쓰지 않았다. “아버지는 천하를 원했지. 나는 아침밥을 같이 먹을 사람이 필요했고.” 천마의 자식이 바란 것은 그게 전부였다.',

  fate:S=>S.flags.haTurn==='ally'?'혁련 하가 마교의 새 교주가 되어 백 년 만에 중원과 화친을 맺었다는 소식이 왔다. 화친 문서 끝에 그가 적었다고 한다. “어떤 이에게 진 빚을 갚는다.”':'혁련 하는 서역 너머로 떠났다고 한다. 떠나기 전 객잔에 술 한 병을 맡겨 두었다. “언젠가 그 사람이 오면 주게. 적이든 아니든.”'},
 plain:{st:[],

   o:[['국수를 사 드린다',S=>{TK(S,'geolwang',8);A(S,{gold:-2});return '노인은 국수를 세 그릇 비웠다. “배부르니 얘기해 주마.”';}],['술도 한 병 사 드린다',S=>{TK(S,'geolwang',12);A(S,{gold:-5});return '“허, 이놈 봐라. 사람 볼 줄 아는구나.” 노인 눈이 번쩍 떠졌다.';}],['거지에게 줄 돈은 없다',S=>{TK(S,'geolwang',-3);return '노인이 껄껄 웃었다. “그래, 그것도 정직이지.” 그러고는 다시 졸았다. 그런데 이야기는 해 주었다.';}]],
   n:{l:'“강호에서 제일 무서운 게 뭔지 아나? 칼? 독? 아니야. 배고픔이야. 배고픈 놈은 뭐든 하거든. 그래서 개방은 밥을 나눠. 밥을 나누면 칼 뽑을 놈이 하나 줄지.”',
    o:[['그래서 거지들이 강한 겁니까',S=>{A(S,{cult:2});return '“강하냐고? 우린 잃을 게 없어서 안 무서운 거야. 그게 강한 거라면 강한 거지.”';}],['저도 밥을 나누며 살겠습니다',S=>{TK(S,'geolwang',8);A(S,{moral:4});return '노인이 대나무 막대기로 당신 어깨를 툭 쳤다. “그 말 잊지 마라. 잊으면 내가 와서 때릴 테다.”';}],['배부른 놈은 어떻습니까',S=>{A(S,{tongue:2});return '“배부른 놈은 게을러지지. 그래서 난 늘 반만 먹는다.” 국수 세 그릇을 먹은 노인이 진지하게 말했다.';}]]}},
  {min:20,x:'달밤, 지붕 위에서 걸왕이 술을 마시고 있다. 당신을 보고 호리병을 흔든다.',l:'“올라와라. …내 사부는 굶어 죽었다. 천하제일 개방 방주가 말이야. 마지막 만두를 길가 아이한테 줬거든.”',
   o:[['어리석은 죽음입니다',S=>{TK(S,'geolwang',-3);return '“그래, 어리석었지.” 걸왕이 오래 달을 보았다. “그런데 그 아이가 지금 개방 방주야. 바로 나.”';}],['훌륭한 분이셨군요',S=>{TK(S,'geolwang',8);A(S,{cult:3});return '“훌륭? 배고픈 게 뭔지 끝까지 잊지 않았을 뿐이야.” 걸왕이 술병을 내밀었다.';}],['말없이 잔을 받는다',S=>{TK(S,'geolwang',10);A(S,{exp:tb(S)*.5});return '둘은 말없이 마셨다. 새벽에 걸왕이 일어나며 말했다. “타견봉 한 수 보여 주마. 눈 크게 떠라.” 막대기 끝이 새벽 공기를 아홉 번 갈랐다.';}]]}],
 geomseon:[{min:-99,x:'구름 낀 산정, 흰 수염의 도인이 나뭇가지로 허공을 긋고 있다. 가지가 지나간 자리마다 구름이 갈라진다.',l:'“검을 무엇으로 쥐느냐?”',
   o:[['손으로 쥡니다',S=>{TK(S,'geomseon',3);return '“손은 놓으면 그만이지.” 도인이 웃었다.';}],['마음으로 쥡니다',S=>{TK(S,'geomseon',8);A(S,{cult:3});return '“마음은 흔들리지.” 도인이 가지를 내려놓았다. “그래도 손보다는 낫다.”';}],['쥐지 않습니다',S=>{if(S.t.wit>=6){TK(S,'geomseon',12);A(S,{exp:tb(S)*.6});return '도인의 눈이 처음으로 당신에게 머물렀다. “…그 말을 할 줄 아는 아이는 백 년에 하나다.”';}TK(S,'geomseon',2);return '“말만 앞서는구나. 그래도 방향은 맞다.”';}]],
   n:{l:'“사람들이 나를 검선이라 부르더구나. 나는 검을 버리고서야 신선 소리를 들었다. 검을 쥐고 있는 동안은 검이 나를 쥐고 있었지.”',
    o:[['저도 검을 버려야 합니까',S=>{A(S,{cult:3});return '“아직은 쥐어라. 버릴 것이 있어야 버릴 수 있다.”';}],['검이 없으면 지킬 수 없습니다',S=>{A(S,{moral:2});TK(S,'geomseon',4);return '“그래. 그래서 너는 아직 사람이다. 사람으로 사는 것도 나쁘지 않다.”';}],['신선이 되면 무엇이 좋습니까',S=>{A(S,{mood:6});return '도인이 한참 웃었다. “좋은 게 없어서 좋다.”';}]]}},
  {min:20,x:'검선이 바둑판 앞에서 돌 하나를 쥐고 멈춰 있다. 사흘째라고 한다.',l:'“이 돌을 어디 두어야 할지 모르겠다. 너라면 어디 두겠느냐?”',
   o:[['가장 중요한 곳에',S=>{TK(S,'geomseon',3);return '“중요한 곳은 늘 상대도 안다.”';}],['아무 데나',S=>{TK(S,'geomseon',10);A(S,{cult:5});if(S.cult>=70&&!S.flags.seondo){S.flags.seondo=1;deed(S,'검선의 바둑판 앞에서 선도에 눈떴다');return '검선이 돌을 아무 데나 놓았다. 판이 살아났다. 그 순간 당신 안에서도 무언가가 놓였다. 선도(仙道)에 눈떴다.';}return '검선이 돌을 아무 데나 놓았다. 판이 살아났다. “…그렇구나. 사흘을 헛되이 쥐고 있었다.”';}],['두지 않습니다',S=>{TK(S,'geomseon',6);return '“두지 않는 것도 수다. 그런데 그러면 판이 끝나지 않지.” 검선이 웃었다.';}]]}],
 buljon:[{min:-99,x:'숭산 아래 찻집, 흰 눈썹의 노승이 찻잔을 들고 있다.',l:'“시주의 얼굴에 칼 그림자가 있구려. 누굴 베었소, 아니면 베고 싶소?”',
   o:[['벤 적이 있습니다',S=>{TK(S,'buljon',6);A(S,{cult:2});return S.moral<0?'“그 무게를 아는 얼굴이오. 다행이오.”':'“그래도 얼굴이 맑구려. 벤 것이 아니라 막은 것이겠지.”';}],['베고 싶은 자가 있습니다',S=>{TK(S,'buljon',5);A(S,{temper:-3});return '“그자를 벤 뒤의 시주 얼굴을 떠올려 보시오. 그 얼굴이 마음에 들면 가시오.” 노승이 차를 따랐다.';}],['그런 것 없습니다',S=>{TK(S,'buljon',3);return '“없으면 다행이고, 모르는 것이면 위험하오.”';}]],
   n:{l:'“소림에 이런 말이 있소. 방하착(放下着). 내려놓으라. 그런데 내려놓으려면 먼저 들고 있다는 걸 알아야 하오.”',
    o:[['저는 무엇을 들고 있습니까',S=>{A(S,{cult:4});return '“그건 시주만 알지. 다만 무거우면 그게 답이오.”';}],['내려놓으면 무엇이 남습니까',S=>{A(S,{moral:3});TK(S,'buljon',5);return '“빈손. 빈손이라야 다른 손을 잡을 수 있소.”';}],['저는 아직 들고 싶습니다',S=>{TK(S,'buljon',4);return '노승이 웃었다. “솔직하구려. 들고 가시오. 무거워지면 소림에 오시오.”';}]]}},
  {min:20,x:'불존이 탁발을 나왔다. 빈 바리때를 든 채 당신 앞에 섰다.',l:'“시주, 이 노승에게 공양할 것이 있소? 쌀이 아니어도 좋소.”',
   o:[['쌀과 은자를 드린다',S=>{A(S,{gold:-Math.min(S.gold,20),moral:3});TK(S,'buljon',5);return '“고맙소. 이것은 굶는 이들에게 가겠지.”';}],['제 이야기를 드립니다',S=>{TK(S,'buljon',10);A(S,{mood:12});return '반나절 동안 이야기했다. 노승은 한 마디도 끊지 않았다. 마지막에 합장했다. “좋은 공양이었소.”';}],['반야장 한 수를 청합니다',S=>{TK(S,'buljon',3);const r=learn(S,'shaolin_1');return '“공양을 받기도 전에 달라는구려.” 노승이 웃으며 손바닥을 폈다. 한 번 보여 준 것이 전부였다. '+(r||'이미 아는 초식이었지만, 다른 것이 보였다.');}]]}],
 muhwang:[{min:-99,x:'산길에서 집채만 한 사내가 쓰러진 소달구지를 한 손으로 세우고 있다.',l:'“거기, 구경만 할 거냐? 바퀴 좀 끼워라.”',
   o:[['바퀴를 끼운다',S=>{TK(S,'muhwang',8);return '“손이 빠르구나.” 사내가 웃었다. 웃음소리에 나뭇잎이 떨렸다.';}],['혹시 무황이십니까',S=>{TK(S,'muhwang',4);return '“무황? 남들이 그렇게 부르더라. 나는 곽가다. 바퀴나 끼워.”';}],['팔씨름을 청한다',S=>{TK(S,'muhwang',S.t.bone>=6?12:6);return S.t.bone>=6?'열을 세기도 전에 졌다. 그런데 사내가 놀란 얼굴을 했다. “셋까지 버틴 놈은 오랜만이다.”':'하나에 졌다. 사내가 웃으며 당신 팔을 주물러 주었다. “뼈는 좋다. 살을 붙여라.”';}]],
   n:{l:'“강해지는 법? 간단하다. 매일 하는 것. 남들이 쉴 때 하는 것. 그리고 질 때까지 하는 것. 이기기만 하는 놈은 늘지 않아.”',
    o:[['당신도 진 적이 있습니까',S=>{A(S,{mood:6});TK(S,'muhwang',5);return '“수천 번. 마지막으로 진 건 열여섯 살 때 황소한테.” 무황은 진지했다.';}],['내일부터 매일 하겠습니다',S=>{A(S,{exp:tb(S)*.6});TK(S,'muhwang',6);return '“말로 하지 말고 내일 새벽에 와라.” 이튿날 새벽, 무황은 정말로 기다리고 있었다. 해가 질 때까지 바위를 날랐다.';}],['재능이 없으면요',S=>{A(S,{cult:2});return '“재능? 나는 황소한테 졌다니까.” 무황이 당신 등을 쳤다. 숨이 막혔다.';}]]}},
  {min:20,x:'무황이 객잔 구석에서 혼자 국수를 먹다 당신을 불렀다.',l:'“천하제일인 자리에 관심 있나? 난 없다. 그 자리에 앉으면 더는 질 수가 없거든. 지지 않으면 늘지 않는다.”',
   o:[['그래서 화산논검에 안 나가셨군요',S=>{TK(S,'muhwang',5);A(S,{lore:2});return '“나갔지. 일부러 졌다.” 무황이 국수 국물을 마셨다. “농담이다. 아마도.”';}],['저는 그 자리에 앉고 싶습니다',S=>{TK(S,'muhwang',4);A(S,{fame:3});return '“그럼 앉아라. 그리고 거기서 내려올 줄도 알아라.”';}],['지지 않는 것도 강함 아닙니까',S=>{A(S,{cult:3});return '“그건 겁이다.” 무황이 국수 국물을 다 마셨다.';}]]}],
 gumwang:[{min:-99,x:'남궁세가 연무장. 검왕이 홀로 검을 닦고 있다. 눈빛만으로 공기가 무겁다.',l:'“남궁의 땅에 무슨 일로 왔느냐.”',
   o:[['검을 보러 왔습니다',S=>{TK(S,'gumwang',5);return '“검은 보는 것이 아니라 받는 것이다.” 검왕이 검을 거두었다. 살짝 웃은 것 같기도 했다.';}],['지나가던 길입니다',S=>'“지나는 길에 남궁을 밟았으면 기억해라. 남궁은 잊지 않는다.”'],['당신과 겨루러 왔습니다',S=>{if(S.realm>=4){TK(S,'gumwang',10);return '“…좋다. 언젠가.” 검왕이 처음으로 당신을 사람으로 보았다.';}TK(S,'gumwang',-2);return '“아직 네 검이 울지 않는구나. 울면 다시 와라.”';}]],
   n:{l:'“천하제일검이라 부르더구나. 그 이름을 얻으려고 버린 것이 많다. 아내의 마지막을 보지 못했다. 그날 나는 비무를 하고 있었다.”',
    o:[['후회하십니까',S=>{A(S,{cult:3});TK(S,'gumwang',5);return '“…검에게 물어보아라. 검은 대답하지 않는다. 그래서 검을 쥐는 거다.”';}],['그래도 천하제일검이 되셨습니다',S=>{TK(S,'gumwang',2);return '“그래서 무엇이 되었지?” 검왕이 검을 칼집에 넣었다. 소리가 오래 울렸다.';}],['따님에게는 그러지 마십시오',S=>{TK(S,'gumwang',S.met.seorin?10:4);if(S.met.seorin)TK(S,'seorin',5);return '검왕의 손이 멈췄다. 오래. “…주제넘구나.” 그러나 화내지 않았다.';}]]}},
  {min:25,x:'검왕이 매화나무 아래 서 있다. 꽃잎이 그의 검 위에 내려앉는다.',l:'“검을 들고 꽃을 베지 않는 법을 아느냐. 나는 아직 모른다.”',
   o:[['검을 내려놓으면 됩니다',S=>{TK(S,'gumwang',3);return '“그건 검객의 답이 아니다.”';}],['꽃이 검 위에 앉게 두면 됩니다',S=>{TK(S,'gumwang',10);A(S,{cult:4});return '“…앉게 둔다.” 검왕이 검을 그대로 든 채 서 있었다. 꽃잎이 날 위에 쌓였다.';}],['검끝으로 꽃잎을 받아 보인다',S=>{TK(S,'gumwang',8);A(S,{exp:tb(S)*.5});SK(S,S.mainW,3);return '검끝으로 꽃잎 하나를 받았다. 꽃잎은 갈라지지 않았다. 검왕이 고개를 끄덕였다. “남궁의 검에 그런 초식은 없다. 네 것이다.”';}]]}],
 geomma:[{min:-99,x:'비 오는 다리 위, 검은 옷의 사내가 붉은 검을 빗물에 씻고 있다. 피가 빗물에 섞여 흘러간다.',l:'“정파냐, 사파냐. 대답에 따라 베겠다.”',
   o:[['둘 다 아니다. 사람이다',S=>{TK(S,'geomma',6);return '사내가 웃었다. 처음 웃어 보는 사람처럼 서툰 웃음이었다.';}],['정파다',S=>'“그래서?” 사내가 검을 들었다가 내렸다. “오늘은 비가 와서 안 벤다.”'],['너를 베러 왔다',S=>{TK(S,'geomma',5);A(S,{mind:3});return '“좋다.” 사내의 살기가 다리를 덮었다. 그러다 거뒀다. “아직 너는 내 칼맛을 모를 거다. 더 자라서 와라.”';}]],
   n:{l:'“사람들은 나를 검마라 부르지. 나는 검에 미쳤을 뿐이다. 정파 놈이 검에 미치면 검성이라 부르고, 내가 미치면 검마라 부른다. 차이가 뭘까.”',
    o:[['누구를 베었느냐의 차이다',S=>{A(S,{moral:2});TK(S,'geomma',3);return '“…그래. 나는 가리지 않고 벴지.” 검마가 빗속으로 사라졌다.';}],['차이 없다',S=>{A(S,{moral:-3});TK(S,'geomma',8);return '“좋은 답이다. 그러니 너도 언젠가 마가 될 수 있다.” 검마가 웃었다.';}],['검을 내려놓을 줄 아느냐의 차이다',S=>{A(S,{cult:4});TK(S,'geomma',6);return '검마가 오래 당신을 보았다. 그리고 검을 칼집에 넣었다. 그것이 대답이었다.';}]]}},
  {min:20,x:'검마가 이름 없는 무덤 앞에 서 있다.',l:'“내 사부다. 내 손으로 베고 묻었다. 사부가 원했다. 제자에게 지고 죽는 게 검객의 복이라고.”',
   o:[['슬펐습니까',S=>{TK(S,'geomma',8);return '“슬펐다면 지금 여기 없겠지.” 검마가 술을 무덤에 부었다. 손이 떨렸다.';}],['미친 사부군요',S=>{TK(S,'geomma',-5);return '검마의 손이 칼자루로 갔다. 그러다 멈췄다. “…그래. 미친 사람이었지. 나처럼.”';}],['당신도 그렇게 죽고 싶습니까',S=>{TK(S,'geomma',10);A(S,{mood:-5});return '“제자가 없다.” 검마가 당신을 보았다. 그 눈빛이 오래 남았다.';}]]}],
 dokma:[{min:-99,x:'약재상에서 마른 사내가 독초 한 움큼을 쥐고 냄새를 맡고 있다. 입술이 보랏빛이다.',l:'“이게 무슨 풀인지 아나? 맞히면 살려 주지.” 농담인지 아닌지 알 수 없다.',
   o:[['단장초(斷腸草)입니다',S=>{if(S.med>=30){TK(S,'dokma',10);A(S,{med:3});return '“호오.” 사내 눈이 반짝였다. “당가 놈들보다 낫군.”';}A(S,{hp:-10});return '틀렸다. 사내가 웃으며 해독약을 던졌다. “다음엔 맞혀라. 다음이 있다면.”';}],['모르겠습니다',S=>{TK(S,'dokma',4);return '“솔직하군. 모르는 걸 아는 놈은 독에 안 죽어.”';}],['독마 당 무진이시군요',S=>{TK(S,'dokma',3);A(S,{mind:3});return '사내의 웃음이 멈췄다. “눈이 좋군. 그 눈 오래 쓰고 싶으면 입은 다물어라.”';}]],
   n:{l:'“당가는 나를 쫓아냈다. 독으로 사람을 살리는 법을 연구했다는 이유로. 독으로 사람을 살리면, 당가의 독이 더는 무섭지 않게 되니까.”',
    o:[['그래서 마교에 갔습니까',S=>{TK(S,'dokma',4);return '“마교는 묻지 않아. 독이 강하면 그걸로 됐지.”';}],['그 연구를 배우고 싶습니다',S=>{TK(S,'dokma',10);A(S,{med:5,rp:5});S.flags.dokBook=1;return '독마가 품에서 낡은 책을 꺼냈다. “독경(毒經) 반 권이다. 나머지 반은 네가 써라.”';}],['독은 독일 뿐입니다',S=>{TK(S,'dokma',-3);return '“그 말을 하는 놈들이 제일 먼저 독에 죽더라.”';}]]}},
  {min:20,x:'독마가 찻잔을 내밀었다. 찻물이 묘하게 푸르다.',l:'“마셔라. 나를 믿는다면.”',
   o:[['마신다',S=>{TK(S,'dokma',12);if(S.rp>=40||has(S,'manduk')||has(S,'dokche')){A(S,{rp:8});return '독이었다. 그러나 몸이 이겨 냈다. 독마가 크게 웃었다. “좋다! 이제 너는 내 독을 아는 몸이다.”';}hurt(S,25,'독마의 차');A(S,{rp:10});return '사흘을 앓았다. 깨어나니 독마가 곁에 앉아 있었다. “살았군. 이제 이 독엔 안 죽는다.”';}],['마시지 않는다',S=>{TK(S,'dokma',-2);return '“현명하군. 독마의 차를 마시는 놈은 바보 아니면 친구지.”';}],['찻잔을 바꿔 권한다',S=>{TK(S,'dokma',8);A(S,{mind:4});return '독마가 웃으며 그 잔을 마셨다. “둘 다 독이었다. 바꿔도 소용없지. 해독약은 여기 있다.”';}]]}],
 binghu:[{min:-99,x:'북풍이 부는 객잔, 흰 옷의 여인이 앉은 탁자에만 서리가 내렸다.',l:'“차가 식었네요. 이 땅의 차는 늘 빨리 식어요.”',
   o:[['새 차를 시켜 드린다',S=>{TK(S,'binghu',6);return '“…고마워요.” 여인이 찻잔을 감쌌다. 찻잔이 금세 얼었다. 여인이 처음으로 웃었다.';}],['북해에서 오셨습니까',S=>{TK(S,'binghu',4);return '“북해에서는 차가 식지 않아요. 처음부터 차가우니까.”';}],['당신이 차가워서 식는 겁니다',S=>{TK(S,'binghu',8);return '여인이 눈을 들었다. “직설적이네요. 빙궁 사람들은 그런 말을 못 해요. 무서워서.”';}]],
   n:{l:'“빙백신공을 익히면 마음까지 얼어요. 기쁜 것도 슬픈 것도 멀어지죠. 궁주는 그래야 한다고 배웠어요.”',
    o:[['그래서 행복하십니까',S=>{TK(S,'binghu',8);A(S,{mood:-3});return '“행복이 뭔지 잊었어요. 그건 불행일까요?” 여인이 창밖의 눈을 보았다.';}],['녹이는 법도 있을 겁니다',S=>{TK(S,'binghu',10);return '“…있다면 가르쳐 줘요.” 여인이 장난처럼 말했다. 그런데 눈은 진지했다.';}],['얼음도 아름답습니다',S=>{TK(S,'binghu',5);return '“아름다운 건 만질 수 없죠.” 여인이 일어났다. 탁자의 서리가 천천히 녹았다.';}]]}},
  {min:20,x:'빙후가 보낸 서찰이 왔다. 종이가 얼음처럼 차갑다.',l:'“북해에 처음으로 꽃이 피었어요. 누가 심은 건지는 몰라요. 보러 오지 않을래요?”',
   o:[['북해로 간다',S=>{TK(S,'binghu',12);A(S,{mood:10});if(!S.job)S.loc='북해';return '얼음 위에 핀 붉은 꽃 한 송이. 빙후가 그 앞에 쪼그려 앉아 있었다. “녹지 않는 꽃이에요. 아니, 녹지 않으려고 버티는 꽃이에요.”';}],['답장만 보낸다',S=>{TK(S,'binghu',5);return '“꽃은 보는 사람이 있어야 핍니다.” 한 줄을 썼다. 이듬해 빙궁에서 꽃씨 한 봉지가 왔다.';}],['갈 수 없다고 한다',S=>{TK(S,'binghu',-2);return '답장은 오지 않았다. 대신 그해 겨울은 유난히 따뜻했다.';}]]}],
 hwayoung:[{min:-99,x:'꽃향기 짙은 정자, 화려한 옷의 여인이 부채로 입을 가리고 웃는다.',l:'“귀여운 얼굴이네. 내 궁에 오면 꽃으로 길러 줄게. 독한 꽃으로.”',
   o:[['꽃은 사양합니다',S=>{TK(S,'hwayoung',4);return '“꽃이 싫어? 그럼 꽃을 꺾는 사람이 되든가.” 여인이 부채를 접었다.';}],['독한 꽃이 되면 무엇이 좋습니까',S=>{TK(S,'hwayoung',6);return '“아무도 함부로 못 꺾지. 그거면 충분해. 여자에게는.” 웃음 끝이 쓸쓸했다.';}],['백화마후시군요',S=>{TK(S,'hwayoung',2);A(S,{mind:2});return '“이름을 아네? 그럼 내 딸 이름도 알겠구나.” 여인의 눈빛이 날카로워졌다.';}]],
   n:{l:'“세상 사내들은 꽃을 사랑한다고 하지. 그리고 시들면 버려. 그래서 나는 시들지 않는 꽃을 만들었어. 독으로. 내 딸도.”',
    o:[['따님은 그걸 원했습니까',S=>{TK(S,'hwayoung',3);TK(S,'hwayeon',5);return '여인의 부채가 멈췄다. “…묻지 않았어. 묻는 법을 몰랐으니까.”';}],['당신을 버린 사람이 있었군요',S=>{TK(S,'hwayoung',10);return '“…눈치 빠른 건 독이야.” 여인이 웃었다. 이번엔 부채로 입을 가리지 않았다.';}],['독도 아름답습니다',S=>{TK(S,'hwayoung',5);A(S,{moral:-2});return '“그래, 넌 알아보는구나.”';}]]}},
  {min:20,x:'화 영이 술에 취해 혼자 금(琴)을 타고 있다. 곡이 끝날 줄 모른다.',l:'“이 곡, 그 사람이 좋아하던 거야. 다 잊었는데 손가락이 기억해.”',
   o:[['곡이 끝날 때까지 듣는다',S=>{TK(S,'hwayoung',10);A(S,{mood:-3});return '새벽까지 들었다. 마지막 음에서 여인이 줄을 끊었다. “이제 됐어.”';}],['그 사람은 어디 있습니까',S=>{TK(S,'hwayoung',3);return '“무덤. 내가 묻었어. 독으로.” 여인이 다시 줄을 뜯었다.';}],['따님에게 들려주십시오',S=>{TK(S,'hwayoung',6);TK(S,'hwayeon',8);return '여인이 오래 말이 없었다. 며칠 뒤, 만화궁에서 처음으로 그 곡이 금 두 대로 울렸다고 한다.';}]]}],
 guya:[{min:-99,x:'산속 대장간, 늙은 대장장이가 망치질을 멈추지 않은 채 말한다.',l:'“쇠를 보러 왔나, 나를 보러 왔나. 쇠라면 보고 가고, 나라면 풀무나 밟아라.”',
   o:[['풀무를 밟는다',S=>{TK(S,'guya',8);A(S,{forge:5});return '반나절 풀무를 밟았다. 노인이 처음으로 당신을 보았다. “박자가 맞는다.”';}],['명검을 주문하러 왔습니다',S=>{TK(S,'guya',2);return '“명검은 주문하는 게 아니라 만나는 거다. 십 년 뒤에 와라.”';}],['그냥 쇠를 봅니다',S=>{TK(S,'guya',4);A(S,{forge:2});return '“그래. 쇠는 보기만 해도 배운다.” 노인이 벼린 칼을 물통에 넣었다. 김이 하늘로 올랐다.';}]],
   n:{l:'“칼에 이름을 붙이는 이유를 아나? 이름이 있으면 함부로 못 쓴다. 이름 없는 칼은 아무나 베지만, 이름 있는 칼은 이름을 걸고 벤다.”',
    o:[['당신이 만든 가장 좋은 칼은',S=>{TK(S,'guya',6);A(S,{forge:2});return '“아직 안 만들었다.” 노인이 웃었다. 일흔 살이었다.';}],['저도 이름을 갖고 싶습니다',S=>{TK(S,'guya',5);return '“칼처럼 두드려 맞아라. 그럼 생긴다.”';}],['사람도 그렇습니까',S=>{TK(S,'guya',8);A(S,{cult:3});return '“사람이야말로 그렇지. 그래서 별호라는 게 있는 거다.”';}]]}},
  {min:20,x:'구야 철이 꺼진 화로 앞에 앉아 있다. 처음 보는 일이다.',l:'“평생 칼을 만들었다. 그 칼들이 몇이나 죽였을까. 요즘은 그게 세어진다.”',
   o:[['칼이 지킨 사람도 세어 보십시오',S=>{TK(S,'guya',10);return '노인이 오래 생각하다 화로에 불을 붙였다. “…그것도 세어 봐야겠군.”';}],['호미를 만드십시오',S=>{TK(S,'guya',8);A(S,{forge:3});return '노인이 크게 웃었다. 그해 구야의 대장간에서 처음으로 호미가 나왔다. 세상에서 제일 잘 드는 호미였다.';}],['말없이 불을 지핀다',S=>{TK(S,'guya',6);return '불이 붙자 노인이 망치를 들었다. 말은 필요 없었다.';}]]}],
 cheongun:[{min:-99,x:'화산 아래 객잔, 흰 옷의 젊은 검객이 다리를 꼬고 앉아 있다. 사람들이 슬금슬금 피한다.',l:'“너, 검 좀 쓰나? 눈빛이 제법인데. 나랑 한판 할래? 지면 술 사.”',
   o:[['한판 붙는다',S=>{const b=battle(S,npcFoe(S,'cheongun'),{spar:1});TK(S,'cheongun',b.win?12:6);if(b.win)A(S,{fame:5});return fightText(b,'청운이 바닥에 주저앉아 크게 웃었다. “졌다! 술은 내가 산다. 이름이 뭐냐?”','“다음에 또 하자. 다음엔 내가 술 살게.” 청운이 손을 내밀었다.');}],['술은 그냥 사겠다',S=>{TK(S,'cheongun',8);A(S,{gold:-3});return '“싸우지도 않고 사는 놈은 처음이다.” 청운이 웃으며 잔을 채웠다. 그날 밤 화산 이야기를 밤새 들었다.';}],['화산신룡이라더니 오만하군',S=>{TK(S,'cheongun',4);return '“오만? 사실인데.” 청운이 웃었다. 미워할 수가 없는 웃음이었다.';}]],
   n:{l:'“사람들은 나를 천재라고 해. 그런데 말이야… 나는 밤마다 연무장에 나가. 천재는 밤에 연습 안 한다잖아. 들키면 안 되거든.”',
    o:[['비밀은 지키겠다',S=>{TK(S,'cheongun',10);return '“고맙다. 이건 너만 아는 거다.” 청운이 처음으로 진짜 얼굴로 웃었다.';}],['노력하는 천재가 더 멋지다',S=>{TK(S,'cheongun',8);return '“…그런가.” 청운이 귀까지 빨개졌다.';}],['그럼 천재가 아니군',S=>{TK(S,'cheongun',2);return '“그래, 아니야. 그러니까 더 해야 돼.” 청운이 술잔을 비웠다.';}]]}},
  {min:20,x:'청운이 화산 정상 바위에 앉아 노을을 보고 있다.',l:'“검성은 이 바위에 마지막 초식을 새겼대. 나는 언제쯤 여기 뭘 새길 수 있을까.”',
   o:[['지금 새겨라',S=>{TK(S,'cheongun',8);return '청운이 웃으며 검끝으로 바위에 두 글자를 새겼다. 「벗(友)」.';}],['검성보다 오래 살면 된다',S=>{TK(S,'cheongun',6);return '“그거 좋다. 오래 살아서 늙은이 소리 듣자. 둘 다.”';}],['새기지 않아도 된다',S=>{TK(S,'cheongun',5);A(S,{cult:3});return '“…그런가. 남는 게 없어도 되나.” 청운이 노을을 오래 보았다.';}]]}],
 maengju:[{min:-99,x:'찻집 이층, 깃털 부채를 든 중년 문사가 혼자 바둑을 두고 있다.',l:'“흑과 백 중 누가 이길 것 같소? 맞히면 차는 내가 사겠소.”',
   o:[['흑이 이깁니다',S=>{TK(S,'maengju',3);A(S,{lore:3});return '“틀렸소. 하지만 왜 흑이 졌는지 설명해 보시오.” 설명하다 보니 판이 보였다.';}],['백이 이깁니다',S=>{TK(S,'maengju',3);A(S,{lore:3});return '“틀렸소. 둘 다 지오. 이 판은 무승부로 가게 되어 있소.”';}],['두는 사람이 이깁니다',S=>{TK(S,'maengju',10);A(S,{lore:3});return '문사가 부채를 탁 접었다. “맞소. 바둑은 돌이 두는 게 아니지. 정천신산이 차를 사겠소.”';}]],
   n:{l:'“강호는 바둑판이오. 정·사·마가 돌이지. 그런데 돌들은 자기가 돌인 줄 모르오. 당신은 어떻소. 두는 사람이오, 돌이오?”',
    o:[['돌입니다',S=>{TK(S,'maengju',4);A(S,{cult:2});return '“솔직하구려. 돌인 줄 아는 돌은 이미 반은 두는 사람이오.”';}],['두는 사람입니다',S=>{TK(S,'maengju',6);A(S,{tongue:2});return '“그럼 오늘부터 상대가 생겼구려.” 문사가 웃었다.';}],['판을 엎겠습니다',S=>{TK(S,'maengju',8);return '문사가 크게 웃었다. “그 답을 한 사람이 둘 있었소. 하나는 천마, 하나는 검성.”';}]]}},
  {min:20,x:'제갈 휘가 지도를 펼쳐 놓고 붓을 쥔 채 굳어 있다.',l:'“마을 하나를 버려야 천 명을 살리오. 당신이라면 버리겠소?”',
   o:[['버린다',S=>{TK(S,'maengju',4);A(S,{mind:3,moral:-3});return '“나도 버렸소. 그리고 매일 밤 그 마을 이름을 외우오.”';}],['다른 길을 찾는다',S=>{TK(S,'maengju',8);A(S,{moral:3});return '“다른 길은 늘 있지. 다만 늦게 보일 뿐.” 문사가 붓을 내려놓았다.';}],['그 마을에 내가 가겠다',S=>{TK(S,'maengju',12);A(S,{fame:5});return '문사가 오래 당신을 보았다. “…병법에는 없는 수요. 그래서 이기는 수일지도.”';}]]}],
 nokrim:[{min:-99,x:'산길 주막, 곰 같은 사내가 술독째 들이켠다. 산적 서른이 그 뒤에 서 있다.',l:'“이 산을 넘으려면 통행세를 내야지. 돈이 없으면 술로 내라.”',
   o:[['술 대결로 낸다',S=>{TK(S,'nokrim',10);return '셋째 독에서 둘 다 쓰러졌다. 깨어 보니 산적들이 당신을 업고 산을 넘겨주고 있었다.';}],['돈을 낸다',S=>{A(S,{gold:-Math.min(S.gold,20)});TK(S,'nokrim',3);return '“시원하군.” 사내가 은자를 산적 하나에게 던졌다. “아랫마을 과부댁에 갖다줘.”';}],['도적에게 낼 돈은 없다',S=>{TK(S,'nokrim',6);return '“배짱 좋네.” 사내가 웃었다. “녹림은 배짱 있는 놈한테 길을 비켜 준다.”';}]],
   n:{l:'“사람들은 우리를 도적이라 하지. 맞아. 그런데 관아는 법으로 훔치고 우리는 칼로 훔친다. 누가 더 나쁘냐?”',
    o:[['둘 다 나쁘다',S=>{TK(S,'nokrim',5);return '“하하! 맞다. 그래도 우리는 숨기지는 않지.”';}],['관아다',S=>{TK(S,'nokrim',8);A(S,{moral:-1});return '“그렇지! 너 녹림 체질이다.”';}],['훔치지 않는 사람이 제일 낫다',S=>{TK(S,'nokrim',3);A(S,{moral:3});return '“그런 놈은 굶어 죽어.” 사내가 잔을 내밀었다. “그래도 그런 놈이 있어야 세상이 돌아가긴 하지.”';}]]}},
  {min:20,x:'녹림왕이 산채 꼭대기에서 아랫마을 불빛을 보고 있다.',l:'“저 불빛 중에 내 고향 집이 있다. 열 살 때 흉년에 산으로 올라왔지. 도적이 될 줄은 몰랐다.”',
   o:[['내려가 보십시오',S=>{TK(S,'nokrim',10);A(S,{mood:5});return '이듬해, 녹림왕이 아랫마을 우물을 새로 파 주었다는 소문이 돌았다.';}],['이제 와서 무슨 소용입니까',S=>{TK(S,'nokrim',-3);return '“…그렇지. 소용없지.” 사내의 등이 작아 보였다.';}],['같이 술 한잔합시다',S=>{TK(S,'nokrim',8);return '둘은 불빛이 다 꺼질 때까지 마셨다.';}]]}],
 cheonma:[{min:-99,if:S=>S.w.demon>=3||S.org==='demon',x:'사막의 밤, 모닥불 건너편에 검은 옷의 사내가 앉아 있다. 그가 앉은 자리에만 바람이 불지 않는다.',l:'“두려워하지 마라. 오늘은 사람을 죽이러 나온 게 아니다. 별을 보러 나왔다.”',
   o:[['별을 함께 본다',S=>{TK(S,'cheonma',8);A(S,{mood:3});return '별이 쏟아졌다. 사내가 말했다. “백 년 전에도 별은 이랬다. 사람만 바뀌었지.”';}],['천마인가',S=>{TK(S,'cheonma',3);A(S,{mind:3});return '“그렇게 부르더군. 나는 혁련 무악이다. 이름으로 불러 주는 놈은 오랜만이군.”';}],['칼을 뽑는다',S=>{TK(S,'cheonma',5);return '“좋은 눈이다. 그러나 오늘은 아니다.” 사내가 손가락 하나로 당신의 칼을 칼집에 밀어 넣었다.';}]],
   n:{l:'“백 년 동안 봉인되어 있었다. 깨어 보니 검성은 죽고 없더군. 이길 상대가 없는 세상은 쓸쓸하다. 너는 언젠가 나를 이길 수 있겠느냐?”',
    o:[['반드시 이기겠다',S=>{TK(S,'cheonma',10);A(S,{fame:3});return '천마가 크게 웃었다. 사막이 울렸다. “기다리마. 늙지 말고 와라.”';}],['이기고 싶지 않다',S=>{TK(S,'cheonma',4);A(S,{cult:3});return '“…검성도 그렇게 말했지.” 천마의 눈빛이 잠시 멀어졌다.';}],['그 쓸쓸함이 천마를 만든 것이다',S=>{TK(S,'cheonma',12);return '천마가 오래 당신을 보았다. 모닥불이 꺼질 때까지 아무 말이 없었다.';}]]}}]};
/* ══ 같은 사문 사람: 처음 보는 사람처럼 만나지 않는다 ══
   같은 사문에 들면 그 사문 사람들은 이미 아는 얼굴이 된다(정체를 숨긴 혁련 하는 빼고).
   대화의 첫 장면도 '낯선 사람과의 만남'이 아니라 '사문 어른·사형제와의 자리'로 바뀐다. */
const sameOrg=(S,id)=>!!(S&&NPCS[id]&&NPCS[id].org&&NPCS[id].org===S.org);
const retired=(S,id)=>!!(S&&S.flags['retired_'+id]);
function sectMeet(S){if(!S.org)return;for(const id in NPCS){if(id==='ha'||!sameOrg(S,id)||S.dead_npc[id]||S.met[id])continue;
  S.met[id]=1;S.rel[id]=(S.rel[id]||0)+(LEADER[S.org]===id?6:4);npcMem(S,id,`같은 ${ORGS[S.org].n} 사람으로 알게 되었다`);}}
const sectRole=(S,id)=>{const o=ORGS[S.org];return retired(S,id)?`전대 ${o.ranks[4]}`:LEADER[S.org]===id?o.ranks[4]:(NPCS[id].realm||0)>=6?'어른':'사형제';};
const SECT_FIRST={
 geolwang:{x:'분타 뒷마당, 방주가 술 호리병을 끼고 졸고 있다. 개방 제자라면 누구나 아는 그 푸른 대나무 막대기가 옆에 기대어 있다.',l:'“어이, 우리 개방 식구. 국수 한 그릇 사 주면 방주가 재밌는 얘기 하나 해 주지. 식구한테는 반값이다.”',
  o:[['국수를 사 드린다',S=>{TK(S,'geolwang',8);A(S,{gold:-2});return '방주는 국수를 세 그릇 비웠다. “식구가 사 주는 국수가 제일 맛있어.”';}],['술도 한 병 사 드린다',S=>{TK(S,'geolwang',12);A(S,{gold:-5});return '“허, 우리 분타에 이런 놈이 있었나.” 방주 눈이 번쩍 떠졌다.';}],['방주님께 드릴 돈은 없습니다',S=>{TK(S,'geolwang',2);return '방주가 껄껄 웃었다. “그래야 거지지! 잘 배웠다.” 그러고는 이야기를 해 주었다.';}]]},
 geomseon:{x:'무당 뒷산, 구름 낀 산정. 사문의 큰어른 검선께서 나뭇가지로 허공을 긋고 계신다. 입문한 지 오래지만 이렇게 가까이 뵙는 건 처음이다.',l:'“무당 아이로구나. 검을 무엇으로 쥐느냐?”'},
 buljon:{x:'소림 장경각 뒤 찻방. 사문의 큰어른 불존께서 찻잔을 들고 계신다. 지나가다 눈이 마주쳤다.',l:'“같은 절밥을 먹는 아이로군. 자네 얼굴에 칼 그림자가 있네. 누굴 베었나, 아니면 베고 싶나?”',
  o:[['벤 적이 있습니다',S=>{TK(S,'buljon',6);A(S,{cult:2});return S.moral<0?'“그 무게를 아는 얼굴이네. 다행이야.”':'“그래도 얼굴이 맑구나. 벤 것이 아니라 막은 것이겠지.”';}],['베고 싶은 자가 있습니다',S=>{TK(S,'buljon',5);A(S,{temper:-3});return '“그자를 벤 뒤의 네 얼굴을 떠올려 보아라. 그 얼굴이 마음에 들면 가거라.” 노승이 차를 따랐다.';}],['그런 것 없습니다',S=>{TK(S,'buljon',3);return '“없으면 다행이고, 모르는 것이면 위험하다.”';}]]},
 gumwang:{x:'새벽 남궁세가 연무장. 가주께서 홀로 검을 닦고 계신다. 세가 사람이라도 이 시간에 연무장에 드는 이는 드물다.',l:'“이 시간에 연무장에 드는 놈이 아직 있었군. 무슨 일이냐.”',
  o:[['가주님의 검을 보러 왔습니다',S=>{TK(S,'gumwang',5);return '“검은 보는 것이 아니라 받는 것이다.” 가주가 검을 거두었다. 살짝 웃은 것 같기도 했다.';}],['수련하러 왔습니다',S=>{TK(S,'gumwang',4);SK(S,S.mainW,1);return '“그럼 해라.” 가주는 한 시진 동안 말없이 당신의 검을 지켜보다가, 손목 하나를 고쳐 잡아 주고 나갔다.';}],['가주님과 겨루고 싶습니다',S=>{if(S.realm>=4){TK(S,'gumwang',10);return '“…좋다. 언젠가.” 가주가 처음으로 당신을 세가의 아이가 아닌 검객으로 보았다.';}TK(S,'gumwang',-2);return '“아직 네 검이 울지 않는구나. 울면 다시 와라.”';}]]},
 geomma:{x:'비 오는 총단 다리 위. 교의 장로 검마가 붉은 검을 빗물에 씻고 있다. 같은 교의 옷을 입은 당신을 보고도 검을 거두지 않는다.',l:'“교의 옷을 입었다고 다 같은 편은 아니다. 너는 무엇을 위해 칼을 드느냐. 대답에 따라 벨지도 모른다.”',
  o:[['교도 아니고, 나를 위해서다',S=>{TK(S,'geomma',6);return '장로가 웃었다. 처음 웃어 보는 사람처럼 서툰 웃음이었다. “교에서 그 말을 하는 놈은 처음이다.”';}],['교를 위해서다',S=>{TK(S,'geomma',1);return '“그래서?” 장로가 검을 들었다가 내렸다. “교를 위해 칼을 드는 놈은 많다. 오래 사는 놈은 드물지.”';}],['장로님을 넘기 위해서다',S=>{TK(S,'geomma',6);A(S,{mind:3});return '“좋다.” 장로의 살기가 다리를 덮었다. 그러다 거뒀다. “교 안에도 그런 눈을 한 놈이 있었군. 더 자라서 와라.”';}]]},
 dokma:{x:'총단 약방. 교의 객경 독마가 독초 한 움큼을 쥐고 냄새를 맡고 있다. 입술이 보랏빛이다.',l:'“교의 아이로군. 이게 무슨 풀인지 아나? 맞히면 내 약방 출입을 허락해 주지.”',
  o:[['단장초(斷腸草)입니다',S=>{if(S.med>=30){TK(S,'dokma',10);A(S,{med:3});return '“호오.” 객경의 눈이 반짝였다. “당가 놈들보다 낫군. 내일부터 와라.”';}A(S,{hp:-10});return '틀렸다. 객경이 웃으며 해독약을 던졌다. “교도 하나 죽이면 장로들이 시끄러워서. 다음엔 맞혀라.”';}],['모르겠습니다',S=>{TK(S,'dokma',4);return '“솔직하군. 모르는 걸 아는 놈은 독에 안 죽어.”';}],['약방 출입은 사양하겠습니다',S=>{TK(S,'dokma',2);A(S,{mind:2});return '“눈치는 있군.” 객경이 다시 풀 냄새를 맡았다. “교에서 오래 살겠어.”';}]]},
 binghu:{x:'빙궁 한옥전(寒玉殿). 궁주께서 홀로 차를 드시는데, 앉은 탁자에만 서리가 내렸다. 문 앞을 지나던 당신을 궁주가 불러 세웠다.',l:'“들어와 앉아요. 차가 식었네요. 이 궁의 차는 늘 빨리 식어요.”',
  o:[['새 차를 올린다',S=>{TK(S,'binghu',6);return '“…고마워요.” 궁주가 찻잔을 감쌌다. 찻잔이 금세 얼었다. 궁주가 처음으로 웃었다.';}],['궁 밖은 차가 덜 식습니까',S=>{TK(S,'binghu',4);return '“궁 밖에선 차가 따뜻하대요. 나는 마셔 본 적이 없어요. 궁주는 궁을 떠나지 않으니까.”';}],['궁주님이 차가우셔서 식는 겁니다',S=>{TK(S,'binghu',8);return '궁주가 눈을 들었다. “직설적이네요. 궁 사람들은 그런 말을 못 해요. 무서워서. …당신도 궁 사람인데.”';}]]},
 hwayoung:{x:'만화궁 꽃정자. 궁주께서 부채로 입을 가리고 웃고 계신다. 궁의 사람이라면 저 웃음이 무엇을 뜻하는지 안다.',l:'“우리 궁에 들어온 지 꽤 됐지? 꽃으로 잘 크고 있나 보러 왔어. 독한 꽃으로.”',
  o:[['저는 꽃이 아닙니다',S=>{TK(S,'hwayoung',4);return '“꽃이 싫어? 그럼 꽃을 꺾는 사람이 되든가.” 궁주가 부채를 접었다. 마음에 든 눈치였다.';}],['독한 꽃이 되면 무엇이 좋습니까',S=>{TK(S,'hwayoung',6);return '“아무도 함부로 못 꺾지. 그거면 충분해. 여자에게는. 사내에게도.” 웃음 끝이 쓸쓸했다.';}],['소궁주님은 잘 지내십니까',S=>{TK(S,'hwayoung',2);A(S,{mind:2});return '“우리 딸 걱정을 하네?” 궁주의 눈빛이 날카로워졌다. “궁 안에서 그 아이 얘기는 조심해.”';}]]},
 cheongun:{x:'화산 연무장 구석, 매 청운이 다리를 꼬고 앉아 있다. 같은 화산 제자들도 슬금슬금 그를 피한다.',l:'“어, 너 우리 화산 애지? 연무장에서 몇 번 봤어. 나랑 한판 할래? 지면 술 사.”',
  o:[['한판 붙는다',S=>{const b=battle(S,npcFoe(S,'cheongun'),{spar:1});TK(S,'cheongun',b.win?12:6);if(b.win)A(S,{fame:5});return fightText(b,'청운이 바닥에 주저앉아 크게 웃었다. “졌다! 술은 내가 산다. 화산에 이런 놈이 있었네.”','“다음에 또 하자. 같은 화산끼리 실컷 하자고.” 청운이 손을 내밀었다.');}],['술은 그냥 사겠다',S=>{TK(S,'cheongun',8);A(S,{gold:-3});return '“싸우지도 않고 사는 놈은 처음이다.” 청운이 웃으며 잔을 채웠다. 그날 밤 장문인 흉을 밤새 같이 봤다.';}],['사형은 여전히 오만하군요',S=>{TK(S,'cheongun',4);return '“오만? 사실인데.” 청운이 웃었다. 미워할 수가 없는 웃음이었다.';}]]},
 nokrim:{x:'녹림 총채 대청. 녹림왕이 술독째 들이켜다 당신을 보고 손짓한다. 산채 형제들이 길을 비킨다.',l:'“우리 식구 왔구나! 거기 앉아라. 오늘은 통행세 대신 술이다. 못 마시면 형제가 아니지.”',
  o:[['술 대결로 답한다',S=>{TK(S,'nokrim',10);return '셋째 독에서 둘 다 쓰러졌다. 깨어 보니 형제들이 둘을 나란히 눕혀 놓고 이불을 덮어 주었다.';}],['형제들 몫까지 술값을 낸다',S=>{A(S,{gold:-Math.min(S.gold,20)});TK(S,'nokrim',6);return '“시원하군.” 녹림왕이 은자를 형제 하나에게 던졌다. “아랫마을 과부댁에도 한 몫 갖다줘라.”';}],['술보다 일 얘기를 합시다',S=>{TK(S,'nokrim',4);A(S,{contrib:5});return '“재미없는 놈.” 녹림왕이 웃었다. 그러고는 산채 지도를 펼쳤다.';}]]},
 cheonma:{x:'총단 가장 높은 누각. 교주께서 홀로 별을 보고 계신다. 호위들이 물러난 자리에 당신이 남았다. 교주가 앉은 자리에만 바람이 불지 않는다.',l:'“교의 아이로구나. 두려워하지 마라. 오늘은 교주로서가 아니라 별을 보러 나왔다.”',

 hyeono:[{min:-99,x:'숭산 소림 대웅전 앞, 노승이 비질을 하고 있다. 방장이 손수 비질을 한다는 걸 처음 온 사람들은 믿지 않는다.',l:'“낙엽은 쓸어도 또 떨어지오. 그래도 쓰는 거요. 강호의 악도 그렇소.”',
   o:[['그럼 끝이 없지 않습니까',S=>{A(S,{cult:3});return '“끝이 없으니 쓰는 사람이 있어야 하오.”';}],['비를 제게 주십시오',S=>{TK(S,'hyeono',10);A(S,{moral:3});return '방장이 웃으며 비를 건넸다. 둘은 해가 질 때까지 말없이 쓸었다.';}],['악을 뿌리째 뽑으면 됩니다',S=>{TK(S,'hyeono',3);return '“뿌리를 뽑으면 산이 무너지오. 사람 마음에도 뿌리가 얽혀 있소.”';}]],
   n:{l:'“소림 무공이 왜 백여덟 가지인지 아시오? 번뇌가 백여덟 가지라서요. 무공 하나를 익힐 때마다 번뇌 하나를 이겨야 하오. 그래서 소림 무공은 느리오.”',
    o:[['느린 것이 강한 것입니까',S=>{A(S,{cult:2});return '“늦게 피는 꽃이 오래가오.”';}],['번뇌를 이기지 못하면요',S=>{A(S,{rm:3});return '“그 무공이 사람을 잡아먹소. 강호의 마두들이 그렇게 태어났지.”';}],['저는 번뇌가 많습니다',S=>{TK(S,'hyeono',6);return '“그럼 백여덟 가지를 다 익힐 수 있겠구려.” 방장이 처음으로 소리 내어 웃었다.';}]]}}],
 cheongjin:[{min:-99,x:'자소궁 뜰, 노도사가 거북이에게 먹이를 주고 있다. 백 살이 넘은 거북이라고 한다.',l:'“이 녀석은 나보다 무당에 오래 있었네. 태극을 가장 잘 아는 건 아마 이 녀석일 걸세. 서두르는 법이 없거든.”',
   o:[['거북이에게도 배울 게 있습니까',S=>{A(S,{cult:3});return '“세상 모든 것에 배울 게 있지. 다만 배우려는 마음이 거북이보다 느릴 뿐.”';}],['장문인께서는 언제 서두르십니까',S=>{TK(S,'cheongjin',6);return '“제자가 위험할 때. 그때만큼은 무당에서 제일 빠른 사람이 되네.”';}],['무당의 검을 보여 주십시오',S=>{TK(S,'cheongjin',5);A(S,{exp:tb(S)*.5});return '노도사가 대나무 가지를 들어 한 번 그었다. 연못 물이 갈라졌다가 소리 없이 닫혔다. “이게 다일세. 나머지는 자네 몫이고.”';}]],
   n:{l:'“무당 제자는 산을 내려가면 산을 등에 지고 다니네. 눈에 보이지 않는 산이지. 그 무게를 잊는 순간부터는 무당 사람이 아니야.”',
    o:[['무거운 산이군요',S=>{A(S,{cult:2});return '“무겁지. 그래서 허리가 곧아지네.”';}],['내려놓고 싶을 때는요',S=>{TK(S,'cheongjin',6);A(S,{mood:5});return '“그땐 돌아오게. 산은 늘 여기 있으니.”';}],['저도 그 산을 지겠습니다',S=>{TK(S,'cheongjin',8);A(S,{moral:3});return '노도사가 고개를 끄덕였다. 거북이도 고개를 들었다.';}]]}}],
 unhak:[{min:-99,x:'화산 연무장, 장문인이 제자들의 검을 하나하나 고쳐 잡아 주고 있다. 매화 꽃잎이 그의 어깨에 쌓인다.',l:'“화산의 검은 화려하다고들 하지. 맞아. 그런데 화려함은 보여 주려고 있는 게 아니야. 꽃은 누구 보라고 피는 게 아니거든.”',
   o:[['그럼 왜 핍니까',S=>{A(S,{cult:3});return '“필 때가 되어서 피지. 검도 그래. 벨 때가 되어서 베는 거다.”';}],['청운 사형도 그걸 압니까',S=>{TK(S,'unhak',4);TK(S,'cheongun',3);return '장문인이 웃었다. “그 녀석은 보여 주려고 피는 꽃이다. 언젠가 꺾여 봐야 알겠지.” 웃음 끝이 쓸쓸했다.';}],['검을 고쳐 잡아 주십시오',S=>{TK(S,'unhak',8);SK(S,S.mainW,3);return '장문인이 당신 손목을 한 치 돌렸다. 검이 갑자기 가벼워졌다.';}]],
   n:{l:'“정파가 왜 정파인지 아나? 강해서가 아니야. 마교가 더 강할 때도 있었지. 정파는, 이길 수 있을 때 멈출 줄 알아서 정파다.”',
    o:[['멈추면 지는 것 아닙니까',S=>{A(S,{moral:2});return '“지는 것보다 무서운 게 있어. 이기고 나서 괴물이 되는 거다.”';}],['언제 멈춰야 합니까',S=>{TK(S,'unhak',5);A(S,{cult:3});return '“상대가 칼을 놓았을 때. 그리고 네 칼이 웃기 시작할 때.”';}],['저는 끝까지 베겠습니다',S=>{A(S,{temper:3});return '“그럼 네 칼이 너를 벨 날이 올 거다.” 장문인이 매화 가지 하나를 꺾어 당신 손에 쥐여 주었다.';}]]}}],
 jeonghye:[{min:-99,x:'금정 절벽, 엄한 얼굴의 비구니가 바람을 맞고 서 있다.',l:'“아미의 검을 여인의 검이라 업신여기는 자들이 있소. 그런 자들은 대개 한 번만 업신여기지.”',
   o:[['두 번째가 없어서입니까',S=>{TK(S,'jeonghye',6);return '“살아는 있소. 다만 다시는 검을 들지 않더군.” 사태가 처음으로 입꼬리를 올렸다.';}],['여인의 검과 사내의 검이 다릅니까',S=>{A(S,{cult:2});return '“다르오. 여인의 검은 지키려고 먼저 배우고, 사내의 검은 이기려고 먼저 배우지. 끝에 가면 같아지오.”';}],['소소는 잘 지냅니까',S=>{TK(S,'jeonghye',4);TK(S,'soso',3);return '“그 아이는 웃음이 많소. 아미에 웃음이 있어 다행이오.” 엄한 얼굴이 잠깐 풀렸다.';}]],
   n:{l:'“나는 제자들 앞에서 운 적이 없소. 장문인이 울면 산이 흔들리니까. 대신 이 절벽에 와서 우오. 바람이 다 가져가지.”',
    o:[['지금도 우실 일이 있습니까',S=>{TK(S,'jeonghye',8);return '“…작년 겨울 제자 둘을 잃었소.” 바람이 셌다. 사태의 눈가가 젖었는지는 알 수 없었다.';}],['바람이 되어 드리겠습니다',S=>{TK(S,'jeonghye',10);return '“…건방지구려.” 사태가 등을 돌렸다. 어깨가 조금 떨렸다.';}],['말없이 함께 서 있는다',S=>{TK(S,'jeonghye',6);A(S,{cult:3});return '해가 질 때까지 둘은 바람 속에 서 있었다.';}]]}}],
 unjung:[{min:-99,x:'곤륜 설산, 장문인이 눈 위를 걷는데 발자국이 남지 않는다.',l:'“곤륜의 경공을 왜 배우는지 아나? 도망치려고가 아니다. 남보다 먼저 닿으려고다. 불난 집에, 쓰러진 사람에게.”',
   o:[['먼저 닿으면 무엇이 달라집니까',S=>{TK(S,'unjung',5);A(S,{moral:3});return '“한 사람이 산다.”';}],['저도 발자국 없이 걷고 싶습니다',S=>{A(S,{qing:3});return '“그럼 무거운 것부터 내려놓아라. 마음이 무거우면 눈이 기억한다.”';}],['도망칠 때도 쓰지 않습니까',S=>{TK(S,'unjung',4);return '“…가끔.” 장문인이 웃었다. “살아야 다음에 먼저 닿지.”';}]]}],
 tangcw:[{min:-99,x:'당가 외당, 가주가 찻잔을 들고 웃는다. 그 웃음이 무섭다.',l:'“당가를 독의 가문이라 하지. 맞소. 그런데 생각해 보시오. 독을 가장 잘 아는 자가 해독도 가장 잘하오. 당가가 없으면 천하의 독은 누가 풀겠소?”',

 paengmj:[{min:-99,x:'하북팽가 연무장, 거구의 가주가 도를 땅에 꽂고 고함을 지른다. 처마의 참새들이 일제히 날아갔다.',l:'“팽가는 말이 짧다! 도가 길어서! 할 말 있으면 도로 해라!”',
   o:[['도로 말한다',S=>{const b=battle(S,npcFoe(S,'paengmj'),{spar:1});TK(S,'paengmj',b.win?12:8);return fightText(b,'가주의 도가 처음으로 반 걸음 밀렸다. “좋다! 말이 통하는구나!”','도에 맞아 나가떨어졌다. 가주가 손을 내밀었다. “좋다! 말이 통하는구나!”');}],['말로 하겠습니다',S=>{TK(S,'paengmj',3);return '“말? …좋다, 짧게!”';}],['더 크게 대답한다',S=>{TK(S,'paengmj',8);return '목청껏 외쳤다. 가주가 껄껄 웃었다. “팽가 체질이구나!”';}]]}],
 songhak:[{min:-99,x:'산길에서 무당의 젊은 도사가 넘어진 할머니의 짐을 지고 있다. 짐이 셋이다.',l:'“도와주시겠습니까? 이 짐들을 산 너머까지 옮겨야 하는데, 무당의 이름으로 약속을 했습니다.”',
   o:[['함께 진다',S=>{TK(S,'songhak',10);A(S,{moral:4});return '산 너머까지 둘이 짐을 졌다. 도사가 말했다. “사형제가 아니어도, 같은 짐을 지면 도반(道伴)입니다.”';}],['그 할머니는 사기꾼이다',S=>{TK(S,'songhak',6);A(S,{mind:2});return '도사가 놀라 돌아보자 할머니가 달아났다. 짐에는 돌만 들어 있었다. 도사가 웃었다. “그래도 약속은 지켰으니 됐습니다.”';}],['갈 길이 바쁘다',S=>{TK(S,'songhak',-2);return '도사가 고개를 숙였다. “무량수불. 좋은 길 되십시오.” 짐 셋을 진 등이 멀어졌다.';}]]}],
 wipc:[{min:-99,x:'사도련 총단, 커다란 의자에 앉은 사내가 발을 탁자에 올리고 있다. 흑도의 거물들이 그 둘레에 서 있다.',l:'“정파 놈들은 우리를 사파라 부르지. 삿될 사(邪). 좋아. 그럼 묻자. 그 정파 놈들이 성 안에서 굶는 백성을 보고 뭘 했지? 우린 곳간을 털어 나눴다. 누가 삿된가?”',
   o:[['둘 다 삿됩니다',S=>{TK(S,'wipc',6);return '“하하! 정직해서 좋군. 사파는 적어도 착한 척은 안 하지.”';}],['그래도 사람을 죽이지 않았습니까',S=>{TK(S,'wipc',3);return '련주가 웃음을 멈췄다. “죽였지. 그래서 우린 정파처럼 무덤 앞에서 울지 않아. 무덤에 술을 붓지.”';}],['련주의 잔을 채운다',S=>{TK(S,'wipc',8);return '련주가 잔을 받아 들고 당신을 오래 보았다. “흑도에서 술을 따르는 건 목숨을 맡긴다는 뜻이다. 알고 따른 건가?”';}]],
   n:{l:'“흑도의 법은 셋이다. 의리를 저버리지 말 것. 약한 놈 등치는 놈은 흑도도 아니다. 그리고, 술은 남기지 말 것.”',
    o:[['셋째가 제일 어렵겠군요',S=>{TK(S,'wipc',8);return '련주가 술독을 통째로 들었다. “그래서 내가 련주다.”';}],['둘째는 지켜집니까',S=>{TK(S,'wipc',4);A(S,{moral:2});return '“…지키려고 내가 있는 거다. 어기는 놈은 내가 직접 벤다.”';}],['저는 법 없이 살겠습니다',S=>{A(S,{temper:2});return '“그럼 흑도도 못 된다. 흑도는 법이 없는 게 아니야. 관아의 법이 아니라 우리 법을 사는 거지.”';}]]}}],
 eunsn:[{min:-99,x:'강남 객잔 구석, 노파가 해바라기씨를 까먹으며 오가는 사람을 본다.',l:'“젊은이, 어제 남궁세가 셋째 공자가 기루에 외상 진 거 알아? 모르지? 나는 알아. 그게 하오문이야.”',
   o:[['그걸 알아서 무엇합니까',S=>{A(S,{mind:3});return '“오늘은 쓸모없지. 십 년 뒤 그 셋째가 가주가 되면 쓸모 있어.”';}],['제 소문도 있습니까',S=>{TK(S,'eunsn',6);return '노파가 씨를 뱉었다. “있지. 값은 비싸.” 그러곤 하나를 공짜로 말해 주었다. 정확했다.';}],['씨를 한 줌 얻어먹는다',S=>{TK(S,'eunsn',8);return '“하오문은 씨 하나도 공짜가 없는데… 넌 특별히.” 노파가 웃었다. 이가 세 개였다.';}]]}],
 galch:[{min:-99,x:'장강 위 누선(樓船), 거구의 사내가 뱃전에 서서 강물에 술을 붓는다.',l:'“장강 용왕님께 먼저 한 잔. 이 물에 빠져 죽은 내 형제들 몫이다. 너도 한 잔 부어라. 물 위에서 살 거면.”',
   o:[['강물에 술을 붓는다',S=>{TK(S,'galch',10);return '“좋다. 이제 장강이 너를 기억한다.” 그날 밤 배 위에서 수적 서른이 노래를 불렀다.';}],['죽은 자에게 술은 아깝다',S=>{TK(S,'galch',-3);return '“…뭍사람이군.” 용왕이 등을 돌렸다.';}],['한 잔은 용왕님께, 한 잔은 당신께',S=>{TK(S,'galch',8);A(S,{tongue:2});return '사내가 크게 웃으며 잔을 받았다. “말할 줄 아는 놈이군!”';}]]}],
 nangis:[{min:-99,x:'달 밝은 강둑, 사내 하나가 술병을 든 채 칼을 휘두르며 춤을 춘다. 칼과 춤과 술이 한 몸 같다.',l:'“한잔하겠소? 칼은 술맛을 돋우고, 술은 칼끝을 무디게 하지. 무딘 칼로 추는 춤이 제일 오래 가오.”',
   o:[['술을 받는다',S=>{TK(S,'nangis',8);A(S,{mood:8});return '술이 달았다. 사내가 다시 춤추기 시작했다. 칼끝이 달빛을 베어 당신 잔에 떨어뜨리는 것 같았다.';}],['칼로 답한다',S=>{const b=battle(S,npcFoe(S,'nangis'),{spar:1});TK(S,'nangis',b.win?12:8);return fightText(b,'칼과 칼이 부딪칠 때마다 술병이 울렸다. 사내가 먼저 칼을 거뒀다. “좋다, 좋아! 칼이 노래를 하는구려!”','사내의 칼끝이 당신 술잔을 두 쪽 냈다. 술은 한 방울도 흘리지 않았다. “좋은 칼이오. 아직 취하지 않았을 뿐.”');}],['춤은 출 줄 모른다',S=>{TK(S,'nangis',4);return '“걷는 것도 춤이오. 음악을 못 들을 뿐이지.”';}]],
   n:{l:'“정파 놈들은 칼에 의(義)를 싣고, 마교 놈들은 칼에 야망을 싣지. 나는 칼에 아무것도 안 실어. 그래서 칼이 가볍고, 춤이 되지.”',
    o:[['그래도 무언가는 지키지 않습니까',S=>{TK(S,'nangis',6);return '“…술병.” 사내가 웃었다. 그러고는 조용히 덧붙였다. “그리고 오늘 같이 마신 놈.”';}],['가벼운 칼은 아무도 못 지킨다',S=>{TK(S,'nangis',3);return '“무거운 칼은 지키다 부러지지. 나는 부러지기 싫소.”';}],['나도 가볍게 살고 싶다',S=>{TK(S,'nangis',8);A(S,{mood:5});return '“그럼 오늘부터 연습하쇼. 내일 일은 내일의 술이 알아서 하오.”';}]]}}],
 cheolms:[{min:-99,x:'녹림 산채 어귀, 외팔의 사내가 남은 한 팔로 장작을 팬다.',l:'“팔 하나는 약속을 지키느라 잃었다. 후회? 없다. 약속을 어겼으면 팔은 두 개였겠지만, 사내로는 반쪽이었을 거다.”',
   o:[['무슨 약속이었습니까',S=>{TK(S,'cheolms',6);return '“형님의 딸을 지킨다는 약속. 그 아이는 지금 서당 훈장이다.” 사내의 눈이 처음으로 부드러워졌다.';}],['약속이 팔보다 무겁습니까',S=>{TK(S,'cheolms',4);A(S,{moral:2});return '“목숨보다도.”';}],['장작을 대신 팬다',S=>{TK(S,'cheolms',8);return '“…고맙다.” 사내는 그날 밤 술을 한 독 내왔다.';}]]}],
 eumsg:[{min:-99,x:'마교 대전 뒤 정원, 부교주가 국화를 가꾸고 있다. 손이 하얗고 고와서 오히려 섬뜩하다.',l:'“국화는 서리가 내려야 피지. 다른 꽃들이 다 죽은 뒤에 말이야. 나는 국화가 좋아. 자네는 어떤 꽃인가?”',
   o:[['봄꽃입니다',S=>{A(S,{mind:3});return '“빨리 피고 빨리 지지. 마교에는 그런 꽃이 많아. 내가 많이 꺾었지.”';}],['서리입니다',S=>{TK(S,'eumsg',8);return '부교주가 가위를 멈췄다. 그리고 웃었다. “…재미있군. 자네와는 오래 이야기하고 싶어.” 칭찬인지 위협인지 알 수 없었다.';}],['꽃 이야기는 하지 맙시다',S=>{TK(S,'eumsg',-2);return '“그래, 그러지. 대신 다음엔 무덤 이야기를 하지.”';}]]}],
 sagong:[{min:-99,x:'촛불 하나, 바둑판 하나. 마교의 군사가 혼자 두 사람 몫의 돌을 놓고 있다.',l:'“정파 놈들은 의리로 움직이지. 그래서 다루기 쉬워. 의리를 건드리면 알아서 서로 죽이거든. 자, 이 판에서 너는 어느 돌을 잡겠나?”',
   o:[['흰 돌',S=>{A(S,{mind:3});return '“정파 쪽이군. 좋아, 내가 흑으로 이기는 걸 보여 주지.” 스무 수 만에 졌다. 군사가 웃었다. “의리는 수를 읽지 못해.”';}],['검은 돌',S=>{TK(S,'sagong',5);return '“같은 편이군. 그럼 이 판이 어떻게 끝날지 알겠지.” 군사가 흰 돌 하나를 손끝으로 튕겨 냈다.';}],['판을 뒤집는다',S=>{TK(S,'sagong',6);return '군사가 한참 당신을 보다 손뼉을 쳤다. “계략을 깨는 수는 그것 하나뿐이지. 미친 수.”';}]]}],
 yohr:[{min:-99,x:'붉은 등 아래, 여인이 비단 부채를 펼치며 다가온다. 향기가 머리를 어지럽힌다.',l:'“정파 사내들은 참 귀여워. 의리, 정의, 협의… 그런 말을 할 때 눈이 반짝이거든. 그 눈을 감기는 게 내 일이야. 영원히.”',
   o:[['나는 그 눈을 감지 않겠다',S=>{TK(S,'yohr',4);A(S,{rm:3});return '“어머, 무섭네.” 여인이 부채로 입을 가렸다. 웃는 눈 속에 독이 있었다.';}],['당신은 무엇 때문에 그럽니까',S=>{TK(S,'yohr',6);return '“…사내 하나가 협의를 말하며 나를 팔았어. 열네 살 때.” 부채가 잠깐 멈췄다. “그 뒤로 협의란 말이 우스워.”';}],['숨을 멈추고 물러선다',S=>{A(S,{mind:3});return '“눈치 빠르네.” 향이 독이었다. 숨을 멈춘 덕에 살았다.';}]]}],
 gwangma:[{min:-99,x:'허물어진 사당, 산발한 노인이 혼자 웃다가 운다. 그 둘레에 칼 맞은 산적 열이 누워 있다.',l:'“놀랐나? 이놈들은 마을 아이들을 팔았지. 그래서 내가 벴어. 그랬더니 사람들이 나보고 미쳤대. 아이를 판 놈들은 멀쩡하고, 그놈들을 벤 내가 미친 거야. 하하! 재미있지 않나?”',
   o:[['당신은 미치지 않았다',S=>{TK(S,'gwangma',8);return '노인이 웃음을 뚝 그쳤다. “…그 말을 들은 게 삼십 년 만이군.”';}],['그래도 다 죽일 것까지는 없었다',S=>{TK(S,'gwangma',3);return '“살려 두면 내일 또 팔지. 세상은 그렇게 돌아가. 그걸 보고도 멀쩡한 놈들이 진짜 미친 거야.”';}],['나도 미쳐 보겠다',S=>{TK(S,'gwangma',6);A(S,{temper:3});return '“좋아! 그런데 명심해. 세상이 미쳤으면 세상보다 딱 한 뼘만 더 미쳐. 두 뼘 미치면 너도 아이 파는 놈이 된다.”';}]],
   n:{l:'“제정신으로는 이 세상을 못 버텨. 그런데 너무 미치면 네가 그 세상이 되지. 그 한 뼘을 지키는 게 내 평생의 수련이었다.”',
    o:[['그 한 뼘을 어떻게 압니까',S=>{TK(S,'gwangma',6);A(S,{cult:4});return '“아이 눈을 봐. 아이가 너를 무서워하면 넘은 거다.”';}],['당신은 넘었습니까',S=>{TK(S,'gwangma',4);return '노인이 오래 말이 없었다. “…아마도. 그래서 혼자 사는 거다.”';}],['함께 술을 마신다',S=>{TK(S,'gwangma',8);A(S,{mood:5});return '노인은 산적들 무덤을 다 파 준 뒤에야 잔을 들었다. “죽은 놈은 죽은 놈이야. 묻어는 줘야지.”';}]]}}],
 pyeon:[{min:-99,x:'곤륜 골짜기 초막, 여인이 약초를 썰며 고개도 들지 않는다.',l:'“아픈 데가 없으면 가요. 아픈 사람들이 줄을 서 있어요.”',
   o:[['마음이 아픕니다',S=>{TK(S,'pyeon',8);return '여인이 처음으로 고개를 들었다. “…그건 약이 없어요. 앉아요. 차라도 줄게요.”';}],['약초 써는 걸 돕겠습니다',S=>{TK(S,'pyeon',6);A(S,{med:3});return '“칼질은 엉망인데 마음은 쓸 만하네요.”';}],['정말 천수를 늘립니까',S=>{TK(S,'pyeon',2);return '“늘리죠. 그런데 늘린 시간에 뭘 할지 모르는 사람은 안 늘려 줘요.”';}]]}],
 gusc:[{min:-99,x:'객잔 한복판, 백발 노인이 부채를 탁 치며 이야기를 시작하려다 당신을 본다.',l:'“오, 저 얼굴! 이야기가 있는 얼굴이야. 어이, 젊은이. 당신 이야기를 팔지 않겠소? 술 한 동이 값이오.”',
   o:[['내 이야기를 들려준다',S=>{TK(S,'gusc',8);A(S,{fame:5});return '노인이 당신 이야기를 들으며 눈물까지 흘렸다. 석 달 뒤 강남의 객잔마다 당신 이야기가 오르내렸다. 반은 지어낸 이야기였다.';}],['남의 이야기를 듣고 싶다',S=>{TK(S,'gusc',5);A(S,{lore:3});return '“그럼 천마와 검성 이야기를 하지. 진짜 이야기로.” 노인의 이야기는 소문과 많이 달랐다.';}],['이야기는 팔지 않는다',S=>{TK(S,'gusc',2);return '“아깝군. 그런 이야기는 꼭 남이 대신 지어내더라.”';}]]}],
 yongm:[{min:-99,x:'표국 마당, 등에 칼자국이 열몇 개인 사내가 짐수레를 살핀다.',l:'“표국 일은 간단하오. 맡은 짐을 그 자리에 가져다 놓는 것. 그 사이에 칼이 오든 비가 오든.”',
   o:[['목숨보다 짐입니까',S=>{TK(S,'yongm',4);return '“짐이 아니라 약속이오. 이 짐 안에는 누군가의 딸 혼수가 들었소.”';}],['표행을 돕겠습니다',S=>{TK(S,'yongm',8);A(S,{gold:30,exp:tb(S)*.3});return '사흘 표행에 산적이 두 번 나왔다. 사내는 등을 맡겼다. 끝나고 은자 서른 냥을 건네며 말했다. “표국 일 하고 싶으면 언제든 오시오.”';}],['칼자국은 몇 개입니까',S=>{TK(S,'yongm',6);return '“열넷. 짐은 하나도 안 잃었소.”';}]]}]});

const hd=S=>ORGS[S.org]?ORGS[S.org].ranks[4]:'장문인'; // 사문 수장의 호칭(장문인·가주·방주·궁주…)
E({id:'jpDescend',tag:'side',t:'하산',title:S=>ldr(S)?`${nnm(ldr(S),S)}의 당부`:'하산',a:[16,32],w:3,if:S=>FACTION(S)==='정파'&&!S.flags.jpDescend,
 x:S=>{const o=ORGS[S.org].n,id=ldr(S),nm=id?nnm(id,S):ORGS[S.org].ranks[4];return `처음으로 홀로 강호에 나가는 날. ${jo(nm,'이','가')} 산문 앞까지 배웅을 나왔다.\n\n“강호에 나가면 사람들은 너를 보고 ${jo(o,'을','를')} 볼 것이다. 네 칼이 비뚤면 ${o}의 칼이 비뚠 것이고, 네가 무릎을 꿇으면 ${jo(o,'이','가')} 무릎을 꿇은 것이다. 그러니 함부로 꿇지도, 함부로 베지도 마라.”`;},
 ch:[{t:'산문의 이름을 지키겠습니다',go:S=>{S.flags.jpDescend=1;A(S,{moral:5,fame:3});if(ldr(S))TK(S,ldr(S),10);return `${hd(S)}${bat(hd(S))?'이':'가'} 고개를 끄덕였다. 산문을 나서며 돌아보니, ${hd(S)}${bat(hd(S))?'은':'는'} 당신이 길모퉁이를 돌 때까지 그 자리에 서 있었다.`;}},
  {t:'저는 저로서 보이고 싶습니다',go:S=>{S.flags.jpDescend=1;A(S,{temper:2,cult:2});if(ldr(S))TK(S,ldr(S),4);return `${hd(S)}${bat(hd(S))?'이':'가'} 웃었다. “그것도 좋다. 다만 네 이름이 산문보다 커지면, 그때는 산문이 너를 보고 판단될 것이다. 그 무게도 지고 가라.”`;}},
  {t:'말없이 큰절을 올린다',go:S=>{S.flags.jpDescend=1;A(S,{cult:3});if(ldr(S))TK(S,ldr(S),8);return `이마가 돌계단에 닿았다. 일어났을 때 ${hd(S)}${bat(hd(S))?'은':'는'} 이미 등을 돌리고 있었다. 그 등이 조금 굽어 보였다.`;}}]});
E({id:'jpPurge',tag:'side',t:'명문의 그림자',a:[22,75],w:2,if:S=>FACTION(S)==='정파'&&S.realm>=3&&!S.flags.jpPurge&&!S.dead_npc.baekms,
 prep:S=>{S.tmp.foe=npcFoe(S,'baekms');S.met.baekms=1;},
 x:'산골 마을에서 아이들이 사라진다. 뒤를 밟으니 이름난 정파 장로, 천의검 백 무상의 장원이었다. 지하 창고에 쇠사슬에 묶인 아이들이 있었다. 백 무상이 부채를 접으며 웃었다.\n\n“정파의 이름으로 말하지. 이 일은 덮게. 문파와 문파 사이의 일이야. 자네 사문도 곤란해질 걸세.”',
 ch:[{t:'칼을 뽑는다',h:'싸움',go:S=>{S.flags.jpPurge=1;const b=battle(S,S.tmp.foe);if(b.win){S.dead_npc.baekms=1;A(S,{fame:30,moral:10});deed(S,'아이들을 팔던 정파 장로 천의검 백 무상을 처단했다');return fightText(b,'“네 칼과 내 칼을 한 저울에 올리지 마라. 네 칼은 아이들 목에 값을 매겼고, 내 칼은 그 값을 치르러 왔다. 그리고 그 입으로 다시는 정(正)을 말하지 마라. 글자가 더러워진다.” 백 무상이 쓰러졌다. 쇠사슬이 풀리는 소리가 밤새 울렸다.','');}A(S,{enemies:1});return fightText(b,'','백 무상의 검은 이름값을 했다. 쓰러진 당신을 그는 비웃었다. “정의는 강한 자의 것이네.” 그 말이 당신을 다시 일으켰다.');}},
  {t:'무림맹에 고발한다',h:'구력·명성',go:S=>{S.flags.jpPurge=1;if(S.tongue+S.fame/5+R(0,40)>=70){A(S,{fame:15,moral:5});deed(S,'무림맹에 고발해 천의검 백 무상의 죄를 밝혔다');S.dead_npc.baekms=1;return '맹의 장로들 앞에 아이들을 세웠다. 아이들의 손목에 남은 쇠사슬 자국이 어떤 말보다 컸다. 백 무상은 맹의 칼에 목이 떨어졌다.';}A(S,{mood:-12,enemies:1});return '고발장은 어디론가 사라졌다. 정파의 이름이 정파의 죄를 덮었다. 그날 밤 처음으로 사문의 이름이 무거웠다.';}},
  {t:'아이들만 몰래 빼낸다',h:'경공·심계',go:S=>{S.flags.jpPurge=1;if(chance(.3+S.qing/150+S.mind/150)){A(S,{moral:8,fame:5});return '그믐밤, 아이 열둘을 업고 담을 넘었다. 백 무상은 다음 날 창고가 빈 것을 알았다. 그가 누구를 찾는지 모두가 알았지만, 아무도 말하지 않았다.';}hurt(S,25,'천의검의 수하들');return '여섯은 구했다. 나머지 여섯은 구하지 못했다.';}}]});
E({id:'jpMercy',tag:'side',t:'포로의 목숨',a:[24,85],w:2,cd:10,if:S=>FACTION(S)==='정파'&&(S.w.demon>=1||S.w.pact==='broken'),
 x:'무림맹 대전. 붙잡힌 마교도 하나가 무릎 꿇려 있다. 열여섯도 안 되어 보이는 소년이다. 장로들이 처형을 외친다. “마교의 씨는 어려도 마교다!”',
 ch:[{t:'처형을 외치는 자들 앞에 선다',h:'도덕·명성',go:S=>{A(S,{moral:8,fame:8,enemies:1});return '“우리가 마교와 다른 것은 칼이 세서가 아닙니다. 칼을 거둘 줄 알아서입니다. 여기서 아이를 베면, 오늘부터 우리가 마교입니다.” 대전이 조용해졌다. 소년은 소림으로 보내졌다. 장로 몇은 그날부터 당신을 곱게 보지 않았다.';}},
  {t:'처형에 찬성한다',go:S=>{A(S,{moral:-4,contrib:10});return '칼이 내려왔다. 소년은 마지막까지 울지 않았다. 대신 그날 밤 당신이 잠들지 못했다.';}},

E({id:'sdDance',tag:'side',t:'칼과 술과 춤',a:[18,75],w:2.5,cd:8,if:S=>FACTION(S)==='사파'||(!S.org&&S.moral<=10&&!S.job),
 prep:S=>{S.met.nangis=1;},
 x:'강변 주루, 떠돌이 검객 하나가 술잔을 든 채 춤을 추었다. 칼끝이 술잔 둘레를 도는데 한 방울도 흘리지 않았다. 취검 낭 일소였다. 그가 노래했다.\n\n“칼은 달을 베고, 술은 칼을 데우고, 달은 술잔에 뜨네. 셋이 다 있으니 오늘 밤 이 흑도 사내는 부자요!”',
 ch:[{t:'칼을 뽑아 함께 춘다',h:'비무',go:S=>{const b=battle(S,npcFoe(S,'nangis'),{spar:1});TK(S,'nangis',b.win?12:8);A(S,{mood:12});return fightText(b,'칼과 칼이 부딪칠 때마다 술잔이 울렸다. 주루의 손님들이 장단을 맞췄다. 마지막 합에서 두 칼끝이 한 잔의 술을 나누어 베었다. 둘이 동시에 그 술을 받아 마셨다.','그의 칼은 춤이었고 당신의 칼은 아직 걸음이었다. 그래도 그가 웃었다. “좋은 걸음이오. 언젠가 춤이 되겠소.”');}},
  {t:'술 대결을 한다',h:'근골',go:S=>{TK(S,'nangis',8);return chance(.3+S.t.bone*.05)?'열두 독. 둘 다 쓰러져 강둑에 누웠다. 별이 빙빙 돌았다. 그가 중얼거렸다. “흑도에 태어나길 잘했소. 정파였으면 지금쯤 반성문을 쓰고 있을 거요.”':'다섯 독에 쓰러졌다. 깨어 보니 그가 당신 머리에 술을 붓고 있었다. “일어나쇼, 아직 달이 남았소.”';}},
  {t:'시 한 수로 답한다',h:'학문',go:S=>{TK(S,'nangis',S.lore>=30?12:5);A(S,{lore:2});return S.lore>=30?'“칼은 바람을 베고, 술은 시름을 벤다. 오늘 밤 베지 못한 건 달빛뿐이로다.” 그가 춤을 멈추고 당신 잔에 술을 따랐다. “이 시를 내 칼에 새겨도 되겠소?”':'시가 엉망이었다. 그래도 그는 박장대소했다. “엉망인 시가 제일 흑도답소!”';}}]});

 ch:[{t:'옥을 깬다',h:'싸움 · 관아의 원한',go:S=>{const b=battle(S,S.tmp.foe);if(b.win){A(S,{fame:10,contrib:20});S.flags.wanted=1;deed(S,'참수를 앞둔 흑도 형제를 옥에서 빼냈다');}return fightText(b,'새벽, 옥문이 부서졌다. 형제가 피 묻은 얼굴로 웃었다. “올 줄 알았다.” 둘은 말 한 필에 같이 타고 달렸다. 흑도에 그 이야기가 노래가 되어 돌았다.','관병이 너무 많았다. 형제는 형장에서 당신 쪽을 보고 고개를 끄덕였다. 원망이 아니었다.');}},
  {t:'몸값을 낸다',h:'은자 200',if:S=>S.gold>=200,go:S=>{A(S,{gold:-200,contrib:10});return '현령의 주머니가 두둑해졌고 형제는 풀려났다. 형제가 말했다. “이 빚은 목숨으로 갚는다.” 흑도에서 그 말은 빈말이 아니다.';}},

E({id:'sdRain',tag:'side',t:'빗속의 결투',a:[18,75],w:2,cd:6,if:S=>FACTION(S)==='사파',

  {t:'술부터 사겠다',go:S=>{A(S,{gold:-10,mood:6});return '“싸우기도 전에 지는 놈은 처음이오.” 낭인이 웃었다. 술을 마시고 나서 싸웠다. 둘 다 취해서 누가 이겼는지 기억나지 않았다.';}},
  {t:'돌아간다',go:S=>'“흑도 사내가 다리 하나를 못 건너다니.” 등 뒤로 웃음소리가 빗소리에 섞였다.'}]});

  {t:'놓아주고 약값을 보탠다',h:'원한 · 도덕↑',go:S=>{S.flags.sdBetray=1;A(S,{moral:8,gold:-Math.min(S.gold,50),enemies:1});return '동료는 딸을 업고 강남으로 떠났다. 련주는 아무것도 묻지 않았다. 그래서 더 무서웠다.';}},

E({id:'mgScheme',tag:'side',t:'부교주의 국화',a:[20,80],w:2,if:S=>FACTION(S)==='마교'&&!S.flags.mgScheme&&!S.dead_npc.eumsg,

  {t:'교주에게 고한다',h:'부교주의 원한',go:S=>{S.flags.mgScheme=1;A(S,{contrib:40,enemies:1});TK(S,'cheonma',6);TK(S,'eumsg',-20);return '교주는 끝까지 듣고 웃었다. “알고 있었다. 누가 먼저 말하러 오나 보고 있었지.” 다음 날 부교주는 여전히 국화를 가꾸었다. 당신을 보고 웃었다. 그 웃음이 등골을 타고 내려갔다.';}},
  {t:'양쪽에 다리를 걸친다',h:'심계',go:S=>{S.flags.mgScheme=1;if(chance(.35+S.mind/100)){A(S,{mind:5,gold:150,contrib:15});return '부교주에게는 교주의 동선을, 교주에게는 부교주의 서찰을. 둘 다 당신을 자기 사람이라 믿었다. 마교에서 살아남는 법을 하나 배웠다.';}hurt(S,30,'독침');A(S,{enemies:2});return '양쪽이 동시에 눈치챘다. 그날 밤 찻잔에 독이, 베개 밑에 독침이 있었다. 둘 다 피한 건 운이었다.';}}]});
E({id:'mgPlan',tag:'side',t:'귀모의 바둑',a:[22,80],w:2,if:S=>FACTION(S)==='마교'&&!S.flags.mgPlan,
 prep:S=>{S.met.sagong=1;},

 ch:[{t:'시킨 대로 한다',h:'공헌↑ 도덕↓↓',go:S=>{S.flags.mgPlan=1;A(S,{contrib:35,moral:-15});TK(S,'sagong',10);return '석 달 뒤, 화산과 종남이 피를 흘렸다. 서로 원수가 된 두 문파는 마교를 보지 못했다. 군사가 돌 하나를 판 위에 올렸다. “하나 잡았다.”';}},
  {t:'일부러 흔적을 남긴다',h:'도덕↑ · 들키면 위험',go:S=>{S.flags.mgPlan=1;A(S,{moral:6});if(chance(.5)){return '화산 장로 하나가 검의 주인이 그날 밤 화산에 있었음을 밝혔다. 계략은 어그러졌다. 군사가 바둑판을 오래 보다 말했다. “누군가 수를 틀었군.” 그 눈이 당신에게 머물렀다.';}hurt(S,30,'군사의 문책');A(S,{enemies:1});return '군사는 흔적을 먼저 지웠다. 그리고 당신을 불렀다. “바둑에서 돌이 제멋대로 움직이면 어떻게 되는지 아나?”';}},
  {t:'계략을 역이용해 공을 가로챈다',h:'심계',go:S=>{S.flags.mgPlan=1;if(chance(.3+S.mind/100)){A(S,{contrib:50,mind:5,fame:10});return '군사의 계략 위에 당신의 계략을 하나 더 얹었다. 교주 앞에서 공을 세운 것은 군사가 아니라 당신이었다. 군사가 웃었다. “제법이야. 이제 너는 판 위의 돌이 아니군. 적이지.”';}A(S,{enemies:1});TK(S,'sagong',-10);return '군사는 세 수 앞을 보고 있었다. 당신의 계략은 그의 계략 안에 이미 들어 있었다.';}}]});
E({id:'mgMad',tag:'side',t:'광마',a:[25,95],w:S=>FACTION(S)==='마교'?2:1,if:S=>!S.flags.mgMad&&!S.dead_npc.gwangma&&!S.job,
 prep:S=>{S.met.gwangma=1;},
 x:'허물어진 사당에서 산발한 노인이 웃는다. 그 발밑에 인신매매꾼 열이 쓰러져 있다. 광마 단 광천이다.\n\n“이 세상에서 멀쩡한 정신은 사치야. 세상이 미친 만큼에서 딱 한 뼘만 더 미쳐. 두 뼘은 안 돼. 두 뼘이면 네가 그 세상이 되거든.”',
 ch:[{t:'그 한 뼘을 배우겠다',h:'성정↑ 깨달음',go:S=>{S.flags.mgMad=1;TK(S,'gwangma',10);A(S,{exp:tb(S)*.8,temper:4});return '노인은 사흘 동안 미친 듯이 웃으며 칼을 휘둘렀다. 초식이 없었다. 그런데 막을 수가 없었다. “봐라, 미친 칼은 읽히지 않아. 다만 아이 앞에서는 늘 칼을 멈춰라. 그게 한 뼘이다.”';}},
  {t:'미치지 않고도 버티겠다',h:'수양',go:S=>{S.flags.mgMad=1;TK(S,'gwangma',6);A(S,{cult:5});return '노인이 웃음을 멈추고 당신을 보았다. “…그런 놈이 가끔 있지. 그런 놈이 제일 미친 놈이야. 존경한다.”';}},
  {t:'칼을 뽑는다',h:'싸움',go:S=>{S.flags.mgMad=1;const b=battle(S,npcFoe(S,'gwangma'),{spar:1});TK(S,'gwangma',b.win?10:5);return fightText(b,'노인이 칼을 맞고도 웃었다. “좋아! 미친놈 하나 더 생겼군!”','노인의 칼은 춤도 법도 없었다. 정신을 차리니 사당 지붕 위에 매달려 있었다. 노인이 웃었다. “아직 덜 미쳤군.”');}}]});
E({id:'mgTrial',tag:'side',t:'피의 서열',a:[18,65],w:2,cd:10,if:S=>FACTION(S)==='마교',
 x:'서열을 가리는 날. 장로가 대진표를 펼쳤다. 첫 상대는 같은 해 입문해 같은 우리에서 살아 나온 동기다. “마교에서 서열은 목숨이다. 살려 두면 내일 너를 벤다.”',
 ch:[{t:'벤다',h:'공헌↑ 도덕↓',go:S=>{A(S,{contrib:30,moral:-10,salgi:4,mood:-15});return '동기는 마지막에 웃었다. “잘했다. 나였어도 그랬을 거야.” 그 웃음이 마교에서 들은 유일한 진심이었다.';}},
  {t:'칼등으로 친다',h:'장로의 눈 밖에 난다',go:S=>{A(S,{moral:5,contrib:5,enemies:1});return '동기는 살았다. 장로가 혀를 찼다. “물러터진 놈.” 그날 밤 동기가 찾아와 술을 놓고 갔다. 마교에서 술은 맹세다.';}},
  {t:'장로 앞에서 둘 다 사는 법을 내민다',h:'구력·심계',go:S=>{if(S.tongue+S.mind+R(0,40)>=80){A(S,{contrib:20,mind:3});return '“죽은 개는 짖지 못하고 산 개는 두 마리면 문을 지킵니다.” 장로가 처음으로 웃었다. 둘 다 같은 대에 들었다.';}hurt(S,20,'장로의 손찌검');return '장로가 손등으로 당신 뺨을 쳤다. “말은 칼을 든 놈이 하는 거다.”';}}]});
E({id:'mgYoma',tag:'side',t:'요마의 부탁',a:[20,75],w:2,if:S=>FACTION(S)==='마교'&&!S.flags.mgYoma,
 prep:S=>{S.met.yohr=1;S.met.songhak=1;},
 x:'요마 요 화령이 부채로 당신 턱을 들어 올렸다. “무당의 어린 도사, 청송검 진 송학. 순진하기가 백지 같아. 그 아이를 계곡으로 데려와. 내가 마무리할게. 아, 같이 다치진 않게 해 줄게.”',
 ch:[{t:'시킨 대로 한다',h:'공헌↑ 도덕↓↓',go:S=>{S.flags.mgYoma=1;S.dead_npc.songhak=1;A(S,{contrib:30,moral:-18,mood:-10});TK(S,'yohr',10);return '도사는 끝까지 당신을 믿었다. 계곡에 그의 짐 셋이 남았다. 약속은 끝내 지켜지지 못했다.';}},
  {t:'몰래 도사에게 알린다',h:'요마의 원한',go:S=>{S.flags.mgYoma=1;A(S,{moral:10,enemies:1});TK(S,'songhak',10);TK(S,'yohr',-15);return '“계곡으로 가지 마시오.” 쪽지 한 장. 도사는 가지 않았다. 요마의 부채가 부러지는 소리를 들었다는 시녀가 있었다.';}},
  {t:'요마를 역으로 속인다',h:'심계',go:S=>{S.flags.mgYoma=1;if(chance(.3+S.mind/100)){A(S,{contrib:15,mind:5});TK(S,'yohr',4);return '도사 대신 정파의 첩자를 계곡으로 보냈다. 요마는 “어머, 실수했네” 하고 웃었다. 그 웃음이 무서웠다. 알고 있었던 것이다.';}hurt(S,25,'요마의 독향');return '요마가 웃었다. “나를 속이려면 백 년은 일러.” 향을 맡고 사흘을 앓았다.';}}]});
E({id:'mgFeast',tag:'side',t:'잔칫날의 독',a:[20,85],w:1.5,cd:12,if:S=>FACTION(S)!=='마교'&&(S.w.demon>=1||S.w.pact==='broken')&&!S.job,
 x:'정파 세가의 혼례 잔치. 하객이 천 명이다. 그런데 술을 나르는 시녀의 손톱 밑이 푸르다. 마교의 수법이다. 이 잔치에 정파 장로 열이 앉아 있다.',
 ch:[{t:'술독을 엎는다',h:'명성·도덕',go:S=>{A(S,{fame:15,moral:6});deed(S,'혼례 잔치에서 마교의 독을 막았다');return '술독이 깨지자 바닥에서 연기가 올랐다. 하객들이 비명을 질렀다. 시녀는 이미 사라지고 없었다. 신부가 당신에게 큰절을 했다.';}},
  {t:'시녀를 쫓는다',h:'싸움',go:S=>{const b=battle(S,mkFoe({n:'마교 첩자',realm:clamp(S.realm,2,5),q:1}),{spar:1});if(b.win)A(S,{fame:10,moral:4});return fightText(b,'첩자를 붙잡았다. 품에서 나온 명단에는 정파 장로 셋의 이름이 더 있었다. 귀모의 글씨였다.','첩자가 독연을 뿌리고 사라졌다. 술은 이미 돌았다. 장로 둘이 쓰러졌다.');}},
  {t:'의술로 해독약을 만든다',h:'의술 30',if:S=>S.med>=30,go:S=>{A(S,{med:4,fame:12,moral:6});return '부엌에서 감초와 녹두와 생강을 끓였다. 하객 천 명이 쓴 국물을 한 사발씩 마셨다. 아무도 죽지 않았다.';}}]});

/* ══ 인물지: 내력과 나와의 일 ══ */
const SAMA=['gwangma','dokma','geomma','yohr']; // 사마(四魔): 광마·독마·검마·요마
const NPC_BIO={
 cheonma:'백 년 전 화산 정상에서 검성과 사흘 밤낮을 싸우다 사라졌던 천마. 봉인에서 깨어나 보니 이길 상대가 없는 세상이었다. 강함 말고는 아무것도 믿지 않지만, 별을 보는 버릇만은 백 년 전 그대로다.',
 geomseon:'무당의 은거 기인. 젊어서 천하제일검 소리를 들었으나 검을 버리고서야 신선 소리를 들었다. 바둑판 앞에서 사흘 동안 돌 하나를 쥐고 있곤 한다.',
 buljon:'소림 방장의 사숙. 한때 마두 셋을 맨손으로 잡았다는 전설이 있으나 본인은 웃기만 한다. 찻집에서 사람 얼굴을 읽는 것을 즐긴다.',
 muhwang:'어느 문파에도 속하지 않은 화경 최상위의 고수. 산골 농사꾼의 아들로 열여섯에 황소와 힘을 겨루다 진 뒤로 하루도 수련을 거른 적이 없다. 천하제일인 자리에 관심이 없다.',
 gumwang:'남궁세가의 가주이자 천하제일검. 그 이름을 얻으려고 많은 것을 버렸다. 아내의 임종을 비무 때문에 보지 못했고, 그 빈자리를 딸 서린에게 엄격함으로 채우려 한다.',
 geomma:'사마(四魔)의 하나, 검마. 검에 미쳐 사부를 베고 묻었다. 정파가 검에 미치면 검성, 자신이 미치면 검마라 부르는 세상을 비웃는다. 마교의 장로지만 마교의 대의에는 관심이 없다.',
 hyeolma:'혈교의 교주. 피로 내공을 쌓는 혈천대법의 주인이다. 마교에서도 내놓은 자식으로, 맹약이 깨지면 가장 먼저 움직인다.',
 dokma:'사마(四魔)의 하나, 독마. 사천당가에서 독으로 사람을 살리는 법을 연구하다 파문당했다. 마교의 객경이 되었으나 지금도 해독약을 만든다. 독경(毒經) 반 권을 품고 다닌다.',
 geolwang:'개방 방주. 굶어 죽은 사부가 마지막 만두를 길가 아이에게 주었는데, 그 아이가 바로 그다. 늘 취해 있어 실력을 아는 이가 없다. 맛있는 요리가 있는 곳이면 어디든 나타난다.',
 nokrim:'녹림맹주. 열 살 때 흉년에 산으로 올라와 도적이 되었다. 주먹으로 칠십이 채를 묶었다. 산채 꼭대기에서 고향 마을의 불빛을 보는 버릇이 있다.',
 geomhu:'아미파 장로. 실력 하나로 검후라 불린다. 장문인 정혜 사태와는 한 스승 아래 자랐다.',
 maengju:'정천신산. 무림맹을 이끄는 책사로 열 수 앞을 본다. 정마대전에서 마을 하나를 버려 천 명을 살린 뒤로 매일 밤 그 마을 이름을 외운다.',
 myoyeong:'하오문주. 얼굴이 천 개라 그 얼굴을 본 사람마다 생김새를 다르게 말한다. 강호의 모든 소문은 결국 그녀의 귀에 닿는다.',
 sadoyeom:'귀영루주. 그를 본 자는 모두 죽었다는 말이 있다. 돈을 받으면 누구든 죽이지만, 아이를 죽이는 의뢰만은 받지 않는다.',
 hwayoung:'만화궁주, 백화마후. 젊어서 사랑한 사내에게 버림받은 뒤 시들지 않는 꽃을 만들겠다며 독과 음공을 익혔다. 딸 화 연을 그렇게 키웠다. 그 사내가 좋아하던 곡을 아직 손가락이 기억한다.',
 binghu:'북해빙궁의 궁주. 빙백신공을 익혀 마음까지 얼었다고 한다. 얼음처럼 공정하지만, 차가 식는 것을 아쉬워하는 사람이다.',
 amje:'살막의 막주. 이름도 얼굴도 없다. 아이들을 납치해 살수로 기르는 살막의 정점. 살막을 빠져나간 자는 그가 직접 찾는다.',
 guya:'구야자의 후예라 자칭하는 늙은 대장장이. 평생 칼을 벼렸고, 요즘은 그 칼들이 몇이나 죽였는지 세어진다고 한다. 그가 만든 가장 좋은 칼은 "아직 안 만들었다".',
 cheongun:'화산파가 백 년 만에 얻은 기재, 화산신룡. 오만하고 싸가지가 없지만 밤마다 몰래 연무장에 나가는 노력파다. 언젠가 마교의 매복에 팔을 잃을 운명이 기다린다.',
 soso:'아미의 막내 기재. 늘 웃지만 금정 절벽에서 혼자 울기도 한다. 장문인이 후계로 정하면 머리를 깎아야 한다.',
 seorin:'검왕의 고명딸, 천하제일미. 사람들은 얼굴만 보지만 그녀는 검을 봐 달라고 한다. 아버지가 정한 혼약과 자기 검 사이에서 흔들린다.',
 hwayeon:'만화궁 소궁주. 어머니 백화마후에게 독과 금(琴)을 배웠다. 부채 하나로 사내들을 쓰러뜨리지만, 정작 자기 마음을 고르는 법은 배우지 못했다.',
 sohye:'사천당가의 막내. 한여름에도 비단 장갑을 벗지 않는다. 몸 안의 독이 언젠가 심장에 닿는다는 걸 알고 있다.',
 hyun:'남궁세가 소가주, 창궁옥룡. 옥으로 깎은 듯한 얼굴과 검왕의 그림자를 함께 물려받았다.',
 jegalun:'정천신산의 조카. 시와 진법에 능하나 몸이 약해 피를 토한다. 반쯤 쓴 시가 서랍에 가득하다.',
 mugyeol:'당가의 차기 가주감, 독룡. 하루에 열 마디도 하지 않는다. 형제가 독살된 날 모두가 그를 의심했다.',
 ha:'천마의 하나뿐인 자식. 정체를 숨기고 강호를 떠돈다. 아버지가 무림을 피로 덮는 것을 원하지 않는다.',
 hyeono:'소림의 방장. 화를 내는 걸 본 사람이 없다. 대웅전 앞 낙엽을 손수 쓴다. 강호의 악도 그렇게 쓸어야 한다고 믿는다.',
 cheongjin:'무당의 장문인. 백 살 넘은 거북이와 함께 자소궁 뜰을 지킨다. 제자가 위험할 때만 무당에서 제일 빠른 사람이 된다.',
 unhak:'화산 장문인, 매화검존. 매 청운의 사부. 정파는 이길 수 있을 때 멈출 줄 알아서 정파라 가르친다.',
 jeonghye:'아미의 장문인. 제자들 앞에서는 한 번도 울지 않았다. 대신 금정 절벽에 올라 바람에 운다.',
 unjung:'곤륜의 장문인, 운룡검. 곤륜의 경공은 남보다 먼저 닿기 위해 배운다고 가르친다.',
 tangcw:'사천당가의 가주, 만천수. 웃는 얼굴 뒤에 바늘 천 개를 숨겼다. 독마를 파문한 장본인이다.',
 paengmj:'하북팽가의 가주, 벽력도왕. 고함 한 번에 술잔이 깨진다. 말은 짧고 도는 길다.',
 songhak:'무당의 젊은 도사, 청송검. 고지식할 만큼 바르다. 약속을 했다면 할머니의 짐 셋도 산 너머까지 진다.',
